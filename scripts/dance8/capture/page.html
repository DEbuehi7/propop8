<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance8 · Reading your moves</title>
<style>
  :root { --bg: #0b0d12; --panel: #141821; --ink: #e8ecf5; --dim: #9aa3b5; --line: #2a3040; --accent: #00bae1; --bad: #ff8a7a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6fa; --panel: #ffffff; --ink: #141821; --dim: #5a6275; --line: #d8dde8; --accent: #007a96; --bad: #b3261e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #status { margin: 0 0 10px; font-variant-numeric: tabular-nums; }
  #status.bad { color: var(--bad); }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  canvas { display: block; width: 100%; max-height: 62vh; object-fit: contain; margin-top: 14px; border-radius: 8px; background: #000; }
  .note { color: var(--dim); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Reading your moves</h1>
  <p class="sub">Dance8 is tracking 33 body points in each frame. Your video stays on this computer.</p>
  <div class="panel">
    <p id="status">Loading the body tracker…</p>
    <progress id="bar" max="1" value="0"></progress>
    <canvas id="view" width="16" height="9"></canvas>
    <p class="note">The lines drawn on you are what the tracker sees. Keep this tab open until it says done; the Terminal shows the result.</p>
  </div>
</main>
<script type="module">
const key = new URLSearchParams(location.search).get("k");
const $ = (id) => document.getElementById(id);
const status = (t, bad = false) => { $("status").textContent = t; $("status").className = bad ? "bad" : ""; };
const post = (path, body) => fetch(`${path}?k=${key}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
const r4 = (x) => Math.round(x * 1e4) / 1e4;
const flat = (pts) => pts.flatMap((p) => [r4(p.x), r4(p.y), r4(p.z), Math.round((p.visibility ?? 0) * 1000) / 1000]);

try {
  const job = await (await fetch(`/job?k=${key}`)).json();
  const { FilesetResolver, PoseLandmarker } = await import("/mp/vision_bundle.mjs");
  const fileset = await FilesetResolver.forVisionTasks("/mp/wasm");
  const make = (delegate) => PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: `/model?k=${key}`, delegate }, runningMode: "VIDEO", numPoses: 1,
  });
  const links = PoseLandmarker.POSE_CONNECTIONS ?? [];
  const cv = $("view"), ctx = cv.getContext("2d");
  const total = job.takes.reduce((a, t) => a + t.frames, 0);
  let doneAll = 0;

  for (const [ti, take] of job.takes.entries()) {
    let delegate = "GPU", lm;
    try { lm = await make("GPU"); } catch { delegate = "CPU"; lm = await make("CPU"); }
    cv.width = take.width; cv.height = take.height;
    const frames = [];
    const fetchFrame = (i) => fetch(`/frame/${ti}/${i}?k=${key}`).then((r) => { if (!r.ok) throw new Error(`frame ${i}: HTTP ${r.status}`); return r.blob(); }).then((b) => createImageBitmap(b));
    let next = fetchFrame(0);
    for (let i = 0; i < take.frames; i++) {
      const bmp = await next;
      if (i + 1 < take.frames) next = fetchFrame(i + 1);
      // Video mode tracks from frame to frame; timestamps must rise.
      const r = lm.detectForVideo(bmp, Math.round((i * 1000) / take.fps));
      const im = r.landmarks?.[0], w = r.worldLandmarks?.[0];
      frames.push({ image: im ? flat(im) : null, world: w ? flat(w) : null });
      if (i % 2 === 0) {
        ctx.drawImage(bmp, 0, 0);
        if (im) {
          ctx.lineWidth = Math.max(2, take.width / 300); ctx.strokeStyle = "#00bae1"; ctx.fillStyle = "#e8ecf5";
          for (const { start, end } of links) {
            ctx.beginPath(); ctx.moveTo(im[start].x * take.width, im[start].y * take.height); ctx.lineTo(im[end].x * take.width, im[end].y * take.height); ctx.stroke();
          }
          for (const p of im) { ctx.beginPath(); ctx.arc(p.x * take.width, p.y * take.height, ctx.lineWidth * 1.2, 0, 7); ctx.fill(); }
        }
      }
      bmp.close();
      doneAll++;
      if (i % 30 === 0 || i === take.frames - 1) {
        $("bar").value = doneAll / total;
        status(`Take ${ti + 1} of ${job.takes.length} (${take.id}): frame ${i + 1} of ${take.frames}${delegate === "CPU" ? " · on the processor, slower" : ""}`);
        post("/progress", { take: ti, done: i + 1 });
      }
    }
    lm.close();
    status(`Saving take ${take.id}…`);
    const res = await post(`/result/${ti}`, { delegate, frames });
    if (!res.ok) throw new Error(`saving ${take.id}: HTTP ${res.status}`);
  }
  $("bar").value = 1;
  status("Done. You can close this tab; the Terminal has your moves.");
} catch (e) {
  const msg = String(e?.message ?? e).split("\n")[0].trim();
  status(`Stopped: ${msg}`, true);
  post("/fail", { message: msg });
}
</script>
</body>
</html>

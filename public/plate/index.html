/* ── the geometry board ─────────────────────────────────
   Knights draw as rings at radius sqrt(5) — closed curves, because
   nothing can stand between a knight and its square. Sliders draw
   as rays that stop dead at the first piece they meet. Underneath,
   a soft field shows who controls what.                            */
function drawGeom(){
  const c=$('#bGeom'); if(!c)return;
  const g=fitCanvas(c); if(!g)return; const {x,w,h}=g;
  const G=geometry(S);
  const S8=Math.min(w,h)*0.92, ox=(w-S8)/2, oy=(h-S8)/2, u=S8/8;
  const cx=i=>ox+(i%8+0.5)*u, cy=i=>oy+((i/8|0)+0.5)*u;

  const bg=x.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#15111F'); bg.addColorStop(1,'#09080D');
  x.fillStyle=bg; x.fillRect(0,0,w,h);

  // control field — soft radial wash per square, no hard edges
  for(let i=0;i<64;i++){
    const v=G.reach[i]; if(!v)continue;
    const t=clamp(Math.abs(v)/4,0,1);
    const rg=x.createRadialGradient(cx(i),cy(i),0,cx(i),cy(i),u*0.78);
    const col = v>0 ? '143,240,186' : '242,150,145';   // you green, the engine rose — the card's colours
    rg.addColorStop(0,`rgba(${col},${(0.05+t*0.30).toFixed(3)})`);
    rg.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle=rg; x.beginPath(); x.arc(cx(i),cy(i),u*0.78,0,7); x.fill();
  }
  // grid, hairline
  x.strokeStyle='rgba(255,255,255,.045)'; x.lineWidth=1;
  for(let k=0;k<=8;k++){
    x.beginPath(); x.moveTo(ox+k*u,oy); x.lineTo(ox+k*u,oy+S8); x.stroke();
    x.beginPath(); x.moveTo(ox,oy+k*u); x.lineTo(ox+S8,oy+k*u); x.stroke();
  }
  // vectors first, so rings sit above them
  x.lineCap='round';
  for(let i=0;i<64;i++){
    const p=S.b[i]; if(!p||p[1]==='n'||p[1]==='p')continue;
    if(!'brqk'.includes(p[1]))continue;
    const mine=p[0]==='w';
    for(const ray of rays(S.b,i,p[1])){
      if(!ray.squares.length)continue;
      const end=ray.squares[ray.squares.length-1];
      const gx=x.createLinearGradient(cx(i),cy(i),cx(end),cy(end));
      const base=mine?'143,240,186':'242,150,145';
      gx.addColorStop(0,`rgba(${base},.42)`);
      gx.addColorStop(1,`rgba(${base},.05)`);
      x.strokeStyle=gx; x.lineWidth=mine?1.7:1.4;
      x.beginPath(); x.moveTo(cx(i),cy(i)); x.lineTo(cx(end),cy(end)); x.stroke();
      if(ray.blocker!==null){                       // where the line dies
        x.fillStyle=`rgba(${base},.55)`;
        x.beginPath(); x.arc(cx(end),cy(end),2.4,0,7); x.fill();
      }
    }
  }
  // knight rings — the sqrt(5) circle, drawn as the closed curve it is
  for(let i=0;i<64;i++){
    const p=S.b[i]; if(!p||p[1]!=='n')continue;
    const mine=p[0]==='w', R=u*KNIGHT_R;
    x.save();
    x.shadowColor = mine?rgba(TONE.mate.c,.6):rgba(OPC,.55);
    x.shadowBlur = 14;
    x.strokeStyle = mine?rgba(MYC,.88):rgba(OPC,.85);
    x.lineWidth=1.6; x.setLineDash([3,5]);
    x.beginPath(); x.arc(cx(i),cy(i),R,0,7); x.stroke();
    x.restore(); x.setLineDash([]);
    for(const t of ring(S.b,i,p[0])){              // the eight lattice points
      x.fillStyle = mine?rgba(MYC,.95):rgba(OPC,.95);
      x.beginPath(); x.arc(cx(t.sq),cy(t.sq),3.1,0,7); x.fill();
    }
  }
  // pieces, as soft discs sized by value
  for(let i=0;i<64;i++){
    const p=S.b[i]; if(!p)continue;
    const rad=3.5+Math.min(VAL[p[1]],900)/170;
    x.save(); x.shadowColor='rgba(0,0,0,.6)'; x.shadowBlur=7; x.shadowOffsetY=2;
    const pg=x.createRadialGradient(cx(i)-rad*.35,cy(i)-rad*.35,rad*.15,cx(i),cy(i),rad);
    if(p[0]==='w'){ pg.addColorStop(0,'#F6F2FF'); pg.addColorStop(1,'#B49BFF') }
    else          { pg.addColorStop(0,'#7A52EE'); pg.addColorStop(1,'#26145C') }
    x.fillStyle=pg; x.beginPath(); x.arc(cx(i),cy(i),rad,0,7); x.fill();
    x.restore();
  }
  x.font='500 9.5px "IBM Plex Mono",monospace';
  x.fillStyle='rgba(243,242,248,.5)';
  x.fillText(`rings ${G.radial.w}/${G.radial.b}   vectors ${G.vector.w}/${G.vector.b}`,8,h-8);
}

/* image-3 flow: three streams converge into the control matrix */
let flow=null, P=[];
function seedFlow(){
  P=[]; for(let i=0;i<190;i++)P.push({ln:i%3,t:Math.random(),s:.004+Math.random()*.006,cell:(Math.random()*64)|0});
}
const LCOL=['#4ADE80','#22D3EE','#F472B6'], LNAME=['value','position','tempo'];
function drawFlow(){
  const c=$('#bFlow'); if(!c)return;
  const g=fitCanvas(c); if(!g)return; const{x,w,h}=g;
  const pr=parts(S), cm=controlMap(S.b);
  const mag=[Math.abs(pr.mat),Math.abs(pr.pos),Math.abs(pr.tempo)];
  const mx=Math.max(60,...mag);
  x.fillStyle='#0D0B13'; x.fillRect(0,0,w,h);
  const neck=w*.46, gridX=w*.56, cell=Math.min((w-gridX-6)/8,(h-10)/8);
  const gy=(h-cell*8)/2;
  // matrix — density of lit dots per cell encodes control
  for(let i=0;i<64;i++){
    const r=i/8|0,cc=i%8, v=cm[i], p=S.b[i];
    const cx0=gridX+cc*cell, cy0=gy+r*cell;
    x.fillStyle='#15121D'; x.fillRect(cx0,cy0,cell-1,cell-1);
    const lit=Math.abs(v), col=v>0?MYC:OPC;
    for(let k=0;k<lit;k++){
      const a=(k%2)*.5+.25, b=((k/2)|0)*.5+.25;
      x.fillStyle=col; x.globalAlpha=.55+lit*.1;
      x.fillRect(cx0+a*cell-1,cy0+b*cell-1,2.2,2.2);
    }
    x.globalAlpha=1;
    if(p){x.fillStyle=p[0]==='w'?'rgba(243,242,248,.9)':'rgba(120,120,140,.85)';
      const s=Math.min(cell*.42,3+VAL[p[1]]/260);
      x.beginPath();x.arc(cx0+cell/2,cy0+cell/2,s,0,7);x.fill()}
  }
  // streams
  for(const p of P){
    const ln=p.ln, sy=h*(.22+ln*.28), col=LCOL[ln];
    const ty=gy+((p.cell/8|0)+.5)*cell, tx=gridX+((p.cell%8)+.5)*cell;
    p.t+=p.s*(.35+mag[ln]/mx*1.5);
    if(p.t>1){p.t=0;p.cell=(Math.random()*64)|0}
    const t=p.t;
    const x1=lerp(4,neck,Math.min(1,t/.62)), y1=lerp(sy,h/2,Math.min(1,t/.62)*(t<.62?1:1));
    let px,py;
    if(t<.62){const u=t/.62; px=lerp(4,neck,u); py=sy+(h/2-sy)*(u*u*(3-2*u))}
    else{const u=(t-.62)/.38; px=lerp(neck,tx,u); py=lerp(h/2,ty,u*u*(3-2*u))}
    x.globalAlpha=.25+mag[ln]/mx*.6;
    x.fillStyle=col; x.fillRect(px,py,t<.62?4:2,1.4);
    x.globalAlpha=1;
  }
  // lane labels + magnitudes
  x.font='500 9px "IBM Plex Mono",monospace';
  [0,1,2].forEach(i=>{const sy=h*(.22+i*.28);
    x.fillStyle=LCOL[i]; x.fillRect(2,sy-6,2.5,12);
    x.fillStyle='rgba(243,242,248,.72)'; x.fillText(LNAME[i],8,sy-8);
    const v=[pr.mat,pr.pos,pr.tempo][i];
    x.fillStyle=LCOL[i]; x.fillText((v>0?'+':'')+(v/100).toFixed(2),8,sy+14)});
}

function fitBoard(){
  const sc=$('.mod[data-m="mate"] .pane[data-p="play"] .scroll'), wrap=$('#boardWrap'), bd=$('#board');
  if(!sc||!wrap||!bd||!sc.clientHeight)return;
  const cs=getComputedStyle(sc);
  let other=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  for(const ch of sc.children){
    if(ch===wrap||ch.hidden)continue;
    const st=getComputedStyle(ch); if(st.display==='none')continue;
    other+=ch.offsetHeight+parseFloat(st.marginTop)+parseFloat(st.marginBottom);
  }
  const capW=Math.min(sc.clientWidth-2,innerWidth>=680?420:Math.min(innerWidth*.88,390));
  let size=Math.floor(Math.max(208,Math.min(capW,sc.clientHeight-other-6)));
  wrap.style.maxWidth=size+'px';
  /* one correction pass: whatever the sum above missed (margins collapsing,
     a wrapped control row) shows up as overflow, so take it back off */
  const over=sc.scrollHeight-sc.clientHeight;
  if(over>0&&size>208){ size=Math.max(208,size-over-2); wrap.style.maxWidth=size+'px' }
  bd.style.setProperty('--sqf',(size/8*.74).toFixed(1)+'px');
}

/* ═══════════════ SKATE — blue · F1TENTH-style AI racing ══
   Cars are proportional filled squares (image 4). They carry
   a simulated LiDAR, build a shared occupancy grid (SLAM),
   and drive by pure pursuit on a computed racing line or by
   follow-the-gap when something is in the way. Terrain is a
   flow field (image 8) with the ribbon carved through it.   */
mod('skate',()=>{
const W=1200,H=760, GW=120,GH=76, CS=W/GW;            // grid cell = 10 world units
const HALF=44, FOV=Math.PI*1.15, RMAX=190, STEP=6;
/* Kinematic bicycle model, the standard F1/10 plant. L is the wheelbase,
   LR the rear-axle-to-CoG distance, DMAX the steering limit.            */
const L=16, LR=8, DMAX=0.34, KLD=2.6, LDMIN=26, KSTANLEY=1.15, GRAV=0.055;
/* The plant now has a grip budget. MU is the lateral acceleration the
   deck can hold, in world units per tick squared — the same units the
   longitudinal numbers are already in, so one friction circle governs
   both. A_ACC and A_BRK are what the rider can actually add and shed. */
const VTOP=5.4, A_ACC=.085, A_BRK=.16;
let MU=.052;
let KAP=null, DS=null, VP=null, SECN=3;
let secBest=[null,null,null], contacts=0;
let RAYS=31, PACE=1.0, LOOKF=1.0;      // live tuning
const PRESETS=[
 [[250,430],[300,230],[470,140],[690,150],[800,250],[900,180],[1030,190],[1120,320],[1080,470],[930,560],[780,500],[660,560],[520,650],[350,640]],
 [[600,110],[860,150],[1060,270],[1120,440],[1000,600],[800,660],[640,600],[560,470],[470,570],[330,620],[210,510],[230,330],[360,190]],
 [[200,300],[420,180],[700,170],[980,240],[1100,420],[980,600],[720,650],[520,600],[420,470],[300,430]]
];
let CTRL=PRESETS[0], PTS=[], RL=[], mask, obsGrid, learn, terrain, obstacles=[];
const OBS=['off','static','dynamic','moving']; let obsMode='static', obsClock=0;
let cars=[], drive=false, bestLap=null, lapLog=[], trackId=0, drawing=null;
const CR=19;   // deck-to-deck clearance, used by both the scan and contact
let hillsOn=true, rampIdx=null, ramps=[], elev=null;
const ctl={left:0,right:0,gas:0,brake:0};
/* four riders, one categorical set: the lead takes the instrument's blue,
   the rest sit far from it and from each other in hue and lightness —
   white, violet, pink. No yellow, and nothing that dims to brown. */
const COL=[TONE.skate.c,'#EDEBF5','#C7A0FF','#FF94C2'];

function resample(ct){
  const out=[],n=ct.length;
  for(let i=0;i<n;i++){
    const p0=ct[(i-1+n)%n],p1=ct[i],p2=ct[(i+1)%n],p3=ct[(i+2)%n];
    for(let s=0;s<16;s++){const t=s/16,t2=t*t,t3=t2*t;
      out.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}
  } return out}
const norm=i=>{const N=PTS.length,a=PTS[(i-3+N)%N],b=PTS[(i+3)%N];
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1; return[-dy/d,dx/d]};
function signedCurv(i){const N=PTS.length,a=PTS[(i-8+N)%N],b=PTS[i],c=PTS[(i+8)%N];
  let d=Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]);
  while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d}
/* ═══ THE LINE ═════════════════════════════════════════════
   Curvature flow inside the track corridor. Every point is
   allowed to slide along its own normal only, and is pulled
   toward the midpoint of its neighbours — which is exactly the
   move that reduces discrete curvature — then clamped so the
   line never leaves the tarmac. Gauss-Seidel, so a correction
   propagates around the lap within one sweep. The old version
   was a smoothed curvature heuristic; this actually minimises
   something, and it cuts apexes the way a rider does.
   ═══════════════════════════════════════════════════════ */
const RL_LIM=()=>HALF*.74;                 // keep a wheel's width off the kerb
function buildRacingLine(){
  const N=PTS.length, LIM=RL_LIM();
  const off=new Float32Array(N), nrm=new Array(N);
  for(let i=0;i<N;i++){ nrm[i]=norm(i); off[i]=-clamp(signedCurv(i)*4.2,-1,1)*LIM*.8 }
  const px=i=>PTS[i][0]+nrm[i][0]*off[i], py=i=>PTS[i][1]+nrm[i][1]*off[i];
  for(let it=0;it<220;it++){
    const w=it<90?.42:.22;                 // coarse then fine
    for(let i=0;i<N;i++){
      const a=(i-1+N)%N, c=(i+1)%N;
      const mx=(px(a)+px(c))/2, my=(py(a)+py(c))/2;
      const d=(mx-PTS[i][0])*nrm[i][0]+(my-PTS[i][1])*nrm[i][1];
      off[i]=clamp(off[i]+w*(d-off[i]),-LIM,LIM);
    }
  }
  RL=PTS.map((p,i)=>[p[0]+nrm[i][0]*off[i],p[1]+nrm[i][1]*off[i]]);
  buildProfile();

/* ═══ THE SPEED PROFILE ═══════════════════════════════════
   The standard forward-backward pass. Start from the fastest
   speed each point could hold on grip alone (v = sqrt(mu/k)),
   then sweep forward clipping to what the deck can accelerate
   to, and backward clipping to what it can still brake from.
   What comes out is a profile that is feasible everywhere —
   so a rider braking for a corner starts braking before it,
   which the old curvature heuristic never did.
   ═══════════════════════════════════════════════════════ */
function buildProfile(){
  const N=RL.length;
  KAP=new Float32Array(N); DS=new Float32Array(N); VP=new Float32Array(N);
  for(let i=0;i<N;i++){
    const a=RL[(i-4+N)%N], b=RL[i], c=RL[(i+4)%N];
    const ab=Math.hypot(b[0]-a[0],b[1]-a[1]),
          bc=Math.hypot(c[0]-b[0],c[1]-b[1]),
          ca=Math.hypot(a[0]-c[0],a[1]-c[1]);
    const area=Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2;
    KAP[i]= ab*bc*ca>1e-6 ? 4*area/(ab*bc*ca) : 0;    // Menger curvature
    const n=RL[(i+1)%N];
    DS[i]=Math.hypot(n[0]-b[0],n[1]-b[1])||1e-3;
  }
  for(let i=0;i<N;i++)
    VP[i]=Math.min(VTOP, KAP[i]>1e-7?Math.sqrt(MU/KAP[i]):VTOP);
  for(let pass=0;pass<3;pass++){
    for(let i=0;i<N;i++){ const j=(i+1)%N;

    for(const q of PTS){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1]}

    const N=PTS.length, ring='M'+PTS.filter((_,i)=>i%2===0).map(T).join(' L')+' Z';
    let o='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs>'+P8.bloom('hcKbl','#fff',1.8)+'</defs>';

      for(let kk=0;kk<GW*GH;kk++){ const oc=learn[kk*2], fr=learn[kk*2+1]; if(oc<3||oc<=fr)continue;
        const conf=clamp((oc+fr)/70,0,1), gx=(kk%GW+.5)*CS, gy=((kk/GW|0)+.5)*CS, sz=Math.max(.8,CS*k*(.35+conf*.55));
        occ+='<rect x="'+f1(gx*k+ox-sz/2)+'" y="'+f1(gy*k+oy-sz/2)+'" width="'+f1(sz)+'" height="'+f1(sz)+'"/>' }
      if(occ)o+='<g fill="'+SK.edge+'" opacity=".22">'+occ+'</g>' }
    o+='<path d="'+ring+'" fill="none" stroke="#353A4A" stroke-width="'+f1(2*HALF*k+2.6)+'" stroke-linejoin="round"/>'+
      '<path d="'+ring+'" fill="none" stroke="#12141C" stroke-width="'+f1(2*HALF*k)+'" stroke-linejoin="round"/>';

      let run=[];

        o+='<path d="'+d+'" fill="none" stroke="#EDEBF5" stroke-width="1.7" stroke-opacity=".75"/>'+
           '<path d="'+d+'" fill="none" stroke="'+SK.hazard+'" stroke-width="1.7" stroke-dasharray="2.2 2.2"/>' } run=[] };
      for(let i=0;i<N;i+=2){
        if(KAP[i%RL.length]<cut){flush();continue}
        const p=PTS[i], a=PTS[(i-3+N)%N], b=PTS[(i+3)%N], [nx,ny]=norm(i);
        const mx=(a[0]+b[0])/2-p[0], my=(a[1]+b[1])/2-p[1], sg=Math.sign(nx*mx+ny*my)||1;

        if(brk)under+='<line '+seg+' stroke="'+SK.hazard+'" stroke-opacity=".42" stroke-width="5" stroke-linecap="round"/>';
        line+='<line '+seg+' stroke="'+mixC(TONE.skate.deep,'#E6EFFF',v)+'" stroke-opacity="'+(.8+v*.2).toFixed(2)+'" stroke-width="'+(.9+v*1.4).toFixed(2)+'" stroke-linecap="round"/>';
      }
      o+=under+line;
    }
    const lead=drive?cars[0]:cars.reduce((a,b)=>(b.lap*1e5+b.idx)>(a.lap*1e5+a.idx)?b:a,cars[0]);
    if(lead&&lead.trail.length>2)o+='<path d="M'+lead.trail.map(T).join(' L')+'" fill="none" stroke="'+SK.driven+'" stroke-width="1.3" stroke-opacity=".9" stroke-dasharray="1 2.4" stroke-linecap="round"/>';
    /* prediction: the kinematic bicycle rolled forward on the steer each deck holds now */
    for(const c of cars){
      const pr=predictPath(c,44);
      if(pr.length>1)o+='<path d="M'+T([c.x,c.y])+' L'+pr.map(T).join(' L')+'" fill="none" stroke="'+c.col+'" stroke-width="1.1" stroke-opacity=".95" stroke-dasharray="3 2.2" stroke-linecap="round"/>';
      if(c.aim&&c.mode!=='gap'){ const ax=Tx(c.aim), ay=Ty(c.aim);
        o+='<path d="M'+f1(ax-2.6)+','+f1(ay)+' h5.2 M'+f1(ax)+','+f1(ay-2.6)+' v5.2" stroke="'+c.col+'" stroke-width=".9" opacity=".85"/>' }
    }
    for(const c of cars){ const cx=Tx([c.x,c.y]), cy=Ty([c.x,c.y]), a=c.h+(c.delta||0)*1.8;

      o+='<circle cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="7" fill="'+c.col+'" opacity=".18"/>'+
         '<circle cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="3.3" fill="'+c.col+'" stroke="#07070C" stroke-width="1"'+(c===lead?' filter="url(#hcKbl)"':'')+'/>' }

    o+='<circle cx="'+f1(gx)+'" cy="'+f1(gy)+'" r="'+f1(gR)+'" fill="#07070C" fill-opacity=".5" stroke="#DCD8F2" stroke-opacity=".34"/>'+
       '<circle cx="'+f1(gx)+'" cy="'+f1(gy)+'" r="'+f1(gR/2)+'" fill="none" stroke="#DCD8F2" stroke-opacity=".14" stroke-dasharray="1.5 2.5"/>'+
       '<path d="M'+f1(gx-gR)+','+f1(gy)+' h'+f1(2*gR)+' M'+f1(gx)+','+f1(gy-gR)+' v'+f1(2*gR)+'" stroke="#DCD8F2" stroke-opacity=".12"/>';

    const wt=[1,.8,.85,1.3,1.25], wsum=wt.reduce((a,b)=>a+b,0), sx0=gx+gR+14, sw=(W-8-sx0)/wsum;

    o+=P8.note(gx,gy+gR+10,'GRIP',{a:'middle',k:'#77768F',s:6.6,ls:.12});
    const names=['Vortex','Ridge','Delta'];
    const lineKey=[{k:SK.line,t:W<330?'line':'solved line'},{k:SK.hazard,t:'braking'},{k:SK.driven,t:'driven',s:'dash'},{k:'#EDEBF5',t:'held steer',s:'dash'}];

  panes:[['play','Ride'],['viz','Data']],
  live(){ return ARC.cur==='skate'&&ARC.pane==='play'&&!drawing },
  search(q,hit){ const names=['Vortex','Ridge','Delta'], out=[];

      act:()=>{ const b=document.querySelector('.chip[data-track="'+i+'"]'); if(b&&trackId!==i)b.click() }}) });
    for(const l of lapLog.slice().reverse())if(hit(l.mode)||hit('lap'))out.push({title:l.mode+' · '+l.t.toFixed(2)+'s', sub:'lap'+(l.clean?'':' · contact'), pane:'viz'});
    return out },
  save:()=>({trackId}),
  load(d){ if(Number.isFinite(d.trackId)&&d.trackId>=0&&PRESETS[d.trackId])trackId=d.trackId|0 },
  mount(){setTrack(PRESETS[trackId]||PRESETS[0])},
  enter(){if(!PTS.length)setTrack(PRESETS[0]); draw(); if(ARC.pane==='viz')vizPane()},
  pane(p){if(p==='viz')vizPane(); else draw()},
  tick(dt,now){ if(ARC.pane!=='play')return;

    draw(); },
  gauges(){const lead=cars.reduce((a,b)=>b.sp>a.sp?b:a,cars[0]);

      {v:(coverage()*100).toFixed(0)+'%', l:'map coverage', f:coverage()},

      {v:(lead.sp/5.4*100).toFixed(0)+'%', l:'leader speed', f:clamp(lead.sp/5.4,0,1)}
    ]}
});

  if(found.length){ streak++; if(streak>bestStreak)bestStreak=streak }
  else if(streak){ ARC.log('plate','Streak ended at '+streak); streak=0 }
  plHist.unshift({plate,words:found.slice(0,8),pts:platePts,t:Date.now()});
  if(plHist.length>12)plHist.length=12;
}
function next(){
  closePlate();
  if(left<=1){
    const pb=pts>bestRun; if(pb)bestRun=pts;
    ARC.log('plate','Run complete · '+pts+' points'+(pb?' · personal best':''));
    left=10;pts=0; newPlate();
    msg=pb?'Personal best — '+bestRun+' points. New run, 10 plates.':'New run — 10 plates.';   // after newPlate(), which clears msg
    render();persist();return}
  left--; newPlate(); render(); persist();
}

/* ═══ DERIVATION ══════════════════════════════════════════
   Both concept boards drew this, as decoration. Here it is
   computed: every word this plate can make, one column per
   length, and an edge from a word to each longer word that
   contains all of its letters plus exactly one more — CAT
   to CART to CARTS. It is spoiler-free until you ask: words
   you have found are named, the rest are dots, and a hollow
   ring is a word one letter away from something you found.
   ═══════════════════════════════════════════════════════ */
let dg=null, dgKey='';
const lc=w=>{const a=new Uint8Array(26); for(const ch of w)a[ch.charCodeAt(0)-65]++; return a};
function derivGraph(){
  const key=plate+'|'+inOrder()+'|'+cands.length;
  if(dg&&dgKey===key)return dg;
  const byLen=new Map(), cnt=new Map(), par=new Map(), kid=new Map(); let edges=0;
  for(const w of cands){ cnt.set(w,lc(w)); if(!byLen.has(w.length))byLen.set(w.length,[]); byLen.get(w.length).push(w) }
  const lens=[...byLen.keys()].sort((a,b)=>a-b);
  for(const L of lens){
    const A=byLen.get(L), B=byLen.get(L+1); if(!B)continue;
    for(const a of A){ const ca=cnt.get(a);
      for(const b of B){ const cb=cnt.get(b); let ok=true;
        for(let k=0;k<26;k++)if(ca[k]>cb[k]){ok=false;break}
        if(!ok)continue;
        edges++;
        if(!kid.has(a))kid.set(a,[]); kid.get(a).push(b);
        if(!par.has(b))par.set(b,[]); par.get(b).push(a);
      }}
  }
  dg={byLen,lens,par,kid,edges}; dgKey=key; return dg;
}
/* words one letter away from anything found: the near-misses */
function nearMisses(g){
  const F=new Set(found), out=new Set();
  for(const w of found){ for(const x of (g.par.get(w)||[]))if(!F.has(x))out.add(x);
                         for(const x of (g.kid.get(w)||[]))if(!F.has(x))out.add(x) }
  return out;
}
/* The chain a word derives from: back through its parents, one letter
   at a time, to the shortest word on the plate that leads to it —
   preferring words you have found when two routes are equally short. */
function derivChain(g,w,F){
  if(!w)return [];
  const memo=new Map();
  const down=x=>{ if(memo.has(x))return memo.get(x);
    let best=[x];
    for(const p of (g.par.get(x)||[])){ const c=down(p).concat(x);
      if(c.length>best.length||(c.length===best.length&&F.has(c[0])&&!F.has(best[0])))best=c }
    memo.set(x,best); return best };
  return down(w);
}
/* One layout for every copy of the tree: what earns a place, where each
   word sits (Sugiyama barycentre sweeps), and the focus word's chain. */
function derivLayout(o){
  const g=derivGraph(); if(!cands.length)return null;
  const F=new Set(found), near=nearMisses(g), typed=o.typed||'';
  const focus=typed&&cands.includes(typed)?typed:(found.length?found[found.length-1]:'');
  const chain=focus?derivChain(g,focus,F):[];
  const deg=w=>(g.par.get(w)||[]).length+(g.kid.get(w)||[]).length;
  /* what earns a place on a small canvas: what you found, the chain,
     what is one letter from it, then the best-connected words so the shape shows */
  const keep=new Set(found); for(const w of chain)keep.add(w);
  for(const w of [...near].sort((a,b)=>deg(b)-deg(a))){ if(keep.size>=o.cap)break; keep.add(w) }
  for(const w of cands.slice().sort((a,b)=>deg(b)-deg(a)||a.length-b.length)){ if(keep.size>=o.cap)break; keep.add(w) }
  if(typed&&cands.includes(typed))keep.add(typed);
  const lens=g.lens.filter(L=>g.byLen.get(L).some(w=>keep.has(w)));
  const {W,top,bot}=o, padL=o.padL, padR=o.padR;
  const colX=i=>lens.length===1?W/2:padL+i*(W-padL-padR)/(lens.length-1);
  const cols=lens.map(L=>g.byLen.get(L).filter(w=>keep.has(w)).sort());
  const pos=new Map();
  const place=li=>{const col=cols[li], n2=col.length;
    col.forEach((w,k)=>pos.set(w,[colX(li), n2===1?(top+bot)/2:top+(bot-top)*k/(n2-1)]))};
  const mean=(ws,d)=>{const q=ws.filter(x=>pos.has(x)); return q.length?q.reduce((a,x)=>a+pos.get(x)[1],0)/q.length:d};
  cols.forEach((_,li)=>place(li));
  for(let li=1;li<cols.length;li++){cols[li].sort((a,b)=>mean(g.par.get(a)||[],pos.get(a)[1])-mean(g.par.get(b)||[],pos.get(b)[1]));place(li)}
  for(let li=cols.length-2;li>=0;li--){cols[li].sort((a,b)=>mean(g.kid.get(a)||[],pos.get(a)[1])-mean(g.kid.get(b)||[],pos.get(b)[1]));place(li)}
  for(let li=1;li<cols.length;li++){cols[li].sort((a,b)=>mean(g.par.get(a)||[],pos.get(a)[1])-mean(g.par.get(b)||[],pos.get(b)[1]));place(li)}
  const onChain=new Set(); for(let k=1;k<chain.length;k++)onChain.add(chain[k-1]+'>'+chain[k]);
  return {g,F,near,focus,chain,onChain,lens,cols,pos,colX,keep};
}
/* the tree's visual grammar, shared by Play, Data and the hub card:
   found — bright filled node · one letter away — lit hollow ring ·
   everything else the plate can make — background, at about 15% ·
   the focus word's derivation — a thick platinum curve with a little bloom */
const DERIV_IDX={};        /* sfx -> [word]; the DOM never names an unfound word */
function derivMarks(Lo,o){
  const {g,F,near,chain,onChain,lens,pos,colX}=Lo, f1=P8.f1, sfx=o.sfx||'', C=TONE.plate.c, C2=TONE.plate.c2;
  const named=w=>F.has(w)||(o.typed&&w===o.typed)||reveal;
  const idx=new Map(), IDX=[]; for(const w of pos.keys()){ idx.set(w,IDX.length); IDX.push(w) }
  DERIV_IDX[sfx]=IDX;
  const ref=(k,w)=>named(w)?' data-'+k+'="'+w+'"':' data-'+k+'i="'+idx.get(w)+'"';
  let rails='', bg='', mid='', hot='', nodes='', labels='';
  /* each word length is a translucent plane, seen a little from the side —
     its far edge higher than its near one — lit along the top, numbered above */
  const gap=lens.length>1?colX(1)-colX(0):120, hw=Math.max(4,Math.min(o.planeW||13,gap*.2)), sk=Math.min(7,hw*.55);
  lens.forEach((L,li)=>{ const x=colX(li), y0=o.top-7, y1=o.bot+7;
    rails+='<path d="M'+f1(x-hw)+','+f1(y0+sk)+' L'+f1(x+hw)+','+f1(y0)+' L'+f1(x+hw)+','+f1(y1-sk)+' L'+f1(x-hw)+','+f1(y1)+'Z" fill="url(#dgPl'+sfx+')" stroke="#DCD8F2" stroke-opacity=".08"/>'+
      '<path d="M'+f1(x-hw)+','+f1(y0+sk)+' L'+f1(x+hw)+','+f1(y0)+'" stroke="'+C+'" stroke-opacity=".5" stroke-width="1"/>'+
      '<text x="'+f1(x)+'" y="'+f1(o.top-12)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="'+(o.railS||9)+'" font-weight="600" fill="#8A89A2">'+L+'</text>' });
  for(const [b,ps] of g.par){ if(!pos.has(b))continue;
    for(const a of ps){ if(!pos.has(a))continue;
      const [ax,ay]=pos.get(a),[bx,by]=pos.get(b), both=F.has(a)&&F.has(b), one=F.has(a)||F.has(b), ch=onChain.has(a+'>'+b);
      const at=ref('a',a)+ref('b',b)+(o.grow&&(a===o.grow||b===o.grow)?' pathLength="1"':'');
      const cls=o.grow&&(a===o.grow||b===o.grow)?' de grow':' de';
      if(ch) hot+=P8.edge(ax,ay,bx,by,{k:'url(#dgCh'+sfx+')',w:o.chainW||2.8,a:.95,f:'dgBloom'+sfx,cls:cls.trim()}).replace('/>',at+'/>');
      else if(both) mid+=P8.edge(ax,ay,bx,by,{k:C,w:1.6,a:.85,cls:cls.trim()}).replace('/>',at+'/>');
      else if(one) bg+=P8.edge(ax,ay,bx,by,{k:C2,w:.8,a:.22,cls:cls.trim()}).replace('/>',at+'/>');
      else bg+=P8.edge(ax,ay,bx,by,{k:'#DCD8F2',w:.7,a:.13,cls:cls.trim()}).replace('/>',at+'/>');
    }}
  const flip=new Set(), last=Lo.cols.length-1;
  Lo.cols.forEach((col,li)=>{ let lastY=-1e9, lastFlip=false;
    for(const w of col){ if(!named(w))continue; const y=pos.get(w)[1];
      /* never push a label off the canvas: the first column reads right, the last reads left */
      const fl= li===0?false : li===last&&last>0?true : (y-lastY<11)&&!lastFlip;
      if(fl)flip.add(w); lastFlip=fl; lastY=y } });
  const onC=new Set(chain), R=o.r||5;
  for(const [w,[x,y]] of pos){
    const isF=F.has(w), isN=near.has(w), isT=o.typed&&w===o.typed, isC=onC.has(w);
    const at=' class="dn'+(o.born===w?' born':'')+'"'+ref('w',w);
    const nd=isF?P8.node(x,y,R,{k:'url(#dgSph'+sfx+')',f:'dgGlow'+sfx})
      : isT?P8.node(x,y,R,{m:'ring',k:'#FFFFFF',w:1.6})
      : isN?P8.node(x,y,R-.8,{m:'ring',k:C2,w:1.4,bg:'#150D12',f:'dgRing'+sfx})
      : isC?P8.node(x,y,R*.62,{k:C,a:.7})
      : P8.node(x,y,o.dot||2.4,{m:'dim',k:'#DCD8F2',a:.16});
    nodes+=nd.replace('<circle','<circle'+at);
    if(o.labels!==false&&(isF||isT||reveal)) labels+='<text x="'+f1(flip.has(w)?x-(R+3):x+(R+3))+'" y="'+f1(y+3)+'"'+(flip.has(w)?' text-anchor="end"':'')+
      ' font-family="IBM Plex Mono,monospace" font-size="'+(isF?(o.labS||9.5):(o.labS||9.5)-1)+'" paint-order="stroke" stroke="#0E0D14" stroke-width="3" stroke-linejoin="round" font-weight="'+(isF?600:400)+
      '" fill="'+(isF?'#FFE0DC':isT?'#FFFFFF':'#8E8DA6')+'">'+w+'</text>';
  }
  const defs='<filter id="dgGlow'+sfx+'" x="-100%" y="-100%" width="300%" height="300%">'+
      '<feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="'+C+'" flood-opacity=".9"/></filter>'+
    '<filter id="dgRing'+sfx+'" x="-100%" y="-100%" width="300%" height="300%">'+
      '<feDropShadow dx="0" dy="0" stdDeviation="1.6" flood-color="'+C2+'" flood-opacity=".55"/></filter>'+
    P8.bloom('dgBloom'+sfx,C,2,{x:-20,y:-20,w:(o.W||400)+40,h:(o.bot||400)+60})+   // user space: a level chain link must still draw
    /* a found word is a lit sphere: highlight toward the light, the colour, then its deep shade */
    '<radialGradient id="dgSph'+sfx+'" cx=".36" cy=".3" r=".75"><stop offset="0" stop-color="#FFF1EC"/><stop offset=".32" stop-color="'+C2+'"/>'+
      '<stop offset=".68" stop-color="'+C+'"/><stop offset="1" stop-color="'+TONE.plate.deep+'"/></radialGradient>'+
    '<linearGradient id="dgPl'+sfx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCD8F2" stop-opacity=".085"/>'+
      '<stop offset=".55" stop-color="#DCD8F2" stop-opacity=".035"/><stop offset="1" stop-color="#DCD8F2" stop-opacity=".012"/></linearGradient>'+
    /* across the whole tree, so a level link (no height) still paints */
    '<linearGradient id="dgCh'+sfx+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="'+(o.W||400)+'" y2="0"><stop offset="0" stop-color="'+C+'"/><stop offset="1" stop-color="'+C2+'"/></linearGradient>';
  return {defs, body:rails+bg+mid+hot+nodes+labels};
}
function derivSVG(W,H,cap,typed,sfx,born){
  /* the tree is drawn in Play and in Data; a filter resolved inside the
     hidden copy draws nothing in Chrome, so each copy owns its ids */
  sfx=sfx||'';
  const Lo=derivLayout({W,H,cap,typed,padL:reveal?40:30,padR:reveal?54:44,top:30,bot:H-12}); if(!Lo)return '';
  const m=derivMarks(Lo,{sfx,typed,top:30,bot:H-12,born,grow:born,W});
  return '<svg class="dg" data-sfx="'+sfx+'" viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:'+W+'px;margin:0 auto" role="img" aria-label="Word derivation tree">'+
    '<defs>'+m.defs+'</defs>'+m.body+'</svg>';
}
/* hover a word: its ancestors and descendants light, everything else steps back */
function lineage(g,w){
  const up=new Set(), dn=new Set();
  const walk=(x,map,acc)=>{ for(const y of (map.get(x)||[]))if(!acc.has(y)){acc.add(y);walk(y,map,acc)} };
  walk(w,g.par,up); walk(w,g.kid,dn);
  return new Set([w,...up,...dn]);
}
function wireLineage(host){
  if(!host||host._lin)return; host._lin=true;
  const clear=svg=>{ svg.classList.remove('lin'); svg.querySelectorAll('.on').forEach(e=>e.classList.remove('on')) };
  /* a mark carries its word only if you have found it; otherwise a number into
     this copy's index, which lives here rather than in the DOM */
  const wordOf=(svg,el,k)=>{ const d=el.dataset[k]; if(d)return d;
    const i=el.dataset[k+'i']; const L=DERIV_IDX[svg.dataset.sfx||'']; return i!=null&&L?L[+i]:null };
  host.addEventListener('pointerover',e=>{
    const n=e.target.closest&&e.target.closest('.dg .dn'); const svg=e.target.closest&&e.target.closest('.dg');
    if(!svg)return; if(!n){clear(svg);return}
    const set=lineage(derivGraph(),wordOf(svg,n,'w'));
    clear(svg); svg.classList.add('lin');
    svg.querySelectorAll('.dn').forEach(c=>{ if(set.has(wordOf(svg,c,'w')))c.classList.add('on') });
    svg.querySelectorAll('.de').forEach(p=>{ if(set.has(wordOf(svg,p,'a'))&&set.has(wordOf(svg,p,'b')))p.classList.add('on') });
  });
  host.addEventListener('pointerleave',()=>host.querySelectorAll('.dg.lin').forEach(clear),true);
}
/* a word is banked: the plate characters it used light, their letters travel
   down to where the word lives in the tree, the node is born, its links draw
   in, and the score ticks — the order the engine did it in */
function birth(w,slots,pts){
  const art=$('#pArt'), node=document.querySelector('#pDeriv .dn[data-w="'+w+'"]');
  if(!art||typeof art.getBoundingClientRect!=='function')return;
  const ar=art.getBoundingClientRect(); if(!ar.width)return;
  const n=Math.max(1,plate.length), span=Math.min(462,n*68), pitch=span/n, x0=300-span/2;
  /* land on the node if it is on screen; otherwise on the banked list, which always is */
  let nr=node&&node.getBoundingClientRect?node.getBoundingClientRect():null;
  if(!nr||nr.top<0||nr.top>innerHeight-10){ const bk=$('#pBank'); nr=bk&&bk.getBoundingClientRect?bk.getBoundingClientRect():null;
    if(nr)nr={left:nr.left+Math.min(nr.width,160)*.5-4,top:nr.top+2,width:8,height:10} }
  /* which letters each plate character gave the word — a 3 read as an E flies as an E */
  const give=[];
  if(inOrder()){ let wi=0; for(const s of slots){ const o=(cells[s]||[]).find(x=>w.startsWith(x,wi))||plate[s]; give.push(o); wi+=o.length } }
  else { const left=[...w]; for(const s of slots){ const op=shortOpts(plate[s]); const j=left.findIndex(ch=>op.includes(ch));
    give.push(j>=0?left.splice(j,1)[0]:plate[s]) } }
  const lay=document.createElement('div'); lay.className='pfx'; document.body.appendChild(lay);
  slots.forEach((s,k)=>{
    const cx=ar.left+(x0+s*pitch+pitch/2)/600*ar.width, cy=ar.top+170/300*ar.height;
    const box=document.createElement('i'); box.className='pcell';
    box.style.cssText='left:'+(ar.left+(x0+s*pitch+pitch*.08)/600*ar.width)+'px;top:'+(ar.top+104/300*ar.height)+'px;width:'+(pitch*.84/600*ar.width)+'px;height:'+(128/300*ar.height)+'px';
    lay.appendChild(box);
    const ch=document.createElement('b'); ch.className='pfly'; ch.textContent=plate[s];
    ch.style.cssText='left:'+cx+'px;top:'+cy+'px'; lay.appendChild(ch);
    if(give[k]&&give[k]!==plate[s])setTimeout(()=>{ ch.textContent=give[k] },320+k*60);
    if(ch.animate&&nr){ const tx=nr.left+nr.width/2-cx, ty=nr.top+nr.height/2-cy;
      ch.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:0},{transform:'translate(-50%,-50%) scale(1.1)',opacity:1,offset:.18},
        {transform:'translate(calc(-50% + '+tx+'px),calc(-50% + '+ty+'px)) scale(.55)',opacity:.95,offset:.92},
        {transform:'translate(calc(-50% + '+tx+'px),calc(-50% + '+ty+'px)) scale(.4)',opacity:0}],{duration:900,delay:140+k*60,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'}) }
  });
  setTimeout(()=>lay.remove(),1700);
  if(art.classList){ art.classList.remove('glint'); void art.offsetWidth; art.classList.add('glint'); setTimeout(()=>art.classList.remove('glint'),1000) }
  const ft=$('#pFoot');
  if(ft){ const pl=document.createElement('span'); pl.className='pplus'; pl.textContent='+'+pts; ft.appendChild(pl); setTimeout(()=>pl.remove(),1400) }
}
/* the tree's size follows what is in it: as wide as its columns need, as
   tall as its fullest column, never wider than the room it is given */
function derivDims(room,big){
  room=Math.max(300,room||0);
  const g=derivGraph(), cols=Math.max(1,g.lens.length);
  const cap=Math.round(clamp(room/(big?7:9),big?70:34,big?150:80));
  const most=Math.max(1,...g.lens.map(L=>g.byLen.get(L).length));
  const perCol=Math.min(most,Math.ceil(cap/cols*1.7));
  const W=Math.round(clamp(Math.min(room,120+cols*(big?210:180)),300,room));
  const H=Math.round(clamp(perCol*(big?19:15)+56,big?240:190,big?520:300));
  return {W,H,cap};
}
function derivCard(W,H,cap,typed,sfx){
  const g=derivGraph(), near=nearMisses(g);
  return '<div class="card" style="margin-top:11px"><div class="row spread"><h3 style="margin:0">Derivation tree</h3>'+
      '<button class="chip" data-reveal aria-pressed="'+reveal+'">'+(reveal?'Hide words':'Reveal words')+'</button></div>'+
    '<div style="margin-top:8px">'+derivSVG(W,H,cap,typed,sfx,sfx==='P'?bornW:'')+'</div>'+
    '<div class="kv"><span>Words · links</span><b>'+cands.length+' · '+g.edges+'</b></div>'+
    '<div class="kv"><span>One letter from what you found</span><b>'+(found.length?near.size:'—')+'</b></div>'+
    '<div class="read">'+(found.length
      ? 'Solid dots are yours. Each hollow ring is a word one letter away from one of them — add a letter, or take one away, and it is there.'
      : 'Every dot is a word this plate can make, one column per length, linked to the longer words that contain it plus one letter. Bank a word and its neighbours light up.')+'</div></div>';
}
/* ═══ THE PLATE ═══════════════════════════════════════════
   A 12×6 California plate at 2:1, drawn at 600×300 so every
   number below is in real plate inches ×50. The stamping is
   three passes of the same text — shadowed bevel, lit bevel,
   painted face — which is how an embossed character actually

const fixVid=v=>({title:'',author:'',note:'',added:Date.now(),watched:0,pos:0,dur:0,
  ...v, title:String(v.title||'').slice(0,200), author:String(v.author||'').slice(0,120),
  note:String(v.note||'').slice(0,300), crate:String(v.crate||v.feed||'Watch later').slice(0,40)});
/* imported crates are data from outside: plain text, bounded */
const fixCrate=c=>({n:String(c.n||'').slice(0,40), g:(String(c.g||'▸').replace(/[<>&"'`]/g,'').slice(0,2)||'▸'),
  q:Array.isArray(c.q)?c.q.map(x=>String(x).slice(0,80)).slice(0,8):[]});
function ensureCrates(){
  for(const v of vids)if(v.crate&&!crateOf(v.crate))crates.push({n:v.crate,g:'▸',q:[v.crate]});
}

/* ── backend probe ──────────────────────────────────────── */
async function probe(){
  try{ const r=await fetch('/api/health',{cache:'no-store'}); const j=await r.json();
       API=(j&&j.ok)?'/api':null; apiNote=API?'':'（/api/health answered, but not ok)' }
  catch(e){ API=null; apiNote='' }
  if(ARC.cur==='slate')repaint();
}
/* ── title enrichment: YouTube's own oEmbed, no key, CORS-open ── */
async function enrich(v){
  try{
    const u='https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+v.id);
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok)return false;
    const j=await r.json();
    if(j.title){ v.title=j.title; v.author=j.author_name||''; persist(); return true }
  }catch(e){}
  return false;
}
/* ── discovery: routed through the site's own server so there is
      no CORS wall and no API key. Falls back to opening YouTube. ── */
async function discover(c){
  const q=(c.q&&c.q.length)?c.q[Math.floor(Math.random()*c.q.length)]:c.n;
  hitFor=c.n; qerr=''; hits=[]; busy=true; view='hits'; repaint();
  if(!API){
    busy=false;
    qerr='No backend detected, so the page cannot search YouTube for you. Start the site (npm run dev) and this fills itself; meanwhile the button below opens the search.';
    repaint(); return;
  }
  try{
    const r=await fetch(API+'/yt?q='+encodeURIComponent(q)+'&n=18',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    hits=(j.items||[]).filter(x=>x&&okId(x.id));
    qerr=hits.length?'':'The backend answered but found nothing for "'+q+'".';
  }catch(e){
    qerr = /404/.test(String(e.message))
      ? 'The /api/yt route is not installed yet. Add app/api/yt/route.ts and this button fills the crate.'
      : 'Search failed: '+String(e.message||e);
  }
  busy=false; repaint();
}
/* a channel resolves to its own YouTube RSS feed, server-side, so what
   comes back is a real recent-uploads list rather than a guess. */
async function pullChannel(handle,target){
  hitFor=crateOf(target)?target:'Watch later';
  qerr=''; hits=[]; busy=true; view='hits'; repaint();
  if(!API){
    busy=false;
    qerr='Following a channel needs the backend — it has to resolve the handle to a channel id, which the browser is not allowed to do. Start the site and try again.';
    repaint(); return;
  }
  try{
    const r=await fetch(API+'/yt?channel='+encodeURIComponent(handle)+'&n=25',{cache:'no-store'});
    const j=await r.json();
    if(!r.ok)throw new Error(j&&j.error?j.error:'HTTP '+r.status);
    hits=(j.items||[]).filter(x=>x&&okId(x.id));
    qerr=hits.length?'':'That channel resolved, but its feed carried no videos.';
    if(hits.length)toast(hits.length+' from '+(hits[0].author||handle));
  }catch(e){
    qerr = /404/.test(String(e.message))
      ? 'The /api/yt route is not installed yet. Add app/api/yt/route.ts and this works.'
      : 'Could not follow that channel: '+String(e.message||e);
  }
  busy=false; repaint();
}
function addHit(h,cn){
  if(vids.some(v=>v.id===h.id)){ toast('Already in the library'); return }
  vids.unshift(fixVid({id:h.id,title:h.title||'',author:h.author||'',crate:cn,dur:h.dur||0}));
  ARC.log('slate','Added '+(h.title||h.id)+' to '+cn);
  ensureCrates(); persist(); repaint();
}
function addAll(cn){
  let n=0; for(const h of hits)if(!vids.some(v=>v.id===h.id)){
    vids.push(fixVid({id:h.id,title:h.title||'',author:h.author||'',crate:cn,dur:h.dur||0})); n++ }
  vids.sort((a,b)=>b.added-a.added);
  ensureCrates(); persist(); toast('Added '+n+' to '+cn); view='library'; repaint();
  if(n)ARC.log('slate','Filled '+cn+' · '+n+' video'+(n===1?'':'s'));
}

/* ── library selectors ──────────────────────────────────── */
function shown(){
  let v=crate==='All'?vids.slice():vids.filter(x=>x.crate===crate);
  if(onlyUnwatched)v=v.filter(x=>!x.watched);
  if(sort==='new')v.sort((a,b)=>b.added-a.added);
  else if(sort==='old')v.sort((a,b)=>a.added-b.added);
  else if(sort==='title')v.sort((a,b)=>(a.title||a.id).localeCompare(b.title||b.id));
  else if(sort==='crate')v.sort((a,b)=>String(a.crate||'').localeCompare(String(b.crate||''))||b.added-a.added);
  return v;
}
const upNext=()=>{ const v=shown(); const i=v.findIndex(x=>cur&&x.id===cur.id);
  return i>=0&&i+1<v.length?v[i+1]:(v[0]&&(!cur||v[0].id!==cur.id)?v[0]:null) };

/* ── hero ───────────────────────────────────────────────── */
function hero(){

  }

/* the crates as a constellation: a family of interests is linked round the
   ring, the library draws a line to every crate that holds something, and a
   crate's size is what is in it */
function constellation(bx,by,bw,bh,big,curCrate,fid){
      const f1=P8.f1, C=TONE.slate.c, C2=TONE.slate.c2, cnt=n=>vids.filter(v=>v.crate===n).length;
      const N=crates.length; if(!N)return '';
      const cx=bx+bw/2, cy=by+bh/2, Rx=big?bw*.3:bw*.36, Ry=big?bh*.34:bh*.36;
      const fam=[...new Set(crates.map(c=>c.g))];
      const order=fam.flatMap(g=>crates.filter(c=>c.g===g));
      const ang=i=>-Math.PI/2+i/N*Math.PI*2, P=i=>[cx+Math.cos(ang(i))*Rx, cy+Math.sin(ang(i))*Ry];
      let o='<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(Rx)+'" ry="'+f1(Ry)+'" fill="none" stroke="#DCD8F2" stroke-opacity=".07"/>';
      /* a family is an interest: its crates are linked round the ring */
      for(let i=0;i<N;i++){ const a=order[i], b=order[(i+1)%N]; if(a.g!==b.g||N<2)continue;
        const [x1,y1]=P(i),[x2,y2]=P((i+1)%N); o+='<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+C2+'" stroke-opacity=".35" stroke-width=".8"/>' }
      /* what the library holds, drawn from its centre to each crate */
      order.forEach((c,i)=>{ const n=cnt(c.n); if(!n)return; const [x,y]=P(i);
        o+='<line x1="'+f1(cx)+'" y1="'+f1(cy)+'" x2="'+f1(x)+'" y2="'+f1(y)+'" stroke="'+C+'" stroke-opacity=".45" stroke-width="'+f1(.6+Math.sqrt(n)*.6)+'"/>' });
      o+='<circle cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="'+(big?3.2:2.4)+'" fill="#FFFFFF" opacity=".9"/>';
      order.forEach((c,i)=>{ const n=cnt(c.n), [x,y]=P(i), r=(big?2.3:1.8)+Math.sqrt(n)*(big?1.7:1.3), on=c.n===curCrate;
        o+=n?'<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="'+C+'"'+(on?' filter="url(#'+(fid||'hcSbl')+')"':'')+'/>'
            :'<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="#0B0B12" stroke="'+C2+'" stroke-opacity=".55" stroke-width=".9"/>';
        if(on)o+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r+3.2)+'" fill="none" stroke="#FFFFFF" stroke-width=".9"/>';
        if(big){ const a=ang(i), lx=cx+Math.cos(a)*(Rx+9), ly=cy+Math.sin(a)*(Ry+9)+3;
          o+=P8.note(lx,ly,c.n+(n?' '+n:''),{a:Math.cos(a)>.25?'start':Math.cos(a)<-.25?'end':'middle',s:7.8,k:n?C2:'#8F8EA8',halo:1}) } });
      return o;
    }
/* ── the transport: it only ever shows what the player reported, and only
      sends the player's own commands (play, pause, seek) ─────────────── */
let yt={t:0,d:0,st:-1}, autoPlay=false;
const ytCmd=(func,args)=>{ const f=document.querySelector('#slHero iframe'); if(!f)return;
  try{ f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:args||[],id:1,channel:'widget'}),'*') }catch(e){} };
const mmss=t=>{t=Math.max(0,t|0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function trPaint(){
  const tr=$('#slTr'); if(!tr||tr.hidden)return;
  const f=yt.d?clamp(yt.t/yt.d,0,1):0, on=yt.st===1;
  if(!tr._built){ tr._built=true;
    tr.innerHTML='<button data-yt="back" aria-label="Back 10 seconds">−10</button><button class="pp" data-yt="pp" aria-label="Play or pause">▶</button>'+
      '<button data-yt="fwd" aria-label="Forward 10 seconds">+10</button><div class="tl" role="slider" aria-label="Position" tabindex="0"><i></i><b></b><em></em></div><span class="tm"></span>';
    tr.addEventListener('click',e=>{
      const b=e.target.closest('[data-yt]'), tl=e.target.closest('.tl');
      if(b){ const k=b.dataset.yt;
        if(k==='pp')ytCmd(yt.st===1?'pauseVideo':'playVideo');
        else ytCmd('seekTo',[Math.max(0,yt.t+(k==='fwd'?10:-10)),true]); }
      else if(tl&&yt.d){ const r=tl.getBoundingClientRect(); ytCmd('seekTo',[clamp((e.clientX-r.left)/r.width,0,1)*yt.d,true]) }
    });
  }
  tr.querySelector('.pp').textContent=on?'❚❚':'▶';
  tr.querySelector('.tl').style.setProperty('--f',f.toFixed(4));
  tr.querySelector('.tl').setAttribute('aria-valuenow',String(Math.round(f*100)));
  tr.querySelector('.tm').textContent=yt.d?mmss(yt.t)+' / '+mmss(yt.d):'—';
}
/* The embed's own report of where playback is. Only the player we built is
   believed, only numbers are taken, and saving is throttled. */
let posSaved=0, trAt=0;
window.addEventListener('message',e=>{
  if(!/^https:\/\/www\.youtube(-nocookie)?\.com$/.test(String(e.origin||'')))return;
  const f=document.querySelector('#slHero iframe'); if(!f||e.source!==f.contentWindow||!cur)return;
  let d; try{ d=typeof e.data==='string'?JSON.parse(e.data):e.data }catch(_){ return }
  if(!d||d.event!=='infoDelivery'||!d.info)return;
  const t=+d.info.currentTime, du=+d.info.duration;
  if(Number.isFinite(+d.info.playerState))yt.st=+d.info.playerState;
  if(Number.isFinite(t))yt.t=t; if(Number.isFinite(du)&&du>0)yt.d=du;
  const nw=performance.now(); if(nw-trAt>240){ trAt=nw; trPaint() }
  if(Number.isFinite(du)&&du>0)cur.dur=du;
  if(Number.isFinite(t)&&t>=0){ cur.pos=t; if(cur.dur&&t>=cur.dur*.95&&!cur.watched){cur.watched=1;ARC.log('slate','Watched '+(cur.title||cur.id))} }
  const now=Date.now(); if(now-posSaved>5000){ posSaved=now; persist() }
});
/* ── progress ring, drawn per card ──────────────────────── */
function ring(f,watched){
  const R=9, C=2*Math.PI*R;
  return '<svg class="rg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">'+
    '<circle cx="12" cy="12" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="2.4"/>'+
    (f>0?'<circle cx="12" cy="12" r="'+R+'" fill="none" stroke="var(--ac)" stroke-width="2.4"'+
      ' stroke-linecap="round" stroke-dasharray="'+C.toFixed(2)+'"'+
      ' stroke-dashoffset="'+(C*(1-clamp(f,0,1))).toFixed(2)+'" transform="rotate(-90 12 12)"/>':'')+
    (watched?'<path d="M8 12.4l2.6 2.6L16 9.6" fill="none" stroke="var(--ac2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>':'')+
  '</svg>';
}
function card(x){
  const f=x.dur?clamp(x.pos/x.dur,0,1):(x.watched?1:0);
  return '<button class="mcard vcard" data-v="'+x.id+'" aria-current="'+(cur&&cur.id===x.id)+'">'+
    '<span class="th"><img src="'+thumb(x.id)+'" alt="" loading="lazy">'+
      (f>0?'<span class="pb" style="width:'+(f*100).toFixed(1)+'%"></span>':'')+'</span>'+
    '<span class="mt"><b>'+esc(x.title||x.id)+'</b>'+
      '<span>'+esc(x.author||x.crate)+' · '+esc(x.crate)+'</span>'+
      (x.note?'<span class="hint" style="display:block;margin-top:4px">'+esc(x.note)+'</span>':'')+
    '</span>'+
    '<span class="vact">'+ring(f,x.watched)+

  '</button>';
}

function play(v){

}
function shareVid(v){
  if(!v)return;

      o+='</svg>';

      out.push({title:v.title||v.id, sub:'video · '+(v.author?v.author+' · ':'')+v.crate+(v.watched?' · watched':''), pane:'play', act:()=>play(v)});

  pane(){repaint()},

      {v:String(vids.length), l:'in the library', f:clamp(vids.length/40,0,1)},
      {v:used+'/'+crates.length, l:'crates in use', f:crates.length?used/crates.length:0},
      {v:vids.length?Math.round(w/vids.length*100)+'%':'—', l:'watched', f:vids.length?w/vids.length:0}]}
});

/* ═══════════════ LATE — cyan · news ══════════════════════
   Source-driven, never invented. Every card carries its source,
   its date and a link out. Feeds are fetched straight from the
   browser, so anything without CORS headers will fail loudly
   rather than quietly showing nothing.                        */
mod('late',()=>{
const CATS={county:'County',re:'Real estate',ai:'AI / tech',other:'Other'};
const KW={county:['planning','permit','zoning','council','housing authority','ordinance','county','city of'],
          re:['mortgage','listing','rent','landlord','multifamily','cap rate','housing market','real estate','foreclosure'],
          ai:['ai ','model','openai','anthropic','llm','gpu','automation','agent','neural','machine learning']};
let srcs=[
  {type:'gdelt',q:'"Bakersfield" housing',name:'GDELT · Kern housing',cat:'county',status:'never fetched',n:0},
  {type:'gdelt',q:'"Fresno County" "real estate"',name:'GDELT · Fresno property',cat:'re',status:'never fetched',n:0},
  {type:'hn',q:'AI',name:'Hacker News · AI',cat:'ai',status:'never fetched',n:0},
  {type:'rss',url:'https://www.hud.gov/rss/press.xml',name:'HUD press',cat:'county',status:'never fetched',n:0}
];
let useRelay=false, relay='https://api.allorigins.win/raw?url=', API=null;
async function probeAPI(){
  try{ const r=await fetch('/api/health',{cache:'no-store'});
       const j=await r.json(); API=(j&&j.ok)?'/api':null }
  catch(e){ API=null }
  if(ARC.cur==='late')paint();
}
const gdate=d=>Date.parse(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'T'+d.slice(9,11)+':'+d.slice(11,13)+':'+d.slice(13,15)+'Z')||Date.now();
async function pull(s){
  if(s.type==='gdelt'){
    const u='https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(s.q)+'&mode=ArtList&maxrecords=25&format=json&sort=DateDesc';
    const txt=await (await fetch(u,{cache:'no-store'})).text();
    let j; try{ j=JSON.parse(txt) }catch(_){ throw new Error(txt.slice(0,90).replace(/\s+/g,' ')||'no response') }
    return (j.articles||[]).map(a=>({title:a.title||'',link:a.url||'',body:'',date:gdate(a.seendate||''),
      src:a.domain||s.name,cat:classify(a.title||''),local:isLocal((a.title||'')+' '+(a.domain||''))}));
  }
  if(s.type==='hn'){
    const u='https://hn.algolia.com/api/v1/search_by_date?tags=story&hitsPerPage=25&query='+encodeURIComponent(s.q);
    const j=await (await fetch(u,{cache:'no-store'})).json();
    return (j.hits||[]).map(h=>({title:h.title||'',link:h.url||'https://news.ycombinator.com/item?id='+h.objectID,
      body:(h.story_text||'').replace(/<[^>]+>/g,' ').slice(0,220),date:Date.parse(h.created_at)||Date.now(),
      src:'Hacker News',cat:classify(h.title||''),local:isLocal(h.title||'')}));
  }
  return parseFeed(await rawFeed(s.url),s);
}
/* one place decides how a feed URL is fetched, so podcasts and news
   inherit the same backend/relay/direct ladder and the same failures. */
async function rawFeed(url){
  const u = API ? API+'/rss?url='+encodeURIComponent(url)
          : useRelay ? relay+encodeURIComponent(url) : url;
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
/* "California" is not a local signal — the counties and their cities are. */
let items=[], local=['kern county','bakersfield','fresno','fresno county','central valley','visalia','tulare','delano','clovis'],
    busy=false, note='', newType='gdelt';
const norm=t=>(t||'').toLowerCase().replace(/\s+/g,' ').trim();
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function classify(t){
  const s=norm(t);
  for(const k of ['county','re','ai'])if(KW[k].some(w=>s.includes(w)))return k;
  return 'other';
}
const isLocal=t=>{const s=norm(t);return local.some(w=>w&&s.includes(w))};
function parseFeed(xml,src){
  const d=new DOMParser().parseFromString(xml,'application/xml');
  if(d.querySelector('parsererror'))throw new Error('not valid XML');
  const nodes=[...d.querySelectorAll('item'),...d.querySelectorAll('entry')];
  return nodes.map(n=>{
    const g=t=>n.querySelector(t)?.textContent?.trim()||'';
    const link=g('link')||n.querySelector('link')?.getAttribute('href')||'';
    const title=g('title');
    const body=(g('description')||g('summary')||g('content')).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    const date=Date.parse(g('pubDate')||g('updated')||g('published'))||Date.now();
    return{title,link,body:body.slice(0,260),date,src:src.name,
      cat:classify(title+' '+body),local:isLocal(title+' '+body)};
  }).filter(x=>x.title&&x.link);
}
async function refresh(){
  if(busy)return; busy=true; note='Fetching…'; paint();
  for(const s of srcs){
    try{
      const got=(await pull(s)).filter(x=>x.title&&x.link);
      s.n=got.length; s.status='ok · '+got.length+' · '+new Date().toLocaleTimeString();
      for(const it of got)if(!items.some(x=>x.link===it.link||norm(x.title)===norm(it.title)))items.push(it);
    }catch(e){ s.n=0; s.status='failed · '+(netErr(e)?(SANDBOXED?'blocked by the preview':'blocked by CORS'):String(e.message||e)) }
  }
  items.sort((a,b)=>b.date-a.date); items=items.slice(0,200);
  const dead=srcs.filter(x=>x.status.startsWith('failed'));
  const live=srcs.length-dead.length;
  ARC.log('late','Feed refreshed · '+items.length+' items from '+live+' of '+srcs.length+' sources');
  busy=false;
  note = items.length
    ? (dead.length?dead.length+' source'+(dead.length>1?'s':'')+' refused the browser. Switch the relay on in Sources, or pull them server-side.':'')
    : (SANDBOXED
        ? 'Every request was refused. This preview sandbox blocks outbound calls, so no feed can reach the page here — serve the file from your own domain and these same sources answer fine. Until then, paste a feed in Sources.'
        : 'Nothing came back. Turn on the relay in Sources, or paste a feed in by hand.');
  persist(); paint();
}
function addManual(){
  const t=$('#laT').value.trim(), l=$('#laL').value.trim(), sname=$('#laS').value.trim()||'manual';
  if(!t||!l){note='A headline and a link are both required.';paint();return}
  items.unshift({title:t,link:l,body:'',date:Date.now(),src:sname,cat:classify(t),local:isLocal(t)});
  note=''; persist(); paint();
}

"He did not move. He wanted, for one more minute, to be a man who was about to see his daughter, rather than a man finding out what had been sent in her place."]},

{k:'trieste',st:'TRIESTE',tc:'07:00',ti:'Kilometre Zero',p:[
"Four hundred and eleven times he had walked the route. He knew it the way a priest knows a rosary: the tobacconist at the corner who opened at seven and never at five past; the loose paver forty metres on that clicked under a heel; the seventh bench, which faced the water and had, screwed beneath its slats, a magnetic tin the size of a matchbox.",
"Today the tobacconist was shut.",
"Marek kept walking. To break stride would be to announce that he had noticed, and a man who notices is a man who has something to notice with. He let his shoulders stay loose. He thought about the tin and the film inside it and the eleven names on the film, and how three of those names belonged to people who had cooked him dinner.",
"The paver clicked. Behind him, forty metres back, it clicked again.",
"He had been trained for this and the training was worthless, because the training assumed you wanted to live more than you wanted the tin to reach Vienna. He had assumed that too, once. He had assumed a great many things at twenty-six that had turned out to be provisional.",
"At the seventh bench he sat, as he had four hundred and eleven times, and looked at the water, which was the colour of a coin left out in the rain. He put his hand beneath the slats.",
"The tin was already gone.",
"Marek laughed — a short, surprised sound, the first honest noise he had made in nine years — and then he sat very still and waited to be told what he was now."]},

{k:'registry',st:'REGISTRY',tc:'14:20',ti:'The Weight of a Name',p:[
"For six years the asset was called HOLLOW. Ruth had built her around the codename the way you build a house around a stove: everything arranged to keep the heat in one place. HOLLOW liked cash in small denominations, refused meetings on Fridays, and had a tell in her handwriting when she was frightened — the descenders went long.",
"On a Tuesday in March, Registry sent up the true-name file, because a lawyer somewhere had decided that six years was long enough.",
"Ruth read the first line and did not read the second for a long time.",
"Anneliese Marek. Widow. One child, deceased in infancy. Husband lost — the file said lost, as though he had wandered off — in Trieste, nineteen years ago.",
"Ruth had a photograph of that man in a drawer at home. He had been her brother. He had been twenty-six, and he had sent her a postcard of the Adriatic with nothing written on it but the water here is the colour of a coin, and she had thought it was a joke and had thrown it away and had spent nineteen years wishing she hadn't.",
"She sat with the file open. Downstairs, someone was laughing at something.",
"The protocol was clear: personal connection to an asset required immediate disclosure and reassignment. The protocol had been written by people who had never had to choose between a rule and the only living thing that had touched the same wound.",
"Ruth closed the file. Then she opened it again, took a pen, and in the margin beside the name she wrote, in a hand whose descenders went long: keep her."]},

{k:'tashkent',st:'TASHKENT',tc:'23:48',ti:'Static From Tashkent',p:[
"The listening post was a converted grain silo with a roof that sang in the wind, and Okonkwo had been alone in it for eleven weeks. The work was not difficult. You logged bursts. You noted frequencies. You slept badly and ate from tins, and once a fortnight a truck came with more tins.",
"On the seventy-third night the set picked up a voice instead of a burst.",
"It was speaking Uzbek, badly, with a Kaduna accent — the hard t, the swallowed vowels — and it was reading numbers.",
"Okonkwo's brother had died in 2009. There had been a service. There had been a coffin, which had been closed, and a man from the Ministry who explained with great patience that the closing of coffins was routine in cases of this kind, and Okonkwo had been twenty-two and had believed him, because believing him was easier than the alternative.",
"He wrote down the numbers. His hand was steady; he noticed this with a kind of distant scientific interest, the way you notice weather.",
"Then he did the thing he had been trained to do, which was to log the transmission, timestamp it, seal it, and place it in the pouch for the fortnightly truck.",
"Then he did the thing he had not been trained to do. He took the log sheet back out, copied the numbers onto the inside of his forearm in ballpoint, and sat in the singing dark repeating them until they were his.",
"Eleven weeks is a long time to be alone with a voice. He intended to use every night of it."]},

{k:'arith',st:'VIENNA',tc:'05:45',ti:'The Arithmetic of Trust',p:[
"Three names, one leak, and a deadline London had set at 06:00 without asking whether it was possible.",
"Devlin laid the files on the table in the order he had received them, then rearranged them, then rearranged them again, which is what a man does when the arrangement is not the problem.",
"Sokolova: eight years, nineteen products, never once late. A daughter at university in Leeds, the fees paid from an account Devlin had opened himself.",
"Bräuer: two years, thin output — but the two things he had given them had been the two things that mattered, and he had given them at a cost that showed in his face.",
"Ilyas: recruited nine months ago, by Devlin, over four dinners, with an argument Devlin had believed while he was making it.",
"One of them was selling. The mathematics did not care which. Burn all three and the leak stops and two innocent people stop with it. Burn none and London finds someone less sentimental to do the sum.",
"At four he poured a whisky and did not drink it. At five he thought about Ilyas saying, over the fourth dinner, you talk about this as though it were a kindness — and about himself answering, it is, and meaning it, which was the worst part.",
"At 05:45 he wrote one name on a slip of paper and folded it twice. He was fairly sure he had chosen correctly. Fairly sure was the most anyone in that building had ever been about anything. He had simply never had to find out, before, what fairly sure weighed when you put a person on the other side of it."]},

{k:'winter',st:'BORDER',tc:'03:20',ti:'Winterlight',p:[
"The crossing went perfectly, which is how Vance knew something had gone wrong.",
"Fourteen minutes at the fence. The dogs were where the schedule said. The truck was where the schedule said. The boy — nineteen, a physicist's son, carrying nothing but a satchel and an expression of enormous calm — climbed into the compartment without being told twice, and by 03:20 they were on the road and the border was a line of sodium light shrinking in the mirror.",
"Vance had run eleven of these. Nine had gone badly in ways that still woke him. Two had gone well. Neither of the two had gone like this.",
"At the safe house he sat with the boy while the kettle boiled and asked the questions you ask, and the boy answered them all, fluently, in the order Vance asked them, without once pausing to remember. His father's department. The building's east stair. His mother's maiden name.",
"Vance poured the tea. His hands were fine. His hands were always fine.",
"\"You have done this before,\" he said.",
"The boy looked at him with that enormous calm, and for one moment — a single moment Vance would carry the rest of his life the way you carry a fragment of shrapnel too close to something important to remove — he looked almost sorry.",
"\"So have you,\" the boy said.",
"Outside, the sodium light was coming up over the fields, and somewhere behind them, at a fence that had been left unguarded for fourteen minutes, eleven people Vance had never met were already being woken."]},

{k:'watches',st:'BUDAPEST',tc:'11:05',ti:'The Man Who Returned Things',p:[
"In the third year of his retirement Teodor opened a shop that repaired watches, and did not advertise, and made enough.",
"They found him in the fifth year, as he had known they would. A woman came in with a Longines that did not need repairing, put it on the counter, and said the name he had not heard spoken aloud since Budapest.",
"\"No,\" Teodor said.",
"\"You haven't heard it yet.\"",
"\"I have heard all of them.\" He turned the watch over, because his hands did that on their own now. \"They are the same one. Someone is where they should not be, and I am the only person who can be sent, because I am the only person no one will miss.\"",
"The woman did not deny it. That was almost courteous.",
"He thought about the shop. Forty-one watches on the rack behind him, each with a paper tag, each belonging to someone who would come back on a Thursday expecting to find it done. He thought about how long it takes to become a man whose absence is noticed by forty-one people, and how easily that is undone.",
"\"Who is it,\" he said. Not a question — he had stopped using the shape of questions years ago.",
"She told him.",
"Teodor set the Longines down very gently, the way you set down something that is not yours, and looked at his own hands for a while, and found that they had already decided.",
"\"Thursday,\" he said. \"Tell them after Thursday. Forty-one people are expecting their watches.\""]},

{k:'signal',st:'HIGHGATE',tc:'—',ti:'Signal to Noise',p:[
"The tape had been in the box with his medals and his razor and a paperback with a cracked spine, which is to say it had been in the box for eleven years, which is to say Mira had not opened the box.",
"She opened it on a Sunday for no reason she could name.",
"The tape was a dictation cassette, the kind they used in the eighties, and it took her four days to find a machine and a further two to work up to pressing the key.",
"What came out was numbers. A woman's recorded voice, flat and pleasant, reading five-figure groups, the way the shortwave stations did. Twenty minutes of them. Then a click, and nothing, and then — so faint she had to play it eleven times to be certain — her husband clearing his throat.",
"That was all. That was the whole message.",
"She understood then what the tape was. Not a transmission. A key. He had recorded the broadcast because somewhere in the numbers was something meant for him, and he had never had the chance to work it out, or had worked it out and not written it down, and either way the meaning had gone into the ground at Highgate with the rest of him.",
"She could have taken it somewhere. There are people who do this. There were people, then, who would have done it in an afternoon.",
"Instead she rewound the tape to the throat-clearing and played it again. And again. A small, ugly, human sound, two seconds long, with no cipher in the world hiding anything inside it.",
"She played it until the batteries went."]}
];
/* Fragment banks. Every opener works with every middle and every close,
   because each is a complete sentence that assumes nothing of its neighbours. */
const IC_ST=['LISBON','TRIESTE','TASHKENT','VALLETTA','ODESSA','HELSINKI','TANGIER','BELGRADE','MACAU','REYKJAVÍK','GDAŃSK','ADEN'];
const IC_A=[
"The drop was serviced at 06:12. The chalk mark was there; the package was not.",
"Third meet in eleven days. He arrived early, which he has never done.",
"She refused the car and walked. Nineteen minutes, no counter-surveillance, no attempt at any.",
"The signal came on the wrong frequency, in the right hand.",
"Payment was declined for the second month running. He did not mention it.",
"The café was closed for a funeral. He waited across the road for fifty minutes anyway.",
"He brought the product unsealed. There is no protocol for this, because no one thought it would be needed.",
"The courier was replaced without notice. The replacement knew the recognition phrase and nothing else.",
"He left the window shutter half-open — our abort sign since 2011 — and then kept the meeting.",
"She asked to be photographed. I have never had an asset ask to be photographed."];
const IC_B=[
"Registry has no record of the authorisation, and London is not answering.",
"The handwriting on the receipt does not match the handwriting on file, and the file is four years old.",
"Two of the names on the list were closed in 2011. Someone is running the dead.",
"The frequency belongs to a station decommissioned before either of us was posted.",
"He asked after a person by a name only three people have ever used.",
"The surveillance photograph shows a second man in the doorway. The second man is one of ours.",
"The account was funded from a bank that stopped existing in March.",
"Nothing in the product is false. That is what troubles me.",
"The tin was warm. It had been in someone's hand within the minute.",
"He has begun leaving the second copy. No one asked him for a second copy."];
const IC_C=[
"Recommend continuation. He has no one else to talk to, and neither, at present, do I.",
"Recommend continuation. Whatever he is, he is telling us the truth about it.",
"He asked whether the work had been worth anything. I gave him the answer we are required to give.",
"Request permission to tell him the truth before somebody less kind does.",
"File under watch. I would like it noted that I did not want to.",
"He has begun signing off with his own name. I have not corrected him.",
"Advise termination. Advise, also, that someone other than me carry it.",
"She is not going to run. I have stopped pretending that this is good news.",
"Close the file if you must. I am keeping my copy.",
"There is nothing further to report, which is itself the report."];
/* deterministic, well-mixed — same seed, same intercept, forever */
function h32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function intercept(seed){
  const s=String(seed), h=h32(s), g=h32(s+'·'), f=h32('·'+s);
  const st=IC_ST[h%IC_ST.length];
  const hh=String(g%24).padStart(2,'0'), mm=String((f>>>3)%60).padStart(2,'0');
  return { id:'ic-'+s, kind:'intercept', station:st, tc:hh+':'+mm,
    ref:st.slice(0,3)+'/'+String(h%9000+1000),
    lines:[IC_A[h%IC_A.length], IC_B[(g>>>5)%IC_B.length], IC_C[(f>>>7)%IC_C.length]] };
}
let dSeen={}, dSeed=1, dOpen={};
const dispatchDate=i=>Date.now()-(i+1)*7.1*36e5;   // spaced so the river interleaves
function dispatchRiver(){
  const out=DISPATCH.map((d,i)=>({...d,kind:'dispatch',date:dispatchDate(i),idx:i}));
  for(let i=0;i<dSeed;i++){
    /* seed order is decrypt order, so the newest must carry the newest
       timestamp — dating them the other way pushed each new one down. */
    const ic=intercept(i+1), age=(dSeed-1-i)*5.3+2.2;
    out.push({...ic,date:Date.now()-age*36e5});
  }
  return out;
}

/* ═══ CASTS ═══════════════════════════════════════════════
   Discovery runs against Apple's public podcast search, which
   needs no key and answers a browser directly. Episodes come
   from the show's own RSS through the same ladder the news
   sources use, so a working /api/rss fixes both at once.
   ═══════════════════════════════════════════════════════ */
const SHELF=[
  {t:'BiggerPockets Real Estate',q:'BiggerPockets Real Estate Podcast'},
  {t:'Real Estate Rookie',q:'Real Estate Rookie'},
  {t:'Afford Anything',q:'Afford Anything Paula Pant'},
  {t:'Best Real Estate Investing Advice Ever',q:'Best Real Estate Investing Advice Ever'},
  {t:'Rental Income',q:'Rental Income Podcast Dan Lane'},
  {t:'Commercial real estate',q:'commercial real estate investing'},
  {t:'Property management',q:'property management podcast'},
  {t:'Affordable housing',q:'affordable housing policy podcast'}
];
let casts=[], castQ='', castHits=[], castBusy=false, castNote='', castView='shelf';
let openShow=null, eps=[], epBusy=false, epNote='', epsFrom='shelf';
/* Two players. A podcast host that allows cross-origin reads can be
   analysed — its audio is routed through a stereo analyser — but a host
   that does not would play silence through that same routing. So hosts
   are probed once, remembered, and each episode goes to the player that
   suits its host: analysed where allowed, plain everywhere else. */
const audioP=new Audio(); audioP.preload='none';
const audioA=new Audio(); audioA.preload='none'; audioA.crossOrigin='anonymous';
let audio=audioP;
let nowEp=null, rate=1, playing=false;
const corsHost={};                                  // host → true | false, once probed
const hostOf=u=>{ try{ return new URL(u).host }catch(e){ return '' } };
async function probeCORS(u){
  const h=hostOf(u); if(!h||h in corsHost)return corsHost[h];
  const ctl=typeof AbortController!=='undefined'?new AbortController():null, to=ctl&&setTimeout(()=>ctl.abort(),6000);
  try{ const r=await fetch(u,{headers:{Range:'bytes=0-1'},cache:'no-store',signal:ctl&&ctl.signal});
       corsHost[h]=!!(r.ok||r.status===206);
       try{ r.body&&r.body.cancel&&r.body.cancel() }catch(_){} }          // two bytes were asked for; take no more
  catch(e){ corsHost[h]=false }
  finally{ if(to)clearTimeout(to) }
  return corsHost[h];
}
let actx=null, anL=null, anR=null, wL=null, wR=null;
function stereoGraph(){
  if(actx)return true;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(audioA), sp=actx.createChannelSplitter(2);
    anL=actx.createAnalyser(); anR=actx.createAnalyser(); anL.fftSize=anR.fftSize=1024;
    wL=new Uint8Array(anL.fftSize); wR=new Uint8Array(anR.fftSize);
    src.connect(sp); sp.connect(anL,0); sp.connect(anR,1); src.connect(actx.destination);
    return true }
  catch(e){ actx=null; return false }
}
const RATES=[1,1.25,1.5,1.75,2,.85];

async function castSearch(q){
  if(!q)return; castQ=q; castBusy=true; castNote=''; castView='hits'; paint();
  try{
    const u='https://itunes.apple.com/search?media=podcast&entity=podcast&limit=24&term='+encodeURIComponent(q);
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    castHits=(j.results||[]).filter(x=>x.feedUrl).map(x=>({
      id:String(x.collectionId||x.feedUrl), name:x.collectionName||'(untitled)',
      artist:x.artistName||'', feed:x.feedUrl,
      art:x.artworkUrl600||x.artworkUrl100||'', n:x.trackCount||0,
      genre:x.primaryGenreName||''}));
    castNote=castHits.length?'':'No shows matched "'+q+'".';
  }catch(e){
    castHits=[];
    castNote = netErr(e)
      ? (SANDBOXED?'Podcast search is blocked by this preview sandbox. Served from your own domain it answers fine — or paste a feed URL below.'
                  :'Podcast search could not be reached from the browser. Paste a feed URL below instead.')
      : String(e.message||e);
  }
  castBusy=false; paint();
}
function tag(n,name){
  /* namespaced tags (itunes:duration) break querySelector in XML documents */
  const a=n.getElementsByTagName(name); if(a&&a.length)return a[0].textContent.trim();
  const b=n.getElementsByTagName(name.replace(/^.*:/,'')); return b&&b.length?b[0].textContent.trim():'';
}
function parseCast(xml,show){
  const d=new DOMParser().parseFromString(xml,'application/xml');
  if(d.querySelector('parsererror'))throw new Error('the feed is not valid XML');
  const ch=d.getElementsByTagName('channel')[0]||d;
  const showArt=(ch.getElementsByTagName('itunes:image')[0]||{}).getAttribute?.('href')||show.art||'';
  return [...d.getElementsByTagName('item')].map(n=>{
    const encl=n.getElementsByTagName('enclosure')[0];
    let url=encl?encl.getAttribute('url')||'':'';
    if(!url){ const mc=n.getElementsByTagName('media:content')[0]; if(mc)url=mc.getAttribute('url')||'' }
    const durRaw=tag(n,'itunes:duration');
    return { title:tag(n,'title')||'(untitled)', url,
      date:Date.parse(tag(n,'pubDate'))||0,
      dur:secs(durRaw),
      desc:(tag(n,'itunes:summary')||tag(n,'description')||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,320),
      art:showArt, show:show.name };
  }).filter(e=>e.url);
}
function secs(v){
  if(!v)return 0;
  if(/^\d+$/.test(v))return +v;
  const p=v.split(':').map(Number);
  if(p.some(isNaN))return 0;
  return p.reduce((a,b)=>a*60+b,0);
}
async function openCast(show){
  openShow=show; eps=[]; epBusy=true; epNote=''; castView='eps'; paint();
  try{ eps=parseCast(await rawFeed(show.feed),show).slice(0,60);
       epNote=eps.length?'':'The feed parsed, but carried no playable episodes.';
       if(eps[0])probeCORS(eps[0].url) }                   // learn the host before the first tap
  catch(e){ epNote = netErr(e)
      ? (API?'The backend could not reach that feed.'
           :'This feed will not answer the browser directly. Start the site so /api/rss is live, or switch the relay on in Sources.')
      : String(e.message||e) }
  epBusy=false; paint();
}
function subscribe(show){
  if(casts.some(c=>c.feed===show.feed)){ toast('Already on the shelf'); return }
  casts.unshift({id:show.id,name:show.name,artist:show.artist,feed:show.feed,art:show.art,n:show.n});
  persist(); toast('Added · '+show.name); paint();
}
const subscribed=f=>casts.some(c=>c.feed===f);

function playEp(e){
  nowEp=e; vErrC('');
  ARC.log('late','Playing '+e.title+' · '+e.show);
  /* the choice is made now, inside the tap, so iOS still counts it as the user's */
  const ana=corsHost[hostOf(e.url)]===true&&stereoGraph();
  const next=ana?audioA:audioP;
  if(audio!==next){ try{ audio.pause(); audio.removeAttribute('src'); audio.load() }catch(_){} audio=next }
  if(ana&&actx&&actx.state!=='running')actx.resume().catch(()=>{});
  if(!ana)probeCORS(e.url);                         // so the next episode from this host can be analysed
  try{
    audio.src=e.url; audio.playbackRate=rate;
    const p=audio.play();
    if(p&&p.catch)p.catch(err=>vErrC(String(err&&err.message||err)));
    playing=true;
  }catch(err){ vErrC(String(err&&err.message||err)); playing=false }
  paint();
}
const vErrC=t=>{const e=$('#cbErr'); if(e)e.textContent=t||''};
for(const el of [audioP,audioA]){                // only the player in use speaks
  const me=f=>ev=>{ if(ev.target===audio)f(ev) };
  el.addEventListener('play',me(()=>{playing=true;bar()}));
  el.addEventListener('pause',me(()=>{playing=false;bar()}));
  el.addEventListener('timeupdate',me(bar));
  el.addEventListener('loadedmetadata',me(bar));
  el.addEventListener('error',me(()=>{
    if(!el.getAttribute('src'))return;
    playing=false;
    vErrC('That episode would not load. Some hosts refuse cross-site playback; try another episode or open the show in a podcast app.');bar()}));
  el.addEventListener('ended',me(()=>{
    const i=eps.indexOf(nowEp);
    if(i>=0&&i+1<eps.length)playEp(eps[i+1]); else {playing=false;bar()}
  }));
}
/* the podcast, drawn: left and right channels as they play when the host
   allows it to be analysed; otherwise the line says so and stays flat */
function castViz(){
  const c=$('#cbViz'); if(!c||!nowEp)return;
  const g=fitCanvas(c); if(!g)return; const {x,w,h}=g;
  x.clearRect(0,0,w,h);
  const C=TONE.late.c, C2=TONE.late.c2, mid=h/2, live=audio===audioA&&actx&&playing;
  x.fillStyle='rgba(220,216,242,.12)'; x.fillRect(0,mid,w,1);
  if(!live){ x.font='500 9.5px "IBM Plex Mono",ui-monospace,monospace'; x.fillStyle='rgba(160,160,185,.8)'; x.textAlign='center';
    x.fillText(audio===audioA?'paused':'this host does not allow the audio to be analysed',w/2,mid-5); return }
  anL.getByteTimeDomainData(wL); anR.getByteTimeDomainData(wR);
  const trace=(buf,sgn,col)=>{ x.beginPath(); const n=buf.length, st=Math.max(1,Math.floor(n/w));
    for(let i=0;i<n;i+=st){ const xx=i/(n-1)*w, v=Math.abs(buf[i]-128)/128; const yy=mid+sgn*v*(mid-2); i?x.lineTo(xx,yy):x.moveTo(xx,yy) }
    x.strokeStyle=col; x.lineWidth=1.2; x.stroke() };
  trace(wL,-1,rgba(C2,.95)); trace(wR,1,rgba(C,.85));
  x.font='600 8px "IBM Plex Mono",ui-monospace,monospace'; x.textAlign='left'; x.fillStyle=rgba(C2,.8);
  x.fillText('L',3,9); x.fillText('R',3,h-3);
}
function bar(){
  const w=$('#laBar'); if(!w)return;
  w.hidden=!nowEp; if(!nowEp)return;
  const d=audio.duration||nowEp.dur||0, t=audio.currentTime||0;
  $('#cbT').textContent=nowEp.title;
  $('#cbS').textContent=nowEp.show;
  $('#cbTime').textContent=fmt(t)+' / '+(d?fmt(d):'—');
  const s=$('#cbSeek'); if(s&&document.activeElement!==s)s.value=d?Math.round(t/d*1000):0;
  $('#cbPlay').textContent=playing?'❚❚':'▶';
  $('#cbRate').textContent=rate+'×';
}

/* ═══ THE RIVER ═══════════════════════════════════════════
   News, dispatches and everything the other five pages have
   shared, merged into one stream and sorted by time. That is
   what "sharing is caring" buys: your chess position lands in
   the same river as the county planning agenda.
   ═══════════════════════════════════════════════════════ */
const FROM_GLYPH={state:'◉',mate:'♞',skate:'▲',plate:'▭',slate:'▶',late:'◈',rig:'◈'};
const KIND_NAME={track:'track',position:'position',lap:'lap',plate:'plate',video:'video',
  story:'dispatch',episode:'episode',note:'note',word:'word',grid:'map'};
let filt='all';
const LANES=[['all','All'],['shared','Shared'],['dispatch','Dispatch'],['local','Local'],
  ['county','County'],['re','Real estate'],['ai','AI / tech'],['other','Other']];

function river(){
  if(filt==='shared')return BUS.items.map(s=>({kind:'shared',date:s.t,s}));
  if(filt==='dispatch')return dispatchRiver().sort((a,b)=>b.date-a.date);
  const news=(filt==='all'?items:filt==='local'?items.filter(i=>i.local):items.filter(i=>i.cat===filt))
    .map(i=>({kind:'news',date:i.date,i}));
  if(filt!=='all')return news;
  return [...news,
    ...BUS.items.map(s=>({kind:'shared',date:s.t,s})),
    ...dispatchRiver()].sort((a,b)=>b.date-a.date);
}
function cardNews(i){
  return '<div class="acard">'+
    '<div class="src">'+esc(i.src)+'</div>'+

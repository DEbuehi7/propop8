function riverSVG(W,H,live){
    const f1=P8.f1, tap=(k,v,inner)=>live?'<g data-'+k+'="'+v+'" style="cursor:pointer">'+inner+'</g>':inner;
    const C=TONE.late.c, C2=TONE.late.c2;
    const byFrom={}; for(const s of BUS.items)byFrom[s.from]=(byFrom[s.from]||0)+1;
    const ok=srcs.filter(s=>String(s.status||'').startsWith('ok')).length;
    const flow=[...items.map(i=>({kind:'news',date:i.date,t:i.title,src:i.src})),
      ...BUS.items.map(s=>({kind:'shared',date:s.t,t:s.title||s.kind,src:s.from})),
      ...dispatchRiver().map(d=>({kind:d.kind,date:d.date,t:d.kind==='intercept'?'Intercept '+d.ref:d.ti,src:d.kind}))]
      .sort((a,b)=>b.date-a.date);
    const trib=[
      {t:'NEWS', n:items.length, sub:ok+'/'+srcs.length+' sources live', k:C, tk:'f', tv:'all'},
      {t:'CASTS', n:casts.length, sub:'on the shelf', k:C2, tk:'cast', tv:'1'},
      {t:'SHARED', n:BUS.items.length, sub:'from the suite', k:'#EDEBF5', parts:byFrom, tk:'f', tv:'shared'},
      {t:'DISPATCH', n:DISPATCH.length+dSeed, sub:DISPATCH.length+' + '+dSeed+' decrypted', k:'#C9C5E6', tk:'f', tv:'dispatch'}];
    const sx=12, top=30, gap=(H-top-44)/(trib.length-1), jx=W*.4, ry=H*.52, rx1=W-10;
    let o='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs>'+P8.bloom('hcLbl'+(live?'F':''),'#fff',1.4)+
      '<linearGradient id="hcLrv'+(live?'F':'')+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+C+'" stop-opacity=".10"/><stop offset="1" stop-color="'+C+'" stop-opacity=".34"/></linearGradient></defs>';
    /* the stream widens toward the mouth, which is now */
    o+='<path d="M'+f1(jx)+','+f1(ry-4)+' C'+f1((jx+rx1)/2)+','+f1(ry-6)+' '+f1(rx1-30)+','+f1(ry-12)+' '+f1(rx1)+','+f1(ry-13)+
       ' L'+f1(rx1)+','+f1(ry+13)+' C'+f1(rx1-30)+','+f1(ry+12)+' '+f1((jx+rx1)/2)+','+f1(ry+6)+' '+f1(jx)+','+f1(ry+4)+'Z" fill="url(#hcLrv'+(live?'F':'')+')"/>'+
       '<path d="M'+f1(jx)+','+f1(ry)+' L'+f1(rx1)+','+f1(ry)+'" stroke="'+C2+'" stroke-opacity=".28" stroke-dasharray="1.5 3"/>';
    /* tributaries: width by what each one has contributed */
    trib.forEach((s,i)=>{ const y=top+i*gap, w=.6+Math.log1p(s.n)*.75, nx=sx+4, tx=jx-34;
      o+='<path d="M'+f1(tx)+','+f1(y-3)+' C'+f1(jx-14)+','+f1(y-3)+' '+f1(jx-22)+','+f1(ry)+' '+f1(jx+6)+','+f1(ry)+'" fill="none" stroke="'+s.k+'" stroke-opacity="'+(s.n?.55:.14)+'" stroke-width="'+f1(w)+'"'+(s.n?'':' stroke-dasharray="2 3"')+'/>'+
         '<line x1="'+f1(nx+8)+'" y1="'+f1(y-3)+'" x2="'+f1(tx)+'" y2="'+f1(y-3)+'" stroke="'+s.k+'" stroke-opacity="'+(s.n?.18:.07)+'" stroke-dasharray="1 3"/>'+
         tap(s.tk,s.tv,'<rect x="'+f1(nx-8)+'" y="'+f1(y-14)+'" width="'+f1(tx-nx+4)+'" height="26" fill="transparent"/>'+
         '<circle cx="'+f1(nx)+'" cy="'+f1(y-3)+'" r="'+f1(2.4+Math.min(3.4,Math.sqrt(s.n)*.6))+'" fill="'+(s.n?s.k:'#0B0B12')+'" stroke="'+s.k+'" stroke-width=".9"'+(s.n?' filter="url(#hcLbl'+(live?'F':'')+')"':'')+'/>'+
         P8.note(nx+10,y-1,s.t+' '+s.n,{k:s.n?'#EDEBF5':'#77768F',s:8,w:600,ls:.12,halo:1})+P8.note(nx+10,y+8,s.sub,{k:'#77768F',s:7,halo:1}));
      if(s.parts){ let px=nx+10; const py=y+15;
        for(const id of ['state','mate','skate','plate','slate']){ const n=s.parts[id]; if(!n)continue;
          o+='<circle cx="'+f1(px+2)+'" cy="'+f1(py)+'" r="'+f1(1.6+Math.min(2.2,Math.sqrt(n)*.55))+'" fill="'+TONE[id].c+'"/>'; px+=8 } }
    });
    /* what is in the stream: newest at the mouth, lane by kind, colour by origin */
    const lane={news:-5,shared:5,dispatch:0,intercept:0}, shown=flow.slice(0,28), span=rx1-jx-14;
    shown.forEach((it,k)=>{ const x=rx1-8-k*(span/Math.max(1,shown.length-1)), y=ry+(lane[it.kind]||0)*(.4+.6*(1-k/shown.length));
      const col=it.kind==='news'?C:it.kind==='shared'?(TONE[it.src]?TONE[it.src].c:'#EDEBF5'):it.kind==='dispatch'?'#FFFFFF':'#9C98BE';
      o+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(k===0?3.4:2.1)+'" fill="'+col+'" opacity="'+(1-k/shown.length*.55).toFixed(2)+'"'+(k===0?' filter="url(#hcLbl'+(live?'F':'')+')"':'')+'/>' });
    o+=P8.note(rx1,top-14,flow.length+' in the river',{a:'end',k:C2,s:8.2,w:600});
    /* the newest thing in it, named */
    const nw=flow[0];
    if(nw){ o+=P8.note(sx,H-19,(nw.kind==='shared'?'SHARED · '+String(nw.src).toUpperCase():nw.kind==='news'?'NEWS · '+String(nw.src||'').toUpperCase():nw.kind==='intercept'?'INTERCEPT':'DISPATCH').slice(0,48),{k:C2,s:7.6,ls:.12})+
        P8.note(sx,H-7,String(nw.t||'').slice(0,Math.floor(W/6.2)),{k:'#EDEBF5',s:10,w:600}) }
    /* a podcast in hand: where you are in it (Late pauses it when you leave) */
    if(nowEp&&audio.duration){ const fr=clamp(audio.currentTime/audio.duration,0,1), ax=jx+6, aw=rx1-ax;
      o+=P8.note(ax,ry-27,'▮▮ '+String(nowEp.title||'').slice(0,30),{k:'#EDEBF5',s:7.8,halo:1})+
        '<rect x="'+f1(ax)+'" y="'+f1(ry-22)+'" width="'+f1(aw)+'" height="2" rx="1" fill="#FFFFFF" fill-opacity=".16"/>'+
        '<rect x="'+f1(ax)+'" y="'+f1(ry-22)+'" width="'+f1(aw*fr)+'" height="2" rx="1" fill="'+C+'"/>' }
    return o+'</svg>';
}

ARC.register({
  id:'late', label:'late',
  /* The river: every tributary that feeds Late — the news sources,
     the podcast shelf, shares from the other five instruments, the
     dispatches — flows into one stream, and what is in the stream sits
     on it newest-downstream, coloured by where it came from. */
  card(sz){

  },

  search(q,hit){ const out=[];

  save:()=>({srcs,items:items.slice(0,80),local,useRelay,casts,dSeed,dOpen}),

      {v:sh?String(sh):(ok+'/'+srcs.length), l:sh?'shared here':'sources live', f:sh?clamp(sh/12,0,1):(srcs.length?ok/srcs.length:0)},
      {v:(loc*100).toFixed(0)+'%', l:'local', f:loc}]}
});

/* transport wiring lives outside the painters so it survives repaints */
document.addEventListener('click',e=>{

  else if(t.id==='cbStop'){ audio.pause(); audio.removeAttribute('src'); nowEp=null; bar(); castPane() }

});
});

/* ═══════════════ HOME — the suite ═════════════════════════
   The concept board's best idea, made honest. Six cards, each
   drawn by its own module from its own engine — the board is
   the real position, the circuit is the real track, the plate
   is the plate you are on. The activity stream only contains
   things that happened. Nothing on this page is decorative,
   and nothing moves unless the data under it moved.           */
mod('home',()=>{
const MODS=[
  {id:'state', name:'State', sub:'Sound, analysed'},
  {id:'mate',  name:'Mate',  sub:'Analytical chess'},
  {id:'skate', name:'Skate', sub:'Autonomous racing'},
  {id:'plate', name:'Plate', sub:'California plate words'},
  {id:'slate', name:'Slate', sub:'Video discovery'},
  {id:'late',  name:'Late',  sub:'News, casts & dispatches'}
].map(M=>({...M, c:TONE[M.id].c, c2:TONE[M.id].c2, ci:TONE[M.id].ci}));
const BYID=Object.fromEntries(MODS.map(M=>[M.id,M]));
const esc=P8.esc;
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const since=t=>{const s=(Date.now()-t)/1000;
  return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
let built=false, acc=0, lastRef=0, warmed=false, lastMod=null;
const seenIds=new Set(), BOOT=Date.now();   // shares the engine has already carried; when this session began

/* ═══ THE PLATE8 ENGINE ════════════════════════════════════
   The six-dot mark, grown into the rig's kernel drawn as an
   object: an 8 whose two loops carry the six instruments.
   The outer arc of each loop belongs to an instrument; the
   inner arcs are the bus, and they meet at the waist, where
   the white core is — the shared layer every share passes
   through. Satellite size is your time there. A live engine
   sends a line to the core; a share runs source → core → Late.
   Extruded by stacking, lit from the rig's one light.        */
const EW=240, EH=330, TOP={x:120,y:94,r:58}, BOT={x:120,y:222,r:70};
const SAT={state:[TOP,210],mate:[TOP,270],skate:[TOP,330],plate:[BOT,30],slate:[BOT,90],late:[BOT,150]};
const rad=d=>d*Math.PI/180;
const onRing=(R,a,dr)=>[R.x+Math.cos(rad(a))*(R.r+(dr||0)), R.y+Math.sin(rad(a))*(R.r+(dr||0))];
function arcPts(R,a0,a1){ const n=Math.max(2,Math.ceil(Math.abs(a1-a0)/5)), o=[];
  for(let i=0;i<=n;i++){const p=onRing(R,a0+(a1-a0)*i/n); o.push(P8.f1(p[0])+','+P8.f1(p[1]))} return o }
const arcD=(R,a0,a1)=>'M'+arcPts(R,a0,a1).join(' L');
/* the route from a satellite to the core, along its loop's inner (bus) side */
function toCore(id){
  const [R,a]=SAT[id];
  if(R===TOP) return a===210?[R,210,90]:[R,a,450];
  return [R,a,-90];
}
function packetPath(id){
  const [R,a0,a1]=toCore(id), p1=arcPts(R,a0,a1), p2=arcPts(BOT,270,150);
  return 'M'+p1.concat(p2.slice(1)).join(' L');
}
function shareOf(){
  const tot=MODS.reduce((a,M)=>a+(ARC.sec[M.id]||0),0);
  return id=>tot>5?(ARC.sec[id]||0)/tot:1/6;
}
function engineSVG(){
  const sh=shareOf();
  let o='<svg viewBox="-24 -6 '+(EW+48)+' '+(EH+12)+'" role="img" aria-label="The Plate8 engine: six instruments around one shared core">'+
    '<defs>'+P8.bloom('engBl','#fff',3.2)+P8.bloom('engBl2','#fff',1.6)+
    '<radialGradient id="engCore"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".35" stop-color="#EDEBFA" stop-opacity=".35"/><stop offset="1" stop-color="#EDEBFA" stop-opacity="0"/></radialGradient>'+
    '<linearGradient id="engLit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>'+
    '</defs>';
  /* the extrusion: the same two loops, stacked down-right and darkening */
  for(let k=7;k>=1;k--){ const d=k*1.25, sh2=(28-k*2.2).toFixed(0);
    o+='<g transform="translate('+d+','+d+')" fill="none" stroke="rgb('+sh2+','+sh2+','+(+sh2+10)+')" stroke-width="12">'+
       '<circle cx="'+TOP.x+'" cy="'+TOP.y+'" r="'+TOP.r+'"/><circle cx="'+BOT.x+'" cy="'+BOT.y+'" r="'+BOT.r+'"/></g>' }
  /* the face: bus side neutral, instrument side in each colour */
  o+='<g fill="none" stroke-width="12" stroke-linecap="butt">'+
     '<path d="'+arcD(TOP,0,180)+'" stroke="#262634"/><path d="'+arcD(BOT,180,360)+'" stroke="#262634"/>';
  for(const M of MODS){ const [R,a]=SAT[M.id];
    o+='<path d="'+arcD(R,a-30,a+30)+'" stroke="'+M.c+'" stroke-opacity=".82"/>' }
  o+='</g>';
  /* bevel: the lit edge on the upper left of each loop, a shadow line under it */
  o+='<g fill="none" stroke="url(#engLit)" stroke-width="1.1">'+
     '<circle cx="'+TOP.x+'" cy="'+TOP.y+'" r="'+(TOP.r+5.6)+'"/><circle cx="'+BOT.x+'" cy="'+BOT.y+'" r="'+(BOT.r+5.6)+'"/>'+
     '<circle cx="'+TOP.x+'" cy="'+TOP.y+'" r="'+(TOP.r-5.6)+'" opacity=".6"/><circle cx="'+BOT.x+'" cy="'+BOT.y+'" r="'+(BOT.r-5.6)+'" opacity=".6"/></g>';
  /* the bus: a fine conduit on the inner arcs, meeting at the waist */
  o+='<g fill="none" stroke="#DCD8F2" stroke-opacity=".32" stroke-width=".9" stroke-dasharray="1.5 3.2">'+
     '<path d="'+arcD(TOP,0,180)+'"/><path d="'+arcD(BOT,180,360)+'"/></g>';
  o+='<g id="engLinks"></g>';
  /* satellites: magnitude to size — your time in each instrument */
  for(const M of MODS){ const [R,a]=SAT[M.id], [x,y]=onRing(R,a), s=sh(M.id), r=4.2+Math.sqrt(s)*9.5;
    const [lx,ly]=onRing(R,a,19), anc=Math.cos(rad(a))>.3?'start':Math.cos(rad(a))<-.3?'end':'middle';
    o+='<g class="esat" data-id="'+M.id+'">'+
       '<circle cx="'+P8.f1(x)+'" cy="'+P8.f1(y)+'" r="'+P8.f1(r*2.1)+'" fill="'+M.c+'" opacity=".14"/>'+
       '<circle class="esd" cx="'+P8.f1(x)+'" cy="'+P8.f1(y)+'" r="'+P8.f1(r)+'" fill="'+M.c+'" stroke="#0C0D16" stroke-width="1.4"><title>'+M.name+' · '+Math.round((ARC.sec[M.id]||0)/60)+' min</title></circle>'+
       '<circle cx="'+P8.f1(x-r*.32)+'" cy="'+P8.f1(y-r*.36)+'" r="'+P8.f1(r*.34)+'" fill="#fff" opacity=".35"/>'+
       P8.note(lx,ly+(Math.sin(rad(a))>.5?8:Math.sin(rad(a))<-.5?-2:3),M.name.toUpperCase(),{a:anc,s:8,k:M.c2,ls:.14,w:600})+'</g>' }
  /* the core: the shared layer. It glows, it does not move. */
  o+='<circle cx="120" cy="152" r="26" fill="url(#engCore)"/>'+
     '<circle cx="120" cy="152" r="9.5" fill="none" stroke="#EDEBFA" stroke-opacity=".45" stroke-width=".8"/>'+
     '<circle id="engCoreDot" cx="120" cy="152" r="5.2" fill="#FFFFFF" filter="url(#engBl2)"/>'+
     '<g id="engPk"></g></svg>';
  return o;
}
/* the live half of the engine, painted in place so an in-flight packet survives */
function engineLinks(live){
  const g=document.getElementById('engLinks'); if(!g)return;
  let o='';
  for(const M of MODS){
    const on=live[M.id], recent=!on&&lastMod===M.id; if(!on&&!recent)continue;
    const [R,a0,a1]=toCore(M.id);
    if(on)o+='<path d="'+arcD(R,a0,a1)+'" fill="none" stroke="'+M.c+'" stroke-width="5" stroke-opacity=".20" stroke-linecap="round"/>';
    o+='<path d="'+arcD(R,a0,a1)+'" fill="none" stroke="'+M.c+'" stroke-width="'+(on?2.2:1.3)+'" stroke-opacity="'+(on?.95:.5)+'"'+
       (on?' class="eflow"':'')+' stroke-linecap="round"/>';
  }
  g.innerHTML=o;
  const sh=shareOf();
  document.querySelectorAll('.esat').forEach(s=>{ const id=s.dataset.id, d=s.querySelector('.esd'); if(!d)return;
    const r=4.2+Math.sqrt(sh(id))*9.5+(live[id]?2.2:0); d.setAttribute('r',P8.f1(r)) });
}
/* shares made while you were elsewhere run their route when you come back */
function packets(){
  const pk=document.getElementById('engPk'); if(!pk)return;
  /* only shares made in this session travel: a restored board arrived
     long ago, and replaying it on every load would be decoration */
  const fresh=BUS.items.filter(x=>!seenIds.has(x.id)&&x.t>=BOOT);
  for(const x of fresh)seenIds.add(x.id);
  fresh.splice(0,fresh.length,...fresh.filter(x=>x.from!=='late'&&SAT[x.from]).slice(0,4).reverse());
  fresh.forEach((it,k)=>{
    const M=BYID[it.from]; if(!M)return;
    const ns='http://www.w3.org/2000/svg';
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('r','3.6'); c.setAttribute('fill',M.c); c.setAttribute('filter','url(#engBl)'); c.setAttribute('opacity','0');
    const am=document.createElementNS(ns,'animateMotion');
    am.setAttribute('dur','1.9s'); am.setAttribute('fill','freeze'); am.setAttribute('begin','indefinite');
    am.setAttribute('path',packetPath(it.from)); am.setAttribute('calcMode','spline');
    am.setAttribute('keyPoints','0;1'); am.setAttribute('keyTimes','0;1'); am.setAttribute('keySplines','.45 0 .25 1');
    c.appendChild(am); pk.appendChild(c);
    setTimeout(()=>{ c.setAttribute('opacity','1');
      try{ am.beginElement() }catch(e){}
      setTimeout(()=>{ c.remove(); const late=document.querySelector('.esat[data-id="late"] .esd');
        if(late&&late.animate)try{late.animate([{r:late.getAttribute('r')},{r:(+late.getAttribute('r')+4)+''},{r:late.getAttribute('r')}],{duration:520,easing:'ease-out'})}catch(e){} },1950);
    }, 350+k*650);
  });
}

function cardFor(M,sz){
  const m=ARC.mods[M.id];
  let c={}, g=[];
  try{ c=(m&&m.card)?m.card(sz)||{}:{} }catch(e){ c={mini:'',line:'card failed: '+e.message}; fail(M.id+':card',e) }
  try{ g=(m&&m.gauges)?m.gauges()||[]:[] }catch(e){ g=[] }
  return {c,g};
}
function cardHTML(M){

    '<footer class="hcf">'+P8.tabs(M.id,(m&&m.panes)||[])+P8.cta(M.id,M.name)+'</footer>'+

/* the ecosystem, live: every figure here is counted, none estimated */
/* time in the suite, one count for the chip and the footer; under a minute says so */
function suiteMin(){ const s=Object.values(ARC.sec).reduce((a,b)=>a+b,0)+(performance.now()-ARC.t0)/1000;
  return s<60?'<1':String(Math.floor(s/60)) }
function statsHTML(){
  const warm=MODS.filter(M=>ARC.mods[M.id]&&ARC.mods[M.id]._up).length;
  const live=MODS.filter(M=>liveNow[M.id]);
  return P8.chip(warm+'/6','engines warm','#DCD8F2')+

    P8.chip(String(LOG.items.length),'events','#DCD8F2')+
    P8.chip(String(BUS.items.length),'shared',TONE.late.c)+

}
function activityHTML(){

        '<span>'+esc(e.text)+'</span><em>'+esc(e.from)+'</em></div>').join('')
      :'<div class="hint" style="padding:8px 0 10px">Nothing yet. Play a move, bank a word, finish a lap, share something — it lands here, and only when it happens.</div>');
}
function build(){
  const host=$('#hub'); if(!host)return;
  const shared=BUS.items.length;
  host.innerHTML=
    '<div class="hroom">'+
    '<section class="hhero">'+
      '<div><div class="hk">Six instruments · one engine</div>'+
        '<h1 class="hh1"><span style="--a:var(--t-state);--a2:var(--t-state-2)">Play</span> '+
          '<span style="--a:var(--t-slate);--a2:var(--t-slate-2)">Create</span> '+
          '<span style="--a:var(--t-skate);--a2:var(--t-skate-2)">Explore</span> '+
          '<span style="--a:var(--t-late);--a2:var(--t-late-2)">Learn</span></h1>'+
        '<p class="hsub">Voice, chess, racing, plates, video and news. Each one computes something real, and all of them feed one river.</p>'+
        '<div class="hstats" id="hStats">'+statsHTML()+'</div></div>'+
      '<div class="heng" id="hEmb">'+engineSVG()+'</div>'+
    '</section>'+
    '<div class="hgrid">'+MODS.map(cardHTML).join('')+'</div>'+
    '<section class="hact" id="hAct">'+activityHTML()+'</section>'+
    '</div>'+
    '<footer class="hfoot"><span>PLATE8 · PART OF PROPOPS8</span>'+
      '<span id="hTot">'+suiteMin()+' MIN IN THE SUITE · '+shared+' SHARED</span></footer>';
  built=true;
  requestAnimationFrame(()=>{ refresh(true); packets() });
}
/* cheap refresh: minis, figures and the stream, never the shell —
   rebuilding the shell every tick would eat hover and focus */
const liveNow={};
function refresh(force){
  if(!built){build();return}
  for(const M of MODS){
    const el=document.querySelector('.hc[data-id="'+M.id+'"]'); if(!el)continue;
    const mi=el.querySelector('.hcm');
    const sz=mi&&mi.clientWidth?{w:mi.clientWidth,h:mi.clientHeight}:{w:330,h:196};
    const {c,g}=cardFor(M,sz);
    const st=el.querySelector('.hcs'), ln=el.querySelector('.hcl .hln'), pw=el.querySelector('.hpw');
    const nm=c.mini||'';
    if(mi&&(force||mi._last!==nm)){ mi.innerHTML=nm; mi._last=nm }
    const m=ARC.mods[M.id];
    if(mi&&m&&m.cardDraw){ const cv=mi.querySelector('canvas'); if(cv)ARC.safe(()=>m.cardDraw(cv,performance.now()),M.id+':card') }
    if(st){ const r=P8.rail(g); if(st._last!==r){ st.innerHTML=r; st._last=r } }
    if(ln)ln.textContent=c.line||'';
    const live=!!c.live; liveNow[M.id]=live;
    if(el.dataset.live!==(live?'1':'0'))el.dataset.live=live?'1':'0';
    if(pw){ const p=P8.pulse(live,c.status); if(pw._last!==p){ pw.innerHTML=p; pw._last=p } }
  }
  const a=$('#hAct'); if(a){ const h=activityHTML(); if(a._last!==h){ a.innerHTML=h; a._last=h } }
  const hs=$('#hStats'); if(hs){ const x=statsHTML(); if(hs._last!==x){ hs.innerHTML=x; hs._last=x } }
  engineLinks(liveNow);
  const t=$('#hTot'); if(t)t.textContent=suiteMin()+' MIN IN THE SUITE · '+BUS.items.length+' SHARED';
}
/* every card needs its engine up; mount the cold ones one at a time
   so the first paint is never held up by six mounts at once */
function warm(){
  if(warmed)return; warmed=true;
  let k=0;
  for(const M of MODS){
    const m=ARC.mods[M.id]; if(!m||m._up)continue;
    setTimeout(()=>{ ARC.ensure(M.id); if(ARC.cur==='home')refresh() }, 30+(k++)*70);
  }
}
function wire(){
  const host=$('#hub'); if(!host||host._wired)return; host._wired=true;
  host.addEventListener('click',e=>{
    const b=e.target.closest('[data-open]');
    if(b){ const id=b.dataset.open, p=b.dataset.pane, m=ARC.mods[id];
      if(b.dataset.play&&m&&m.playNow)ARC.safe(()=>m.playNow(),id);
      go(id); if(p&&ARC.cur===id)setPane(p); return }
    const card=e.target.closest('.hc'); if(card&&!e.target.closest('button'))go(card.dataset.id);
  });
}
LOG.on(()=>{ if(ARC.cur==='home'){const a=$('#hAct'); if(a)a.innerHTML=activityHTML()} });
BUS.on(()=>{ if(ARC.cur==='home'){ refresh(); packets() } });

ARC.register({
  id:'home', label:'home',
  panes:[['hub','Suite']],
  mount(){ wire(); build(); warm() },
  enter(){ wire(); if(built){ const e=$('#hEmb'); if(e)e.innerHTML=engineSVG(); refresh(true); packets() } else build(); warm() },
  exit(){ lastMod=null },
  pane(){},
  /* the slow beat redraws figures; a card whose engine is producing
     (State with a track playing) redraws its canvas every frame */
  tick(dt,now){
    acc+=now-(lastRef||now); lastRef=now;             // real time: the hub is a quarter-second behind at worst
    if(acc>=250){ acc=0; refresh() }
    for(const M of MODS){ const m=ARC.mods[M.id];
      if(!m||!m.cardDraw||!liveNow[M.id])continue;
      const cv=document.querySelector('.hc[data-id="'+M.id+'"] .hcm canvas');
      if(cv)ARC.safe(()=>m.cardDraw(cv,now),M.id+':card') }
  },
  gauges(){
    const secs=Object.values(ARC.sec).reduce((a,b)=>a+b,0)+(performance.now()-ARC.t0)/1000;
    const live=MODS.filter(M=>ARC.mods[M.id]&&ARC.mods[M.id]._up).length;
    return[
      {v:live+'/6', l:'engines warm', f:live/6},
      {v:String(BUS.items.length), l:'shared', f:clamp(BUS.items.length/12,0,1)},
      {v:suiteMin()+' min', l:'in the suite', f:clamp(secs/7200,0,1)}]}
});
ARC.home={noteLeft:id=>{ if(BYID[id])lastMod=id }};
});

/* ── diagnostics ────────────────────────────────────────
   Reachable by tapping the wordmark. Reports what is actually
   true about this environment rather than what should be.    */
function dRow(state,label,value){
  const mark={ok:'<i class="ok">✓</i>',bad:'<i class="bad">✕</i>',warn:'<i class="warn">!</i>',info:'<i>·</i>'}[state]||'<i>·</i>';
  return `<div class="dline">${mark}<span>${label}</span><b>${String(value).replace(/</g,'&lt;')}</b></div>`;
}
function diagBody(tests){ try{ return diagBodyInner(tests) }
  catch(e){ const b=document.getElementById('dBody');
    if(b)b.innerHTML=`<div class="card"><h3>Diagnostics itself failed</h3>`+
      `<div class="hint">${String(e&&e.message||e).replace(/</g,'&lt;')}</div>`+
      `<div class="read">That is a bug in this panel, not in the page it is reporting on.</div></div>`;
    fail('diagnostics',e) } }
function diagBodyInner(tests){
  const vw=innerWidth, vh=innerHeight, rig=$('#rig');
  let out='<h3>Environment</h3>';
  out+=dRow('info','viewport',`${vw}×${vh}`);
  out+=dRow(rig&&rig.offsetHeight>200?'ok':'bad','shell height',(rig?rig.offsetHeight:0)+'px');
  out+=dRow(SANDBOXED?'warn':'ok','origin',SANDBOXED?'sandboxed (null)':location.origin);
  // A LAN IP is NOT a secure context. The mic and Web Crypto are gated on it.
  out+=dRow(SECURE?'ok':'warn','secure context',
    SECURE?'yes — mic and sealed notes available'
                   :'no — Live in and Sealed are blocked until this is https or localhost');
  out+=dRow(SANDBOXED?'warn':'ok','outbound network',SANDBOXED?'expect blocked':'expect allowed');
  out+=dRow('info','page source',location.protocol);
  out+=dRow('info','user agent',navigator.userAgent.slice(0,44));
  out+='<h3 style="margin-top:12px">Modules</h3>';
  const SUB={state:'music organised into calm radio flows',mate:'play, practise, solve mate puzzles',
    skate:'design, test and refine autonomous racing logic',plate:'turn licence plates into word puzzles',
    slate:'your own video feeds, played in place',late:'local, county and AI news from sources you choose'};
  for(const id of ['state','mate','skate','plate','slate','late']){
    const m=ARC.mods[id], broke=FAULTS.some(f=>f.where===id);
    out+=dRow(broke?'bad':m?'ok':'bad',id+' — '+SUB[id],broke?'failed':m?'ok':'missing');
    const h=m&&m.health?ARC.safe(()=>m.health(),id):null;
    if(h)for(const [k,v,state] of h)out+=dRow(state||'info','· '+k,v);
  }
  out+='<h3 style="margin-top:12px">Services</h3>';
  out+=dRow(typeof window.storage==='object'?'ok':'warn','persistent storage',typeof window.storage==='object'?'available':'memory only, lost on reload');
  out+=dRow(window.AudioContext||window.webkitAudioContext?'ok':'bad','web audio','' + (window.AudioContext||window.webkitAudioContext?'available':'missing'));
  out+=dRow(navigator.mediaDevices?'ok':'warn','microphone api',
    navigator.mediaDevices?'available':(SECURE?'unavailable':'blocked — needs https or localhost'));
  out+=dRow(window.crypto&&crypto.subtle?'ok':'bad','web crypto',
    window.crypto&&crypto.subtle?'available':(SECURE?'missing':'blocked — needs https or localhost'));
  if(tests){ out+='<h3 style="margin-top:12px">Self-test</h3>'+tests }
  out+='<h3 style="margin-top:12px">Faults ('+FAULTS.length+')</h3>';
  out+= FAULTS.length ? FAULTS.map(f=>
        `<div class="dline"><i class="bad">✕</i><span>${f.t} · ${f.where}<br>${f.msg.replace(/</g,'&lt;')}</span></div>`).join('')
      : '<div class="hint">None recorded this session.</div>';
  $('#dBody').innerHTML=out;
}
function selfTest(){ try{ return selfTestInner() }
  catch(e){ const b=document.getElementById('dBody');
    if(b)b.innerHTML=`<div class="card"><h3>Self-test could not run</h3>`+
      `<div class="hint">${String(e&&e.message||e).replace(/</g,'&lt;')}</div></div>`;
    fail('selftest',e) } }
function selfTestInner(){
  const r=[]; const t=(name,fn)=>{ try{ const v=fn(); r.push(dRow(v===true?'ok':'bad',name,v===true?'pass':String(v))) }
    catch(e){ r.push(dRow('bad',name,String(e.message||e))) } };
  for(const id of ['state','mate','skate','plate','slate','late']){
    t('nav → '+id,()=>{
      const before=ARC.cur; go(id);
      const on=document.querySelector(`.mod[data-m="${id}"]`).classList.contains('on');
      const panes=$('#panes').children.length>0;
      go(before);
      return (on&&panes) || 'section '+(on?'ok':'hidden')+', panes '+(panes?'ok':'empty');
    });
  }
  t('canvas 2d context',()=>{const c=document.createElement('canvas');return !!c.getContext('2d')});
  t('object URL',()=>{const u=URL.createObjectURL(new Blob(['x']));URL.revokeObjectURL(u);return u.startsWith('blob:')});
  t('audio element',()=>{const a=new Audio();return typeof a.play==='function'});
  t('mp3 decode support',()=>{const a=new Audio();const s=a.canPlayType('audio/mpeg');return s?true:'browser reports no mpeg support'});
  t('indexeddb',()=>!!window.indexedDB||'unavailable in this browser');
  t('secure context',()=>SECURE||'not secure — mic and sealed notes are blocked');
  t('storage round-trip',()=>{ try{ window.storage.set('arc8:probe','1'); return true }catch(e){ return 'memory only' } });
  diagBody(r.join(''));
}
function openDiag(){ $('#diag').hidden=false; diagBody(); }
$('#dClose').onclick=()=>{$('#diag').hidden=true};
$('#dRun').onclick=selfTest;
$('#faultbar').onclick=openDiag;
$('#homeMark').onclick=()=>go('home');
$('#dgBtn').onclick=openDiag;

/* ── boot ───────────────────────────────────────────────── */
try{
  store.get().then(d=>{try{LOAD(d);paintHUD();
    if(d&&ARC.cur)ARC.safe(()=>ARC.mods[ARC.cur].enter?.(),'restore')}catch(e){fail('restore',e)}}).catch(e=>fail('storage',e));
  /* land on the suite. go() does the whole activation — classes, rail,
     mount, panes, HUD — so there is one code path, not two. */
  go(ARC.mods.home?'home':(ARC.mods.state?'state':ARC.order[0]));
}catch(e){ fail('boot',e); }
</script>

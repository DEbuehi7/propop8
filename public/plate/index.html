      '" stroke-width="'+(o.w||1)+'" stroke-opacity="'+(o.a==null?1:o.a)+'" stroke-linecap="round"'+(o.f?' filter="url(#'+o.f+')"':'')+(o.cls?' class="'+o.cls+'"':'')+'/>'};
  /* VectorOverlay: a straight influence vector, optionally headed */
  const vec=(ax,ay,bx,by,o)=>{o=o||{};
    let s='<line x1="'+f1(ax)+'" y1="'+f1(ay)+'" x2="'+f1(bx)+'" y2="'+f1(by)+'" stroke="'+(o.k||'#DCD8F2')+'" stroke-width="'+(o.w||1)+
      '" stroke-opacity="'+(o.a==null?1:o.a)+'" stroke-linecap="round"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+'/>';
    if(o.head){const a=Math.atan2(by-ay,bx-ax), h=o.head;
      s+='<path d="M'+f1(bx)+','+f1(by)+' L'+f1(bx-Math.cos(a-.45)*h)+','+f1(by-Math.sin(a-.45)*h)+' L'+f1(bx-Math.cos(a+.45)*h)+','+f1(by-Math.sin(a+.45)*h)+'Z" fill="'+(o.k||'#DCD8F2')+'" fill-opacity="'+(o.a==null?1:o.a)+'"/>'}
    return s};
  /* a curved vector: the knight's move, which never passes the squares between */
  const arc=(ax,ay,bx,by,bend,o)=>{o=o||{};
    const mx=(ax+bx)/2, my=(ay+by)/2, dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1;
    const cx=mx-dy/L*L*bend, cy=my+dx/L*L*bend;
    return '<path d="M'+f1(ax)+','+f1(ay)+' Q'+f1(cx)+','+f1(cy)+' '+f1(bx)+','+f1(by)+'" fill="none" stroke="'+(o.k||'#DCD8F2')+
      '" stroke-width="'+(o.w||1)+'" stroke-opacity="'+(o.a==null?1:o.a)+'" stroke-linecap="round"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+'/>'};
  /* MiniTimeline: a series as a path, x spread across w, y inside [y0,y1] */
  const spark=(vals,x0,y0,w,h,lo,hi)=>{
    if(!vals||vals.length<2)return '';
    const n=vals.length; lo=lo==null?Math.min(...vals):lo; hi=hi==null?Math.max(...vals):hi; const sp=(hi-lo)||1;
    return 'M'+vals.map((v,i)=>f1(x0+i/(n-1)*w)+','+f1(y0+h-(clamp(v,lo,hi)-lo)/sp*h)).join(' L')};
  /* EmptyStateVisual: a dashed schematic of what will be here, and one line of what to do */
  const empty=(w,h,text,sub)=>'<g font-family="IBM Plex Mono,monospace" text-anchor="middle">'+
    '<text x="'+f1(w/2)+'" y="'+f1(h/2+2)+'" font-size="11" fill="#B6B4CC">'+esc(text)+'</text>'+
    (sub?'<text x="'+f1(w/2)+'" y="'+f1(h/2+17)+'" font-size="9" fill="#6E6D86">'+esc(sub)+'</text>':'')+'</g>';
  /* a small mono annotation inside a stage */
  const note=(x,y,t,o)=>{o=o||{};return '<text x="'+f1(x)+'" y="'+f1(y)+'" font-size="'+(o.s||8.5)+'" fill="'+(o.k||'#8F8EA8')+'"'+
    (o.a?' text-anchor="'+o.a+'"':'')+(o.w?' font-weight="'+o.w+'"':'')+' letter-spacing="'+(o.ls==null?.04:o.ls)+'em"'+
    (o.halo?' paint-order="stroke" stroke="#08080D" stroke-width="3" stroke-linejoin="round"':'')+'>'+esc(t)+'</text>'};
  /* MetricDial: the HUD gauge — 24 ticks and a value arc (gaugeSVG, below) */
  const dial=f=>gaugeSVG(f);
  /* data-chip: a computed figure, its label, and a dot naming the instrument it came from */
  /* where a W×H viewBox lands inside a stage of sz (meet, centred): CSS px per unit, and the
     offsets. Anything HTML laid over a mini (the plate, a key) is placed through this, so a
     mini drawn wider than its stage and scaled down still has its overlays on the drawing. */
  const frame=(sz,W,H)=>{ const rw=(sz&&sz.w)||W, rh=(sz&&sz.h)||H, s=Math.min(rw/W,rh/H);
    return {s, ox:(rw-W*s)/2, oy:(rh-H*s)/2, rw, rh} };
  const chip=(v,l,k)=>'<span class="p8-chip"><i style="--k:'+esc(k||'#DCD8F2')+'"></i><b>'+esc(v)+'</b><span>'+esc(l)+'</span></span>';
  /* metric-hero: one figure large, with its direction only when there is history to take it from */
  const metric=(v,l,trend,k)=>'<div class="p8-metric"'+(k?' style="--k:'+esc(k)+'"':'')+'><b>'+esc(v)+'</b>'+
    (trend==null||!Number.isFinite(+trend)||+trend===0?'':'<em class="'+(+trend>0?'up':'dn')+'">'+(+trend>0?'▲':'▼')+' '+esc(Math.abs(+trend).toFixed(2))+'</em>')+
    '<span>'+esc(l)+'</span></div>';
  /* telemetry-row: a key and its measured value */
  const row=(k,v)=>'<div class="kv"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>';
  /* The ten primitives the plan names, and where each lives:
     module-card .hc · glass-panel .card/.p8-glass · data-chip P8.chip · metric-hero P8.metric ·
     canvas-frame .hcm · section-header .hch · accent-button .hcb/P8.cta · telemetry-row P8.row/.kv ·
     mini-chart P8.spark · empty-state P8.empty                                                     */
  return {esc,f1,icon,pulse,legend,rail,tabs,cta,bloom,node,edge,vec,arc,spark,empty,note,dial,chip,metric,row};
})();
const SANDBOXED=(()=>{try{return location.origin==='null'||window.origin==='null'}catch(e){return true}})();
const FAULTS=[];
/* Bare `isSecureContext` throws where the global is absent, and a throw inside
   diagnostics blanks the whole panel. Read it defensively, once. */
const SECURE=(()=>{ try{ if(typeof isSecureContext!=='undefined')return !!isSecureContext }catch(e){}
  try{ return location.protocol==='https:'||['localhost','127.0.0.1','::1'].includes(location.hostname) }
  catch(e){ return false } })();
function fail(where,e){
  const msg=String(e&&e.message||e);
  FAULTS.push({where,msg,stack:String(e&&e.stack||'').split('\n').slice(0,4).join('\n'),t:new Date().toLocaleTimeString()});
  const bar=document.getElementById('faultbar');
  if(bar){bar.hidden=false;bar.textContent=`${FAULTS.length} fault${FAULTS.length>1?'s':''} — ${where}: ${msg}. Tap for diagnostics.`}
}
addEventListener('error',e=>fail('window',e.error||e.message));
addEventListener('unhandledrejection',e=>fail('promise',e.reason));
/* every module runs behind this, so one bad module cannot take the page down */
function mod(id,fn){
  try{ fn() }catch(e){
    fail(id,e);
    if(!ARC.mods[id])ARC.register({
      id, label:id, panes:[['play','Error']],
      enter(){ const el=document.querySelector(`.mod[data-m="${id}"]`); if(el)el.innerHTML=
        `<div class="pane on" data-p="play"><div class="scroll pad"><div class="card">
          <h3>${id} did not start</h3>
          <div class="hint">${String(e&&e.message||e).replace(/</g,'&lt;')}</div>
          <div class="read">The rest of the rig is unaffected. Open Diagnostics — the pulse button in the header — for the stack.</div>
        </div></div></div>` },
      gauges:()=>[{v:'—',l:'module failed',f:0},{v:'—',l:'',f:0},{v:'—',l:'',f:0}]
    });
  }
}
const netErr=e=>/Failed to fetch|NetworkError|Load failed|TypeError/.test(String(e&&e.message||e));
const ARC={
  mods:{}, order:[], cur:null, pane:'graph', t0:performance.now(),
  sec:{home:0,state:0,mate:0,skate:0,plate:0,slate:0,late:0},
  register(m){this.mods[m.id]=m;this.order.push(m.id);m._up=false},
  safe(fn,who){ try{ return fn() }catch(e){ console.error('[arc8:'+who+']',e) } },
  /* mount a module without switching to it — the hub needs every engine
     warm to draw its card, and a module's first mount is otherwise lazy */
  ensure(id){ const m=this.mods[id]; if(!m||m._up)return; m._up=true; this.safe(()=>m.mount?.(),id) },
  log(from,text,meta){ return LOG.add(from,text,meta) }
};

/* ═══ ACTIVITY LOG ════════════════════════════════════════
   The concept board's "live activity" panel, made honest: an
   entry exists only because something happened — a lap, a
   banked word, a finished game. Capped, persisted, and never
   written to on a timer, so an idle rig has an idle log.
   ═══════════════════════════════════════════════════════ */
const LOG_CAP=48;
const LOG={
  items:[], subs:new Set(),
  add(from,text,meta){
    const e={t:Date.now(),from:String(from||'rig'),text:String(text||'').slice(0,140),meta:meta||null};
    /* the same line from the same page within a few seconds is one event */
    const top=this.items[0];
    if(top&&top.from===e.from&&top.text===e.text&&e.t-top.t<4000)return top;
    this.items.unshift(e); if(this.items.length>LOG_CAP)this.items.length=LOG_CAP;
    for(const f of this.subs)ARC.safe(()=>f(e),'log');
    persist(); return e;
  },
  on(fn){ this.subs.add(fn); return ()=>this.subs.delete(fn) },
  save(){ return this.items.slice(0,LOG_CAP) },
  load(a){ if(Array.isArray(a))this.items=a.filter(x=>x&&x.t&&x.text).slice(0,LOG_CAP)
    .map(x=>({t:+x.t,from:String(x.from||'rig'),text:String(x.text),meta:x.meta||null})) }
};

/* ── the toast: one element, one timer, never stacks ─────── */
let toastT=null;
function toast(msg,ms){
  const t=document.getElementById('toast'); if(!t)return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms||2400);
}

/* ═══ SHARE BUS ═══════════════════════════════════════════
   Sharing is caring. Any page can hand an item to the rig and
   any page can subscribe; Late is the board where they land.
   Items are plain and serialisable so the whole thing survives
   a save/load round trip, and the deck is capped so a long
   session can never grow without bound.
   Item: {id, t, from, kind, title, body, url, meta}
   kind: 'track'|'position'|'lap'|'plate'|'video'|'story'|'note'
   ═══════════════════════════════════════════════════════ */
const SHARE_CAP=64;
const uid=()=>{ try{ if(crypto.randomUUID)return crypto.randomUUID() }catch(e){}
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8) };
const BUS={
  items:[], subs:new Set(),
  post(o){
    const it={ id:uid(), t:Date.now(), from:o.from||ARC.cur||'rig', kind:o.kind||'note',
      title:String(o.title??'').slice(0,160), body:String(o.body??'').slice(0,800),
      url:String(o.url??''), meta:o.meta&&typeof o.meta==='object'?o.meta:{} };
    /* a repeat share of the same thing moves it to the top rather than doubling it */
    const dup=this.items.findIndex(x=>x.from===it.from&&x.kind===it.kind&&x.title===it.title&&x.url===it.url);
    if(dup>=0)this.items.splice(dup,1);
    this.items.unshift(it);
    if(this.items.length>SHARE_CAP)this.items.length=SHARE_CAP;
    LOG.add(it.from,'Shared · '+(it.title||it.kind));
    this.emit(); persist(); return it;
  },
  drop(id){ const i=this.items.findIndex(x=>x.id===id); if(i<0)return false;
    this.items.splice(i,1); this.emit(); persist(); return true },
  clear(){ if(!this.items.length)return; this.items.length=0; this.emit(); persist() },
  get(id){ return this.items.find(x=>x.id===id)||null },
  byKind(k){ return k?this.items.filter(x=>x.kind===k):this.items.slice() },
  byFrom(f){ return this.items.filter(x=>x.from===f) },
  unread(){ return this.items.filter(x=>!x.meta.seen).length },
  markSeen(){ let n=0; for(const x of this.items)if(!x.meta.seen){x.meta.seen=1;n++} if(n){persist()} return n },
  on(fn){ this.subs.add(fn); return ()=>this.subs.delete(fn) },
  emit(){ for(const f of this.subs)ARC.safe(()=>f(this.items),'bus') },
  save(){ return this.items.slice(0,SHARE_CAP) },
  load(a){ if(!Array.isArray(a))return;
    /* a restored item is only as well-formed as whatever wrote it, and one
       missing `meta` used to take unread() down with it */
    this.items=a.filter(x=>x&&x.id&&x.kind).slice(0,SHARE_CAP).map(x=>({
      t:Date.now(), from:'rig', title:'', body:'', url:'', ...x,
      meta:(x.meta&&typeof x.meta==='object')?x.meta:{} })) }
};
/* modules call this, not BUS.post — it also tells the user it landed */
function share(o){
  const it=BUS.post(o);
  const where=ARC.cur==='late'?'the board':'Late';
  toast('Shared to '+where+' · '+(it.title||it.kind));
  const nd=document.querySelector('.nd[data-go="late"]');
  if(nd&&ARC.cur!=='late'){ nd.classList.add('ping'); setTimeout(()=>nd.classList.remove('ping'),1400) }
  return it;
}

/* ── storage: artifact store when present, memory otherwise ── */
const KEY='arc8:profile', mem={};
const store={
  async get(){try{const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null}catch(e){return mem[KEY]||null}},
  async set(v){mem[KEY]=v;try{await window.storage.set(KEY,JSON.stringify(v))}catch(e){}},
};
const SAVE=()=>{const o={sec:ARC.sec,share:BUS.save(),log:LOG.save()};
  for(const id of ARC.order)o[id]=ARC.safe(()=>ARC.mods[id].save?.(),id); return o};
const LOAD=d=>{if(!d)return; Object.assign(ARC.sec,d.sec||{});
  ARC.safe(()=>BUS.load(d.share),'bus');
  ARC.safe(()=>LOG.load(d.log),'log');
  for(const id of ARC.order)if(d[id])ARC.safe(()=>ARC.mods[id].load?.(d[id]),id)};
let saveT; const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>store.set(SAVE()),800)};

/* ── the circular widget, simplified: 24 ticks + value arc ── */
function gaugeSVG(f){
  f=clamp(f||0,0,1);
  const T=24, ticks=[];
  for(let i=0;i<T;i++){
    const a=(i/T)*Math.PI*2-Math.PI/2, lit=i/T<f;
    const r1=lit?12.5:14, r2=19;
    ticks.push(`<line x1="${22+Math.cos(a)*r1}" y1="${22+Math.sin(a)*r1}"
      x2="${22+Math.cos(a)*r2}" y2="${22+Math.sin(a)*r2}"
      stroke="${lit?'var(--ac)':'var(--line)'}" stroke-width="${lit?2:1.2}"/>`);
  }
  const C=2*Math.PI*9;
  return `<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
    ${ticks.join('')}
    <circle cx="22" cy="22" r="9" fill="none" stroke="var(--line)" stroke-width="2.5"/>
    <circle cx="22" cy="22" r="9" fill="none" stroke="var(--ac2)" stroke-width="2.5"
      stroke-dasharray="${f*C} ${C}" stroke-linecap="round" transform="rotate(-90 22 22)"/>
    <circle cx="22" cy="22" r="1.6" fill="var(--ac2)"/>
  </svg>`;
}
const hudEl=$('#hud');
function paintHUD(){
  const m=ARC.mods[ARC.cur]; if(!m||!m.gauges)return;
  const g=ARC.safe(()=>m.gauges(),m.id)||[];
  if(hudEl.children.length!==3)hudEl.innerHTML='<div class="gauge"></div>'.repeat(3);
  g.slice(0,3).forEach((x,i)=>{
    hudEl.children[i].innerHTML=P8.dial(x.f)+
      `<div class="tx"><div class="v">${x.v}</div><div class="l">${x.l}</div></div>`;
  });
}

/* ── routing ────────────────────────────────────────────── */
function go(id){
  if(id===ARC.cur)return;
  const now=performance.now();
  if(ARC.cur){ARC.sec[ARC.cur]+=(now-ARC.t0)/1000;ARC.safe(()=>ARC.mods[ARC.cur].exit?.(),ARC.cur)}
  ARC.prev=ARC.cur; ARC.t0=now; ARC.cur=id;
  $('#rig').dataset.mod=id;
  $('#modName').textContent=ARC.mods[id].label;
  $$('.mod').forEach(s=>s.classList.toggle('on',s.dataset.m===id));
  $$('.nd').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.go===id)));
  const m=ARC.mods[id];
  if(!m._up){m._up=true;ARC.safe(()=>m.mount?.(),id)}
  renderPanes(m);
  ARC.safe(()=>m.enter?.(),id);
  setPane(m.panes[0][0],true);
  paintHUD();
}
function renderPanes(m){
  $('#panes').innerHTML=m.panes.map(([k,l])=>
    `<button data-pane="${k}" aria-pressed="false">${l}</button>`).join('');
  $$('#panes button').forEach(b=>b.addEventListener('click',()=>setPane(b.dataset.pane)));
}
function setPane(p,quiet){
  ARC.pane=p;
  $$('#panes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pane===p)));
  const sec=$(`.mod[data-m="${ARC.cur}"]`);
  $$('.pane',sec).forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  if(!quiet)ARC.safe(()=>ARC.mods[ARC.cur].pane?.(p),ARC.cur);
  else ARC.safe(()=>ARC.mods[ARC.cur].pane?.(p),ARC.cur);
}
$$('.nd').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
/* the rail carries each instrument's icon — the same drawing as its card */
$$('.nd').forEach(b=>{ const lab=b.querySelector('span'); b.innerHTML='<i class="ni">'+P8.icon(b.dataset.go,17)+'</i>'; if(lab)b.appendChild(lab);
  b.insertAdjacentHTML('beforeend','<i class="nb" aria-hidden="true"></i>') });

/* ── clock: one rAF for the whole rig ───────────────────── */
let last=performance.now(), hudAcc=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=clamp((now-last)/16.667,0,3); last=now;
  const m=ARC.mods[ARC.cur];
  if(m&&m.tick)ARC.safe(()=>m.tick(dt,now),m.id);
  /* a mounted engine can keep measuring while you are elsewhere — State
     keeps analysing a track that is still playing — but never draws */
  for(const id of ARC.order){ const o=ARC.mods[id]; if(o!==m&&o&&o._up&&o.bg)ARC.safe(()=>o.bg(dt,now),id) }
  hudAcc+=dt;
  if(hudAcc>8){hudAcc=0;paintHUD()}
}
requestAnimationFrame(loop);
setInterval(()=>{
  const now=performance.now();
  ARC.sec[ARC.cur]+=(now-ARC.t0)/1000; ARC.t0=now;
  $('#clk').textContent=fmt(Object.values(ARC.sec).reduce((a,b)=>a+b,0));
},1000);

/* ═══ THE DECK BAR ═══════════════════════════════════════
   Live status is asked of each instrument, never guessed; the
   small mark is your time split six ways; search runs over the
   real content of every instrument, and nothing it cannot see
   (Plate's unfound words stay unfound).                        */
const DECK=['state','mate','skate','plate','slate','late'];
function deckPaint(){
  const on=DECK.filter(id=>{ const m=ARC.mods[id]; return m&&m._up&&m.live&&ARC.safe(()=>m.live(),id) });
  const li=$('#liveInd'); if(li){ li.classList.toggle('on',on.length>0);
    li.style.setProperty('--k',on[0]?TONE[on[0]].c:'#fff');
    li.querySelector('span').textContent=on.length?'live · '+on.join(' · '):'idle' }
  for(const id of DECK){ const b=document.querySelector('#rail .nd[data-go="'+id+'"]'); if(!b)continue;
    if(on.includes(id))b.dataset.live='1'; else b.removeAttribute('data-live') }
  const ts=$('#tsEmb'); if(ts){ const tot=DECK.reduce((a,id)=>a+(ARC.sec[id]||0),0);
    ts.innerHTML=DECK.map((id,i)=>{ const a=-Math.PI/2+i*Math.PI/3, sh=tot>5?(ARC.sec[id]||0)/tot:1/6, r=1.2+Math.sqrt(sh)*3.6;
      return '<circle cx="'+(12+Math.cos(a)*7.5).toFixed(1)+'" cy="'+(12+Math.sin(a)*7.5).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+TONE[id].c+'"/>' }).join('')+
      '<circle cx="12" cy="12" r="1.5" fill="#F4F3FA"/>' }
}
setInterval(deckPaint,1000); deckPaint();

let srSel=0, srHits=[];
function searchAll(q){
  q=String(q||'').trim().toLowerCase(); if(!q)return [];
  const hit=t=>String(t==null?'':t).toLowerCase().includes(q), out=[];
  for(const id of DECK){ const m=ARC.mods[id]; if(!m||!m.search)continue;
    if(!m._up)ARC.ensure(id);
    const r=ARC.safe(()=>m.search(q,hit),id)||[];
    for(const x of r.slice(0,6))out.push({...x,from:id}) }
  for(const e of LOG.items){ if(out.length>=40)break;
    if(hit(e.text))out.push({from:e.from,title:e.text,sub:'activity · '+new Date(e.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}) }
  return out;
}
function srPaint(){
  const q=$('#srIn').value, box=$('#srRes');
  srHits=searchAll(q); srSel=Math.min(srSel,Math.max(0,srHits.length-1));
  const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  box.innerHTML=!q.trim()?'<div class="srn">Search every instrument at once: your tracks, library videos, news, dispatches, shows, plates and banked words, circuits and laps, and the activity log.</div>'
    : srHits.length? srHits.map((r,i)=>{ const k=TONE[r.from]?TONE[r.from].c:'#DCD8F2';
        return '<button class="srr" role="option" data-i="'+i+'" aria-selected="'+(i===srSel)+'" style="--k:'+k+'">'+
          '<span class="ic">'+(TONE[r.from]?P8.icon(r.from,16):'')+'</span><span><b>'+esc(r.title)+'</b><span>'+esc(r.sub||'')+'</span></span>'+
          '<em>'+esc(r.from)+'</em></button>' }).join('')
    : '<div class="srn">Nothing in the suite matches “'+esc(q.trim())+'”.</div>';
  const sel=box.querySelector('[aria-selected="true"]'); if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function srOpen(){ const s=$('#srch'); s.hidden=false; const i=$('#srIn'); i.value=''; srSel=0; srPaint(); i.focus() }
function srClose(){ $('#srch').hidden=true }
function srGo(r){ if(!r)return; srClose();
  if(ARC.mods[r.from]){ go(r.from); if(r.pane&&ARC.cur===r.from)setPane(r.pane) }
  if(r.act)ARC.safe(()=>r.act(),r.from+':search') }
$('#srchBtn').onclick=srOpen;
$('#srIn').addEventListener('input',()=>{ srSel=0; srPaint() });

/* ── canvas helper: DPR-correct sizing on demand ────────── */
function fitCanvas(c){
  const w=c.clientWidth,h=c.clientHeight;
  if(!w||!h)return null;
  const d=Math.min(devicePixelRatio||1,2);
  if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0);
  return {x,w,h};
}
addEventListener('resize',()=>{
  /* On a phone the soft keyboard fires a resize the moment a field is tapped.
     Rebuilding the page then replaces the field itself, so the keyboard closes
     and nothing can be typed. While a field has focus, leave the DOM alone. */
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  ARC.safe(()=>ARC.mods[ARC.cur]?.enter?.(),'resize');
});

/* ═══════════════ STATE — pink · node graph ══════════════
   Image-2 language: a relaxed node graph where band nodes
   size by energy, edges light by co-activation, and satellite
   nodes bloom off whichever band owns a detected onset.     */
mod('state',()=>{
const NB=14;                                   // band nodes
const HUE=TONE.state.h||188;   // the instrument's HSL hue (its --t-state-h token)
const SHADE=[[88,46],[70,60],[96,74]];         // three shades of the page colour
/* one element, a real state machine, and analysis that is optional */
const ST={empty:'no audio loaded',selected:'selected',loading:'loading…',ready:'ready',
          playing:'playing',paused:'paused',failed:'failed'};
let audio=null, ac,an,srcNode,freq,wav, tracks=[], cur=-1, playing=false;
/* ── persistent audio library ───────────────────────────
   Blobs go in IndexedDB; object URLs are minted fresh each
   session because a URL dies with the page. Every path here
   reports what actually happened, not what was attempted.  */
const AUDIO_DB='plate-audio-v1', STORE='tracks';
let idbState='not checked', idbCount=0, idbBytes=0;
function openAudioDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('IndexedDB unavailable in this browser'));
    const r=indexedDB.open(AUDIO_DB,1);
    r.onupgradeneeded=()=>{const db=r.result;
      if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error||new Error('IndexedDB open failed'));
    r.onblocked=()=>rej(new Error('another tab is holding the database open'));
  });
}
function idbTx(mode,fn){
  return openAudioDB().then(db=>new Promise((res,rej)=>{
    let req; const tx=db.transaction(STORE,mode);
    try{ req=fn(tx.objectStore(STORE)) }catch(e){ return rej(e) }
    tx.oncomplete=()=>res(req?req.result:undefined);
    tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('transaction aborted'));
  }));
}
/* Bytes, not a Blob. WebKit has a long history of trouble storing Blob
   objects in IndexedDB; an ArrayBuffer round-trips everywhere. */
async function saveAudioFile(f,g){
  const buf=await f.arrayBuffer();
  return idbTx('readwrite',st=>st.add({name:f.name,type:f.type,size:f.size,g,buf,created:Date.now()}));
}
function rowBlob(row){
  if(row.buf)return new Blob([row.buf],{type:row.type||'audio/mpeg'});
  if(row.blob&&typeof row.blob.size==='number'&&row.blob.size)return row.blob;   // rows from the earlier build
  return null;
}
const deleteAudio=id=>id==null?Promise.resolve():idbTx('readwrite',st=>st.delete(id));
const clearAudio=()=>idbTx('readwrite',st=>st.clear());
const quotaMsg=e=>/quota/i.test(e.name+e.message)?'the browser storage quota is full':e.message;

async function restoreAudioFiles(){
  let rows;
  try{ rows=await idbTx('readonly',st=>st.getAll()) }
  catch(e){ idbState='unavailable — '+e.message;
    say('Saved tracks could not be read: '+e.message+'. Anything you add now plays but will not survive a reload.');
    return; }
  idbState='ok'; idbCount=0; idbBytes=0;
  let unreadable=0;
  for(const row of rows||[]){
    const f=rowBlob(row);
    if(!f||!f.size){unreadable++;continue}
    tracks.push({id:row.id,name:(row.name||'track').replace(/\.[^.]+$/,''),url:URL.createObjectURL(f),
      g:row.g||guess(row.name||''),size:f.size,type:row.type||'(none reported)',persisted:true});
    idbCount++; idbBytes+=f.size;
  }
  if(cur<0&&tracks.length)load(0);
  renderLib();
  // count what came back, never what was on disk
  if(idbCount||unreadable)say(
    (idbCount?`Restored ${idbCount} saved track${idbCount===1?'':'s'}.`:'Nothing could be restored.')+
    (unreadable?` ${unreadable} saved row${unreadable===1?'':'s'} could not be read and ${unreadable===1?'was':'were'} skipped — the browser may have evicted ${unreadable===1?'it':'them'}.`:''));
}
async function forgetTrack(i){
  const t=tracks[i]; if(!t)return;
  try{ await deleteAudio(t.id) }catch(e){ say('Could not remove it from storage: '+e.message); return }
  try{ URL.revokeObjectURL(t.url) }catch(e){}
  if(t.persisted){idbCount=Math.max(0,idbCount-1); idbBytes=Math.max(0,idbBytes-(t.size||0))}
  tracks.splice(i,1);
  if(cur===i){ if(audio)audio.pause(); playing=false; cur=-1; setSt('empty');
    $('#npT').textContent='No audio loaded'; }
  else if(cur>i)cur--;
  renderLib(); say('Removed.');
}
async function wipeLibrary(){
  try{ await clearAudio() }catch(e){ say('Could not clear storage: '+e.message); return }
  for(const t of tracks){try{URL.revokeObjectURL(t.url)}catch(e){}}
  tracks=[]; cur=-1; idbCount=0; idbBytes=0;
  if(audio)audio.pause(); playing=false; setSt('empty');
  $('#npT').textContent='No audio loaded';
  renderLib(); say('Library cleared.');
}

let st='empty', graph='off', lastErr='', diag={};
const MEDIA_ERR={1:'playback aborted',2:'network error',3:'decode failed — not a readable mp3',4:'source not supported by this browser'};
function mkAudio(){
  const a=new Audio();
  a.preload='metadata'; a.playsInline=true; a.setAttribute('playsinline','');
  ['loadstart','loadedmetadata','canplay','playing','waiting','stalled','pause','ended','error']
    .forEach(ev=>a.addEventListener(ev,()=>onMedia(ev,a)));
  a.addEventListener('timeupdate',onTime);
  return a;
}
function onMedia(ev,a){
  diag.readyState=a.readyState; diag.networkState=a.networkState; diag.lastEvent=ev;
  if(ev==='loadstart')setSt('loading');
  if(ev==='loadedmetadata')diag.duration=isFinite(a.duration)?a.duration.toFixed(2)+'s':'unknown';
  if(ev==='canplay'&&st==='loading')setSt('ready');
  if(ev==='playing'){playing=true;setSt('playing')}
  if(ev==='pause'&&!a.ended){playing=false;setSt('paused')}
  if(ev==='waiting'||ev==='stalled')say('Buffering…');
  if(ev==='ended')$('#wNext').onclick();
  if(ev==='error'){
    const c=a.error&&a.error.code; lastErr=(MEDIA_ERR[c]||'unknown media error')+' (code '+c+')';
    diag.mediaError=lastErr; playing=false; setSt('failed'); say(lastErr);
  }
}
function onTime(){
  const a=audio; if(!a||!a.duration||!isFinite(a.duration))return;
  $('#wSeek').value=a.currentTime/a.duration*1000;
  $('#wTime').textContent=fmt(a.currentTime)+' / '+fmt(a.duration);
}
function setSt(v){
  st=v; const b=$('#wPlay');
  if(b)b.textContent = v==='playing' ? '❚❚' : v==='loading' ? '···' : '▶';
  const g=$('#npG');
  if(g&&cur>=0)g.textContent=tracks[cur].g+' · '+ST[v]+(graph==='on'?' · analysing':'');
  if(ARC.cur==='state'&&ARC.pane==='viz')vizPane();
}
let nodes=[],sat=[],coact=new Float32Array(NB*NB),bandE=new Float32Array(NB);
let onsets=0,lastOn=0,eAvg=0,centroid=0,rms=0,segs=[];
const GEN=['Ethiopian','Rap','Freestyle','Jazz','EDM','Psychedelic','Reggae','Afrobeat'];
const guess=n=>{n=n.toLowerCase();
  for(const g of GEN)if(n.includes(g.toLowerCase()))return g;
  if(/afro|amapiano|naija/.test(n))return'Afrobeat'; if(/house|techno|edm|trance/.test(n))return'EDM';
  if(/dub|roots|ska/.test(n))return'Reggae'; if(/trap|drill|bars|flow/.test(n))return'Rap';
  if(/psych|dream|astral/.test(n))return'Psychedelic'; if(/sax|swing|blue/.test(n))return'Jazz';
  if(/ethio|tezeta|krar|addis/.test(n))return'Ethiopian'; return'Freestyle'};

for(let i=0;i<NB;i++){
  const a=i*2.399963, r=.18+.30*Math.sqrt(i/NB);
  nodes.push({x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r*.82,vx:0,vy:0,e:0,se:0,
    sh:(Math.random()*3)|0, grad:1+i/(NB-1)});
}
const spine=[];
for(let i=0;i<NB;i++){spine.push([i,(i+1)%NB]); if(i%3===0)spine.push([i,(i+5)%NB])}

/* Routing the element through Web Audio is exactly what silences playback on
   iOS when the context will not resume. So it is attached after, and reversible. */
function initAudio(){
  if(ac)return true;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    an=ac.createAnalyser(); an.fftSize=2048; an.smoothingTimeConstant=.72;
    freq=new Uint8Array(an.frequencyBinCount); wav=new Uint8Array(an.frequencyBinCount);
    return true;
  }catch(e){ ac=null; an=null; diag.audioCtx='failed: '+e.message; return false }
}
async function attachGraph(){
  if(graph==='on'||!audio||!initAudio())return;
  try{
    if(!srcNode){ srcNode=ac.createMediaElementSource(audio); srcNode.connect(an); an.connect(ac.destination) }
    await ac.resume();
    if(ac.state!=='running'){ graph='failed'; diag.audioCtx=ac.state;
      say('The analyser would not start. Audio is unaffected — press Plain to reload the track without it.'); return }
    graph='on'; diag.audioCtx='running'; setSt(st);
  }catch(e){ graph='failed'; diag.audioCtx='failed: '+e.message }
}
/* a fresh element has never been routed through a graph, so it always plays */
function plainReload(){
  const t=cur, pos=audio?audio.currentTime:0;
  try{srcNode&&srcNode.disconnect()}catch(e){}
  srcNode=null; graph='off'; diag.audioCtx='detached';
  if(audio)audio.pause();
  audio=mkAudio();
  if(t>=0){ audio.src=tracks[t].url; audio.play().then(()=>{audio.currentTime=pos}).catch(()=>{}) }
  say('Reloaded without the analyser. Sound works, the graph stays still.');
}
function analyse(now){
  if(!an||(graph!=='on'&&!micOn))return false;
  an.getByteFrequencyData(freq); an.getByteTimeDomainData(wav);
  const N=freq.length;
  let tot=0,wsum=0;
  for(let b=0;b<NB;b++){
    const lo=Math.floor(Math.pow(N,b/NB)), hi=Math.max(lo+1,Math.floor(Math.pow(N,(b+1)/NB)));
    let s=0; for(let i=lo;i<hi;i++)s+=freq[i];
    const v=s/(hi-lo)/255;
    bandE[b]=bandE[b]*.72+v*.28;
    tot+=bandE[b]; wsum+=bandE[b]*b;
  }
  rms=clamp(tot/NB*2.4,0,1);
  centroid=tot>.01?wsum/tot/NB:0;
  for(let i=0;i<NB;i++)for(let j=i+1;j<NB;j++){
    const c=Math.min(bandE[i],bandE[j]);
    coact[i*NB+j]=coact[i*NB+j]*.985+c*.015;
  }
  const low=(bandE[0]+bandE[1]+bandE[2])/3;
  eAvg=eAvg*.93+low*.07;
  if(low>eAvg*1.30&&low>.16&&now-lastOn>230){
    lastOn=now; onsets++;
    let top=0; for(let b=0;b<NB;b++)if(bandE[b]>bandE[top])top=b;
    HXon=top;
    for(let k=0;k<3;k++)sat.push({p:top,a:Math.random()*7,d:.03+Math.random()*.07,life:1,r:1.5+Math.random()*3});
    if(sat.length>44)sat.splice(0,sat.length-44);
    segs.push({t:(!micOn&&audio&&audio.currentTime)||now/1000,b:top});
    if(segs.length>240)segs.shift();
  }
  let pk=0, sq=0; for(let i=0;i<wav.length;i+=2){ const d=wav[i]-128, a=d<0?-d:d; if(a>pk)pk=a; sq+=d*d }
  const trms=Math.sqrt(sq/(wav.length/2))/128;          // the signal's own RMS, 0..1 — it moves with the beat
  HXc[HXi]=tot>.01?centroid:-1; HXo[HXi]=HXon; HXp[HXi]=pk/128; HXr[HXi]=trms; HXon=-1; HXi=(HXi+1)%HXN; if(HXn<HXN)HXn++;
  return true;
}
/* ═══ THE CARD ════════════════════════════════════════════
   Four seconds of history, kept by the analyser itself so the
   card can say where the brightness went and when the onsets
   landed. Nothing here is computed for the card: it is the
   same centroid and the same onset detector, remembered.      */
const HXN=240, HXc=new Float32Array(HXN).fill(-1), HXo=new Int8Array(HXN).fill(-1), HXp=new Float32Array(HXN), HXr=new Float32Array(HXN);
let HXi=0, HXn=0, HXon=-1, BF=null;
function bandHz(){                       // centre frequency of each log band, once the analyser exists
  if(BF||!an||!ac)return BF;
  const N=an.frequencyBinCount, hz=ac.sampleRate/an.fftSize; BF=new Float32Array(NB);
  for(let b=0;b<NB;b++){ const lo=Math.floor(Math.pow(N,b/NB)), hi=Math.max(lo+1,Math.floor(Math.pow(N,(b+1)/NB))); BF[b]=(lo+hi)/2*hz }
  return BF;
}
const idxHz=fi=>{ const f=bandHz(); if(!f)return 0; const i=clamp(Math.floor(fi),0,NB-1), j=Math.min(NB-1,i+1), u=clamp(fi-i,0,1);
  return Math.exp(Math.log(f[i])*(1-u)+Math.log(f[j])*u) };
const hzIdx=hz=>{ const f=bandHz(); if(!f)return -1; if(hz<=f[0])return 0;
  for(let b=0;b<NB-1;b++)if(hz<=f[b+1])return b+(Math.log(hz)-Math.log(f[b]))/(Math.log(f[b+1])-Math.log(f[b]));
  return NB-1 };
const fmtHz=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+' kHz':Math.round(v)+' Hz';
function cardPaint(cv){
  const g=fitCanvas(cv); if(!g)return; const {x,w,h}=g;
  x.clearRect(0,0,w,h);
  const live=!!an&&(micOn||(playing&&graph==='on'));
  const K=h/196, L=16, R=w-16, bw=(R-L)/NB, bx=b=>L+(b+.5)*bw;
  const yW=40*K, hh=21*K, yNet=104*K, yB=150*K;
  const C=TONE.state.c, C2=TONE.state.c2;
  const mono=s=>'500 '+s.toFixed(1)+'px "IBM Plex Mono",ui-monospace,monospace';
  const lab=(t,xx,yy,al,col)=>{ x.textAlign=al||'left'; x.lineWidth=3; x.strokeStyle='rgba(4,5,10,.85)'; x.strokeText(t,xx,yy);
    x.fillStyle=col||'rgba(178,180,206,.66)'; x.fillText(t,xx,yy) };
  x.lineJoin='round'; x.lineCap='round';
  if(!HXn&&!live){
    /* nothing measured yet: the instrument as a dashed schematic, equal and empty */
    x.setLineDash([2,3]); x.strokeStyle='rgba(220,216,242,.15)'; x.lineWidth=1;
    x.beginPath(); x.moveTo(L,yW); x.lineTo(R,yW); x.stroke();
    x.beginPath(); x.moveTo(L,yB); x.lineTo(R,yB); x.stroke();
    for(let b=0;b<NB;b++){ x.beginPath(); x.arc(bx(b),yNet,2.2,0,TAU); x.stroke() }
    x.setLineDash([]);
    x.fillStyle='rgba(4,5,10,.72)'; x.fillRect(L,h*.40,R-L,34);
    x.font=mono(11); lab('Add an mp3, or use Live in',w/2,h*.40+15,'center','#D2D0E6');
    x.font=mono(8.6); lab('waveform · spectrum · onsets · co-activation',w/2,h*.40+28,'center','rgba(150,150,178,.8)');
    return;
  }
  x.font=mono(Math.max(7.4,8.2*K));
  const age=k=>(HXi-1-k+HXN)%HXN, tx=k=>R-(k/(HXN-1))*(R-L);
  /* 1 · the waveform across the top: four seconds of peak (outer) and loudness (core), now at the right */
  x.beginPath();
  for(let k=0;k<HXn;k+=1){ const i=age(k), p=Math.min(1,HXp[i])*hh; if(p<.3)continue; const xx=tx(k); x.moveTo(xx,yW-p); x.lineTo(xx,yW+p) }
  x.strokeStyle=rgba(C,.26); x.lineWidth=Math.max(1,(R-L)/HXN*.9); x.stroke();
  x.beginPath();
  for(let k=0;k<HXn;k+=1){ const i=age(k), r=Math.min(1,HXr[i]*2.1)*hh; if(r<.3)continue; const xx=tx(k); x.moveTo(xx,yW-r); x.lineTo(xx,yW+r) }
  x.strokeStyle=rgba(C2,.9); x.stroke();
  x.fillStyle='rgba(220,216,242,.12)'; x.fillRect(L,yW,R-L,.8);
  /* onsets ride the same time axis: a bright tick where each one landed */
  for(let k=0;k<HXn;k++){ const b=HXo[age(k)]; if(b<0)continue; const xx=tx(k);
    x.fillStyle=rgba('#FFFFFF',.95-k/HXN*.5); x.fillRect(xx-.8,yW-hh-2*K,1.6,2*hh+6*K);
    x.beginPath(); x.arc(xx,yW-hh-3.5*K,1.8,0,TAU); x.fill() }   // capped under the label line, not in it
  /* 2 · the co-activation network, behind the spectrum: a node per band, the eight strongest pairs arched */
  const pairs=[]; for(let i=0;i<NB;i++)for(let j=i+1;j<NB;j++)pairs.push([coact[i*NB+j],i,j]);
  pairs.sort((a,b)=>b[0]-a[0]);
  const cmax=pairs.length?pairs[0][0]:0;
  if(cmax>1e-4)for(let k=Math.min(7,pairs.length-1);k>=0;k--){
    const [c,i,j]=pairs[k], a=bx(i), b=bx(j), u=c/cmax, hgt=Math.min(yNet-yW-hh-6*K,(8+(j-i)*3.4)*K);
    x.beginPath(); x.moveTo(a,yNet); x.bezierCurveTo(a,yNet-hgt*1.33,b,yNet-hgt*1.33,b,yNet);
    x.strokeStyle=rgba(C2,.16+.42*u); x.lineWidth=.7+1.5*u; x.stroke() }
  /* onsets ripple out from the band that owned them */
  for(let k=0;k<Math.min(HXn,48);k++){ const b=HXo[age(k)]; if(b<0)continue;
    x.beginPath(); x.arc(bx(b),yNet,3+k*.55*K,0,TAU); x.strokeStyle=rgba(C2,.85*(1-k/48)); x.lineWidth=1.2; x.stroke() }
  for(let b=0;b<NB;b++){ const e=clamp(bandE[b]*1.35,0,1), r=1.6+e*3.4;
    x.beginPath(); x.arc(bx(b),yNet,r,0,TAU); x.fillStyle=e>.02?rgba(C,.35+.5*e):'rgba(94,93,116,.7)'; x.fill() }
  /* 3 · the spectral landscape in front: fourteen bands as one lit terrain */
  const lit=rms>.004, top=b=>yB-clamp(bandE[b]*1.35,0,1)*(yB-yNet+18*K);
  const pts=[]; for(let b=0;b<NB;b++)pts.push([bx(b),top(b)]);
  const land=()=>{ x.moveTo(L,yB); x.lineTo(L,pts[0][1]);
    for(let b=0;b<NB-1;b++){ const [x0,y0]=pts[b],[x1,y1]=pts[b+1]; x.quadraticCurveTo(x0,y0,(x0+x1)/2,(y0+y1)/2) }
    x.lineTo(pts[NB-1][0],pts[NB-1][1]); x.lineTo(R,pts[NB-1][1]) };
  x.beginPath(); land(); x.lineTo(R,yB); x.closePath();
  const gr=x.createLinearGradient(0,yNet-18*K,0,yB); gr.addColorStop(0,rgba(C,.62)); gr.addColorStop(.45,rgba(C,.26)); gr.addColorStop(1,rgba(C,.03));
  x.fillStyle=gr; x.fill();
  x.beginPath(); land(); x.save(); x.shadowColor=rgba(C,.9); x.shadowBlur=lit?6:0; x.strokeStyle=rgba(C2,lit?.95:.4); x.lineWidth=1.4; x.stroke(); x.restore();
  /* the centroid: where the spectrum's weight sits, marked on the landscape */
  const cNow=centroid*NB;
  if(lit){ const cx=L+(cNow+.5)*bw, b0=clamp(Math.floor(cNow),0,NB-1), b1=Math.min(NB-1,b0+1), u=clamp(cNow-b0,0,1), cy=top(b0)*(1-u)+top(b1)*u;
    x.setLineDash([2,2]); x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=1; x.beginPath(); x.moveTo(cx,yB); x.lineTo(cx,cy); x.stroke(); x.setLineDash([]);
    x.fillStyle='#FFFFFF'; x.beginPath(); x.arc(cx,cy,2.6,0,TAU); x.fill() }
  /* the frequency axis they share */
  x.fillStyle='rgba(220,216,242,.16)'; x.fillRect(L,yB,R-L,1);
  for(const f of [100,1000,10000]){ const fi=hzIdx(f); if(fi<0)continue; const xx=L+(fi+.5)*bw;
    x.fillStyle='rgba(220,216,242,.24)'; x.fillRect(xx,yB,1,4); lab(f>=1000?(f/1000)+'k':String(f),xx,yB+12*K,'center') }
  lab('Hz',R,yB+12*K,'right');
  /* annotation, in the instrument's voice */
  lab('WAVEFORM · PEAK · RMS · 4S',L,11*K);
  lab(lit?'CENTROID '+fmtHz(idxHz(cNow)):'CENTROID —',R,11*K,'right',lit?C2:undefined);
  lab('ONSETS · '+onsets,L,h-6*K);
  lab(NB+' LOG BANDS · CO-ACTIVATION',R,h-6*K,'right');
}
const C=$('#waveC');
/* ═══ THE FIELD ═══════════════════════════════════════════
   One light, upper left, for the whole rig — the same light
   that bevels the plate. Everything here obeys it: bodies get
   a lit rim and a shadow side, shadows are tinted rather than
   black, and glow is an additive pass, never opacity stacking.
   Order is fixed — ground, field, edges, motes, bodies, type —
   so depth reads without any per-frame sorting.
   ═══════════════════════════════════════════════════════ */
const TAU=Math.PI*2, EDGE=[];
/* the ring walks 18 degrees of pink and no further: wider, and it
   drifts into violet one way and red the other. */
const nodeHue=i=>(HUE-6)+18*(i/(NB-1));
let bgG=null,vigG=null,bgKey='';
function ground(x,w,h,lift){
  const key=w+'x'+h;
  if(bgKey!==key){
    bgKey=key;
    bgG=x.createLinearGradient(0,0,w*.42,h);
    bgG.addColorStop(0,'#16121C'); bgG.addColorStop(.46,'#110F18'); bgG.addColorStop(1,'#0A0A10');
    vigG=x.createRadialGradient(w*.46,h*.38,Math.min(w,h)*.08,w*.5,h*.52,Math.max(w,h)*.78);
    vigG.addColorStop(0,'rgba(255,255,255,.030)');
    vigG.addColorStop(.52,'rgba(0,0,0,0)');
    vigG.addColorStop(1,'rgba(0,0,0,.46)');
  }
  x.fillStyle=bgG; x.fillRect(0,0,w,h);
  /* the room breathes with the mix: a low warm bloom under everything */
  if(lift>.01){
    const b=x.createRadialGradient(w*.5,h*.56,0,w*.5,h*.56,Math.max(w,h)*.62);
    b.addColorStop(0,'hsla('+HUE+' 80% 50% / '+(lift*.10).toFixed(3)+')');
    b.addColorStop(.6,'hsla('+HUE+' 80% 45% / '+(lift*.025).toFixed(3)+')');
    b.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=b; x.fillRect(0,0,w,h);
  }
  x.fillStyle=vigG; x.fillRect(0,0,w,h);
}
function draw(now){
  const g=fitCanvas(C); if(!g)return; const {x,w,h}=g;
  const live=graph==='on'||micOn;

  /* ── relax the layout (unchanged physics) ── */
  for(let i=0;i<NB;i++){
    const a=nodes[i]; a.se=lerp(a.se,bandE[i],.2);
    a.vx+=(.5-a.x)*.0016; a.vy+=(.5-a.y)*.0016;
    for(let j=0;j<NB;j++){
      if(i===j)continue; const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy)||.001;
      const f=.000055/(d*d);
      a.vx+=dx/d*f; a.vy+=dy/d*f;
    }
    a.vx*=.90; a.vy*=.90; a.x=clamp(a.x+a.vx,.08,.92); a.y=clamp(a.y+a.vy,.10,.90);
  }
  for(const[i,j]of spine){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,f=(d-.21)*.0055;
    a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;
  }
  const P=n=>[n.x*w,n.y*h], S=Math.min(w,h);

  ground(x,w,h,rms);

  /* ── 1. the energy field: soft washes, added not stacked ── */
  x.globalCompositeOperation='lighter';
  for(let i=0;i<NB;i++){
    const n=nodes[i], e=n.se; if(e<.015)continue;
    const [px,py]=P(n), R=S*(.055+e*.155), hu=nodeHue(i)|0;
    const fg=x.createRadialGradient(px,py,0,px,py,R);
    fg.addColorStop(0,   'hsla('+hu+' 88% 64% / '+(e*.20).toFixed(3)+')');
    fg.addColorStop(.42, 'hsla('+hu+' 84% 56% / '+(e*.06).toFixed(3)+')');
    fg.addColorStop(1,   'rgba(0,0,0,0)');
    x.fillStyle=fg; x.beginPath(); x.arc(px,py,R,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';

  /* ── 2. co-activation: each edge is a gradient between its ends ── */
  /* Ninety-one pairs, each a dashed gradient stroke, was two thirds of the
     frame budget on its own. Only the strongest couplings say anything, so
     rank them and draw the top band as solid gradient hairlines — cheaper
     to render and a clearer read than a full mesh. */
  x.lineCap='round';
  EDGE.length=0;
  for(let i=0;i<NB;i++)for(let j=i+1;j<NB;j++){
    const c=coact[i*NB+j]; if(c<.10)continue;
    EDGE.push(i*NB+j);
  }
  EDGE.sort((p,q)=>coact[q]-coact[p]);
  const lim=Math.min(EDGE.length,26);
  for(let k=0;k<lim;k++){
    const key=EDGE[k], i=(key/NB)|0, j=key%NB, c=coact[key];
    const [ax,ay]=P(nodes[i]),[bx,by]=P(nodes[j]);
    const a=clamp(c*.70,0,.26)*(1-k/lim*.45);
    const eg=x.createLinearGradient(ax,ay,bx,by);
    eg.addColorStop(0,  'hsla('+(nodeHue(i)|0)+' 72% 74% / '+(a*.55).toFixed(3)+')');
    eg.addColorStop(.5, 'hsla('+HUE+' 38% 88% / '+a.toFixed(3)+')');
    eg.addColorStop(1,  'hsla('+(nodeHue(j)|0)+' 72% 74% / '+(a*.55).toFixed(3)+')');
    x.strokeStyle=eg; x.lineWidth=.5+c*1.5;
    const mx=(ax+bx)/2+(ay-by)*.13, my=(ay+by)/2+(bx-ax)*.13;
    x.beginPath(); x.moveTo(ax,ay); x.quadraticCurveTo(mx,my,bx,by); x.stroke();
  }
  /* the spine is structure: cool, quiet, faintly lit from the same side */
  x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=3; x.shadowOffsetY=1.2;
  x.lineWidth=1; x.strokeStyle='rgba(206,205,226,.085)';
  x.beginPath();
  for(const[i,j]of spine){
    const [ax,ay]=P(nodes[i]),[bx,by]=P(nodes[j]);
    x.moveTo(ax,ay); x.lineTo(bx,by);
  }
  x.stroke();
  x.shadowBlur=0; x.shadowOffsetY=0;

  /* ── 3. onset motes: a lit head dragging a fading tail ── */
  x.globalCompositeOperation='lighter';
  for(let k=sat.length-1;k>=0;k--){
    const s=sat[k]; s.life-=.006; s.d+=.00035;
    if(s.life<=0){sat.splice(k,1);continue}
    const n=nodes[s.p], px=(n.x+Math.cos(s.a)*s.d)*w, py=(n.y+Math.sin(s.a)*s.d*.9)*h;
    const [nx,ny]=P(n), hu=nodeHue(s.p)|0;
    const tg=x.createLinearGradient(nx,ny,px,py);
    tg.addColorStop(0,'hsla('+hu+' 80% 70% / 0)');
    tg.addColorStop(1,'hsla('+hu+' 92% 78% / '+(s.life*.40).toFixed(3)+')');
    x.strokeStyle=tg; x.lineWidth=.6+s.life*1.1;
    x.beginPath(); x.moveTo(nx,ny); x.lineTo(px,py); x.stroke();
    const R=s.r*(.55+s.life*.5);
    x.fillStyle='hsla('+hu+' 92% 72% / '+(s.life*.30).toFixed(3)+')';
    x.beginPath(); x.arc(px,py,R*2.4,0,TAU); x.fill();
    x.fillStyle='rgba(255,246,252,'+(s.life*.85).toFixed(3)+')';
    x.beginPath(); x.arc(px,py,R,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';

  /* ── 4. the bodies: lit spheres, tinted shadow, bounce rim ── */
  for(let i=0;i<NB;i++){
    const n=nodes[i], [px,py]=P(n), e=n.se, hu=nodeHue(i)|0, sh=SHADE[n.sh];
    const R=Math.min(S*.075,(3.4+e*S*.030)*n.grad);
    const L=-R*.36, U=-R*.40;                       // the one light, upper left

    x.save();
    x.shadowColor='hsla('+hu+' 92% 46% / '+(.24+e*.30).toFixed(3)+')';
    x.shadowBlur=7+e*16; x.shadowOffsetY=1.4+e*1.8;
    const bg=x.createRadialGradient(px+L,py+U,R*.10,px,py,R*1.04);
    if(e<.06){
      bg.addColorStop(0,'#4B4A5C'); bg.addColorStop(.5,'#37364A'); bg.addColorStop(1,'#232235');
    }else{
      bg.addColorStop(0,   'hsl('+hu+' 100% '+(74+e*16).toFixed(0)+'%)');
      bg.addColorStop(.42, 'hsl('+hu+' '+sh[0]+'% '+(sh[1]+e*14).toFixed(0)+'%)');
      bg.addColorStop(1,   'hsl('+hu+' '+Math.max(30,sh[0]-16)+'% '+Math.max(13,sh[1]*.40).toFixed(0)+'%)');
    }
    x.fillStyle=bg; x.beginPath(); x.arc(px,py,R,0,TAU); x.fill();
    x.restore();

    /* bounce light along the shadow side, in the complement */
    x.strokeStyle='hsla(266 48% 76% / '+(.10+e*.24).toFixed(3)+')';
    x.lineWidth=Math.max(.5,R*.055);
    x.beginPath(); x.arc(px,py,R*.985,Math.PI*.20,Math.PI*.86); x.stroke();

    /* specular: a soft one and a tight one, the way a real highlight reads */
    const sp=x.createRadialGradient(px+L,py+U,0,px+L,py+U,R*.46);
    sp.addColorStop(0,'rgba(255,248,252,'+(.17+e*.24).toFixed(3)+')');
    sp.addColorStop(1,'rgba(255,248,252,0)');
    x.fillStyle=sp; x.beginPath(); x.arc(px+L,py+U,R*.46,0,TAU); x.fill();
    x.fillStyle='rgba(255,252,255,'+(.26+e*.28).toFixed(3)+')';
    x.beginPath(); x.arc(px+L*1.04,py+U*1.04,Math.max(.5,R*.11),0,TAU); x.fill();
  }

  /* ── 5. type, on its own plate so it never fights the field ── */
  if(!live){
    const m = st==='playing' ? 'playing without the analyser — sound is fine, the graph is idle'
            : st==='failed'  ? 'playback failed — open Data for the reason'
            : tracks.length  ? ST[st] : 'add audio, or use Live in';
    x.font='500 12px "Space Grotesk",system-ui,sans-serif'; x.textAlign='center';
    const tw=x.measureText(m).width, bx=w/2-tw/2-11, by=h-30;
    const pl=x.createLinearGradient(0,by,0,by+22);
    pl.addColorStop(0,'rgba(20,20,28,.80)'); pl.addColorStop(1,'rgba(12,12,18,.88)');
    x.save();
    x.shadowColor='rgba(0,0,0,.6)'; x.shadowBlur=12; x.shadowOffsetY=3;
    x.fillStyle=pl;
    x.beginPath(); (x.roundRect?x.roundRect(bx,by,tw+22,22,11):x.rect(bx,by,tw+22,22)); x.fill();
    x.restore();
    x.strokeStyle='hsla('+HUE+' 60% 70% / .22)'; x.lineWidth=1;
    x.beginPath(); (x.roundRect?x.roundRect(bx,by,tw+22,22,11):x.rect(bx,by,tw+22,22)); x.stroke();
    x.fillStyle='#B9B7CC'; x.fillText(m,w/2,by+15);
    x.textAlign='left';
  }else{
    x.font='500 10px "IBM Plex Mono",ui-monospace,monospace';
    const line=NB+' bands · '+sat.length+' satellites · '+onsets+' onsets';
    x.fillStyle='rgba(8,8,12,.55)';
    const lw=x.measureText(line).width;
    x.beginPath(); (x.roundRect?x.roundRect(8,7,lw+14,17,8):x.rect(8,7,lw+14,17)); x.fill();
    x.fillStyle='hsla('+HUE+' 34% 82% / .78)'; x.fillText(line,15,19);
  }
}

/* transport */
const say=t=>{const m=$('#wMsg'); if(m)m.textContent=t||''};
/* live microphone input — needs no files at all */
let micStream=null, micSrc=null, micOn=false;
async function toggleMic(){
  if(micOn){
    try{micSrc&&micSrc.disconnect()}catch(e){}
    micStream&&micStream.getTracks().forEach(t=>t.stop());
    micStream=null;micSrc=null;micOn=false;playing=false;
    $('#wMic').classList.remove('key'); say('Live input off.'); return;
  }
  try{
    initAudio(); if(ac.state!=='running')await ac.resume();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false}});
    micSrc=ac.createMediaStreamSource(micStream); micSrc.connect(an);   // analyser only, never to output
    micOn=true; playing=true; $('#wMic').classList.add('key');
    ARC.log('state','Listening live');
    $('#npT').textContent='Live input'; $('#npG').textContent='microphone → graph, not routed to the speakers';
    say('Listening. Play anything out loud and the graph reacts.');
  }catch(e){ say('Microphone blocked: '+(e&&e.name||e)) }
}
function addByUrl(){
  const u=prompt('Direct link to an mp3');
  if(!u)return;
  tracks.push({name:decodeURIComponent(u.split('/').pop().replace(/\?.*$/,'')).replace(/\.[^.]+$/,'')||'linked track',
    url:u.trim(), g:guess(u)});
  if(cur<0)load(tracks.length-1);
  renderLib(); say('Linked. If it will not play, the host is refusing cross-origin audio.');
}
$('#wFile').addEventListener('change',e=>{
  const files=[...e.target.files], keep=[], skip=[];
  for(const f of files){
    const mp3=/\.mp3$/i.test(f.name)||f.type==='audio/mpeg'||f.type==='audio/mp3';
    if(!mp3){skip.push(f.name);continue}
    if(f.size===0){skip.push(f.name+' (empty — still in iCloud?)');continue}
    keep.push(f);
  }
  let dup=0;
  for(const f of keep){
    const nm=f.name.replace(/\.[^.]+$/,'');
    if(tracks.some(t=>t.name===nm&&t.size===f.size)){dup++;continue}
    const t={name:nm,url:URL.createObjectURL(f),g:guess(f.name),size:f.size,
             type:f.type||'(none reported)',persisted:false};
    tracks.push(t);
    ARC.log('state','Added '+nm);
    saveAudioFile(f,t.g).then(id=>{                 // id lands late; the row updates when it does
      t.id=id; t.persisted=true; idbCount++; idbBytes+=f.size; renderLib();
    }).catch(e=>{
      say(`"${f.name}" plays now but was not saved: ${quotaMsg(e)}. It will be gone after a reload.`);
      renderLib();
    });
  }
  if(dup)skip.push(dup+' already in the library');
  if(cur<0&&tracks.length)load(0);
  renderLib();
  say(skip.length ? `Added ${keep.length}. Skipped ${skip.length}: ${skip.slice(0,3).join(', ')}${skip.length>3?'…':''}`
                  : keep.length ? `Added ${keep.length} track${keep.length>1?'s':''}.` : 'Nothing added.');
  e.target.value='';
});

let pendingTrack='';
function renderLib(){
  if(pendingTrack&&tracks.length){
    const i=tracks.findIndex(t=>t.name===pendingTrack);
    pendingTrack='';
    if(i>=0&&cur<0){ cur=i; setSt('selected') }
  }
  let box=$('#wLibBox');
  if(!box){box=el('div','scroll pad');box.id='wLibBox';box.style.maxHeight='40%';
    $('.mod[data-m="state"] .pane[data-p="graph"]').appendChild(box)}
  box.hidden=!libOpen;
  box.innerHTML=tracks.length?tracks.map((t,i)=>`<div class="trkrow">
      <button class="trk" data-i="${i}" aria-current="${i===cur}">
        <span class="tiny n">${String(i+1).padStart(2,'0')}</span>
        <span class="nm">${t.name.replace(/</g,'&lt;')}</span>
        <span class="tiny">${t.g}${t.persisted?'':' · unsaved'}</span>
      </button>
      <button class="btn sm" data-del="${i}" aria-label="Remove">×</button>
    </div>`).join('')+
    `<div class="row spread" style="margin-top:9px">
       <span class="tiny">${idbCount} saved · ${(idbBytes/1048576).toFixed(1)} MB${idbState==='ok'?'':' · '+idbState}</span>
       <button class="btn sm" id="wWipe">Clear library</button>
     </div>`
    :'<div class="hint">Nothing loaded. Files stay on this device and are remembered across reloads.</div>';
  $$('.trk',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i; load(i);play();
    if(tracks[i])ARC.log('state','Playing '+tracks[i].name)});
  $$('[data-del]',box).forEach(b=>b.onclick=e=>{e.stopPropagation();forgetTrack(+b.dataset.del)});
  const wp=$('#wWipe',box); if(wp)wp.onclick=wipeLibrary;
}
function load(i){
  if(!tracks[i])return;
  if(!audio)audio=mkAudio();
  cur=i; lastErr='';
  const t=tracks[i];
  diag={file:t.name,size:t.size!=null?(t.size/1048576).toFixed(2)+' MB':'—',type:t.type||'—',
        url:String(t.url).slice(0,30)+'…',canPlayType:audio.canPlayType('audio/mpeg')||'no',
        readyState:0,networkState:0,lastEvent:'-',audioCtx:ac?ac.state:'not created'};
  audio.src=t.url; audio.load();
  $('#npT').textContent=t.name; setSt('selected'); segs=[]; renderLib();
}
async function play(){
  if(cur<0){say('Add an mp3 first.');return}
  try{
    await audio.play();                 // element first: this is the part that must work
    playing=true; setSt('playing'); say('');
    attachGraph();                      // analysis is a bonus, attached afterwards
  }catch(err){
    playing=false; setSt('failed');
    lastErr=(err&&err.name||'')+': '+(err&&err.message||err);
    diag.playError=lastErr;
    say('Playback refused — '+lastErr+'. Open Data for the full readout.');
  }
}

function vizPane(){
  const p=$('#wVizPane'); const maxB=Math.max(.001,...bandE);
  const d=Object.entries(diag);
  const audioCard=`
   <div class="card"><h3>Audio readout — state: ${ST[st]||st}</h3>
     ${cur<0?'<div class="hint">No track selected.</div>':
       d.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${String(v).replace(/</g,'&lt;')}</b></div>`).join('')}
     <div class="kv"><span>analyser</span><b>${graph}</b></div>
     <div class="row" style="gap:6px;margin-top:8px"><button class="btn sm" id="wShare">Share what is playing</button></div>
     ${lastErr?`<div class="read">${lastErr.replace(/</g,'&lt;')}</div>`:''}
     <div class="read">readyState 4 and networkState 1 mean the browser has the file and can play it. If sound is missing while state says playing, the analyser took the output — press Plain.</div>
   </div>`;
  /* the readouts obey the same light as the graph: a lit top edge, a
     tinted glow under the tallest bars, and hue that drifts with the band
     rather than one flat pink. */
  const defs=`<defs>
      <linearGradient id="wBar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${TONE.state.c2}"/><stop offset=".22" stop-color="${TONE.state.c}"/>
        <stop offset="1" stop-color="${TONE.state.deep}"/></linearGradient>
      <linearGradient id="wBarDim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4A4560"/><stop offset="1" stop-color="#27243A"/></linearGradient>
      <filter id="wGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="${TONE.state.c}" flood-opacity=".55"/></filter>
      <linearGradient id="wFloor" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${TONE.state.c}" stop-opacity="0"/>
        <stop offset=".5" stop-color="${TONE.state.c}" stop-opacity=".45"/>
        <stop offset="1" stop-color="${TONE.state.c}" stop-opacity="0"/></linearGradient>
    </defs>`;
  const bars=[...bandE].map((v,i)=>{
    const f=v/maxB, H=Math.max(2,f*50), y=54-H, hot=f>.25;
    return `<g${hot?' filter="url(#wGlow)"':''}>`+
      `<rect x="${i*21+2}" y="${y}" width="17" height="${H}" rx="2.5"
         fill="${hot?'url(#wBar)':'url(#wBarDim)'}"/>`+
      `<rect x="${i*21+2}" y="${y}" width="17" height="${Math.min(2,H)}" rx="1"
         fill="#FFFFFF" opacity="${(.16+f*.5).toFixed(2)}"/></g>`;
  }).join('')+`<rect x="0" y="54" width="296" height="1.4" fill="url(#wFloor)"/>`;
  let cells='', cmax=.001;
  for(let i=0;i<NB;i++)for(let j=i+1;j<NB;j++)if(coact[i*NB+j]>cmax)cmax=coact[i*NB+j];
  for(let i=0;i<NB;i++)if(bandE[i]>cmax)cmax=bandE[i];
  for(let i=0;i<NB;i++)for(let j=0;j<NB;j++){
    const c=i===j?bandE[i]:coact[Math.min(i,j)*NB+Math.max(i,j)];
    const t=clamp(c/cmax,0,1);
    /* a proper sequential ramp: dark slate -> plum -> the page pink,
       so the eye reads magnitude, not just "some pink" */
    const L=(9+t*t*50).toFixed(1), S=(18+t*70).toFixed(0), hu=(HUE+10-t*10).toFixed(0);
    cells+=`<rect x="${j*13}" y="${i*13}" width="12" height="12" rx="2"
      fill="hsl(${hu} ${S}% ${L}%)"${t>.55?' filter="url(#wGlow)"':''}/>`;
  }
  const last=segs.slice(-40);
  p.innerHTML=`<svg width="0" height="0" aria-hidden="true" style="position:absolute">${defs}</svg>`+audioCard+`
   <div class="card"><h3>Band energy — 14 log bands</h3>
     <svg viewBox="0 0 296 58" width="100%" height="62">${bars}</svg>
     <div class="kv"><span>Loudness</span><b>${(rms*100).toFixed(0)}%</b></div>
     <div class="kv"><span>Spectral centroid</span><b>${(centroid*100).toFixed(0)}%</b></div>

             fill="var(--ac)" opacity="${(a*.07).toFixed(3)}"/>`}).join('')}
       <rect x="0" y="57" width="296" height="1.4" fill="url(#wFloor)"/>
     </svg>
     <div class="kv"><span>Onsets detected</span><b>${onsets}</b></div>

  const ws=$('#wShare');

        (t&&audio&&audio.duration?' · '+fmt(audio.duration):''),

/* ── voice: record, 3P+N multiplier, browser loop ────────
   This is Product 1 from the spec — the lightweight synthetic
   loop. No file is rendered; the element repeats and a timer
   stops it at the chosen duration. The rendered export stays
   on the Python/FFmpeg service.                               */
let rec=null, chunks=[], recURL=null, recStart=0, recMS=0, recInfo='';
const loopA=new Audio(); loopA.loop=true;
let loopEnd=0, loopTimer=null, P_=8000000000, N_=1000000000, HRS=1;
const mult=()=>3*P_+N_;
const big=n=>{const u=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for(const[v,x]of u)if(n>=v)return (n/v).toFixed(2).replace(/\.?0+$/,'')+x; return String(n)};

/* Safari and Chrome disagree about container formats, so ask rather than assume. */
function recMime(){
  if(typeof MediaRecorder==='undefined')return null;
  for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])
    if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;
  return '';                                  // let the browser pick
}
const vErr=t=>{const e=$('#vErr'); if(e)e.textContent=t||''};
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    vErr(SECURE?'This browser exposes no microphone API.'
               :'The microphone is blocked because this page is not on https or localhost. Diagnostics shows the current origin.');
    return;
  }
  if(typeof MediaRecorder==='undefined'){ vErr('This browser has no MediaRecorder, so it cannot record here.'); return }
  let st;
  try{ st=await navigator.mediaDevices.getUserMedia({audio:true}) }
  catch(e){
    const n=e&&e.name||'';
    vErr(n==='NotAllowedError' ? 'Microphone permission was refused. Allow it for this site and tap Record again.'
       : n==='NotFoundError'   ? 'No microphone was found on this device.'
       : n==='NotReadableError'? 'Another app is holding the microphone. Close it and try again.'
       : 'Microphone unavailable: '+(n||e));
    return;
  }
  try{
    const mime=recMime();
    chunks=[];
    const r = mime ? new MediaRecorder(st,{mimeType:mime}) : new MediaRecorder(st);
    rec=r;                                     // keep a local handle: `rec` is cleared before onstop fires
    r.ondataavailable=e=>{ if(e.data&&e.data.size)chunks.push(e.data) };
    r.onerror=e=>{ vErr('Recording failed: '+((e.error&&e.error.name)||'unknown')); st.getTracks().forEach(t=>t.stop()); rec=null; voicePane() };
    r.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());
      const total=chunks.reduce((a,c)=>a+c.size,0);
      if(!total){ vErr('The recorder produced no audio. Check that the microphone is not muted.'); rec=null; voicePane(); return }
      const b=new Blob(chunks,{type:r.mimeType||mime||'audio/webm'});
      if(recURL)URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(b); recMS=performance.now()-recStart;
      recInfo=`${(total/1024).toFixed(0)} KB · ${r.mimeType||mime||'unknown type'}`;
      rec=null; vErr(''); voicePane();
      ARC.log('state','Recorded '+fmt(recMS/1000)+' · '+(total/1024).toFixed(0)+' KB');
    };
    r.start(250);                              // periodic chunks, so a long take is not one giant blob
    recStart=performance.now(); vErr(''); voicePane();
  }catch(e){ vErr('Could not start recording: '+(e&&e.message||e)); rec=null; voicePane() }
}
function stopRec(){ if(rec&&rec.state!=='inactive')rec.stop() }   // onstop clears rec, not us
function startLoop(){
  if(!recURL)return;
  loopA.src=recURL; loopA.currentTime=0; loopA.play().catch(()=>{});
  loopEnd=Date.now()+HRS*3600*1000;
  clearInterval(loopTimer);
  loopTimer=setInterval(()=>{
    if(Date.now()>=loopEnd){stopLoop();return}
    const el=$('#vLoopT'); if(el)el.textContent=fmt((loopEnd-Date.now())/1000)+' left';
  },1000);
  voicePane();
}
function stopLoop(){ loopA.pause(); clearInterval(loopTimer); loopTimer=null; voicePane() }
function voicePane(){
  const live=rec&&rec.state==='recording';
  $('#vPane').innerHTML=`
   <div class="card">
     <h3>Record</h3>
     <div class="row spread">
       <div><div class="v n" style="font:600 26px var(--mono)">${recURL?fmt(recMS/1000):'0:00'}</div>
         <div class="tiny">${live?'recording…':recURL?('clip ready · '+recInfo):'nothing recorded'}</div></div>
       <button class="btn ${live?'go':'key'}" id="vRec">${live?'Stop':'Record'}</button>
     </div>
     ${recURL?`<audio controls src="${recURL}" style="width:100%;margin-top:10px"></audio>
       <div class="row" style="margin-top:8px;gap:6px">
         <a class="btn sm" href="${recURL}" download="voice-clip${/mp4/.test(recInfo)?'.m4a':/ogg/.test(recInfo)?'.ogg':'.webm'}">Download clip</a>
       </div>`:''}
     <div class="hint" id="vErr" style="margin-top:8px"></div>
     <div class="read">The browser records Opus in a WebM container. Converting to mp3 or wav is the FFmpeg service's job — this page does not transcode.</div>
   </div>
   <div class="card">
     <h3>Multiplier — 3P + N</h3>
     <div class="row" style="gap:7px">
       <input class="field" id="vP" inputmode="numeric" value="${P_}" style="flex:1;margin:0" aria-label="Population">
       <input class="field" id="vN" inputmode="numeric" value="${N_}" style="flex:1;margin:0" aria-label="Additional">
     </div>
     <div class="row spread" style="margin-top:9px">
       <span class="tiny">3 × population + additional</span>
       <b class="n" style="font-size:22px;color:var(--ac2)">${big(mult())}</b>
     </div>
     <div class="read">A calculated figure, not a file size. The loop below plays one clip continuously — it never renders billions of copies.</div>
   </div>
   <div class="card">
     <h3>Continuous loop</h3>
     <div class="chips">
       ${[1,5,10].map(h=>`<button class="chip" data-h="${h}" aria-pressed="${HRS===h}">${h} hour${h>1?'s':''}</button>`).join('')}
     </div>
     <div class="row spread" style="margin-top:10px">
       <span class="tiny n" id="vLoopT">${loopTimer?'starting…':'idle'}</span>
       <button class="btn ${loopTimer?'go':'key'}" id="vLoop" ${recURL?'':'disabled'}>${loopTimer?'Stop loop':'Play loop'}</button>
     </div>
   </div>`;
  $('#vRec').onclick=()=>live?stopRec():startRec();
  $('#vLoop').onclick=()=>loopTimer?stopLoop():startLoop();
  $('#vP').onchange=e=>{P_=Math.max(0,parseInt(e.target.value)||0);voicePane()};
  $('#vN').onchange=e=>{N_=Math.max(0,parseInt(e.target.value)||0);voicePane()};
  $$('#vPane .chip[data-h]').forEach(b=>b.onclick=()=>{HRS=+b.dataset.h;voicePane()});
}

/* ── sealed: real AES-GCM, offline ──────────────────────
   Not a chat — a chat needs transport and key exchange. This
   is the part that can be honest in one file: seal text with a
   shared passphrase, paste the blob into whatever channel you
   already use, unseal it on the other side.                   */
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(){
  const pass=$('#sKey').value, txt=$('#sIn').value;
  if(!pass||!txt){$('#sOut').value='Passphrase and message are both required.';return}
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await keyFrom(pass,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(txt));
  $('#sOut').value='PLATE1.'+b64(salt)+'.'+b64(iv)+'.'+b64(ct);
}
async function unseal(){
  const pass=$('#sKey').value, blob=$('#sIn').value.trim();
  const p=blob.split('.');
  if(p[0]!=='PLATE1'||p.length!==4){$('#sOut').value='That is not a sealed message.';return}
  try{
    const k=await keyFrom(pass,unb64(p[1]));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[2])},k,unb64(p[3]));
    $('#sOut').value=dec.decode(pt);
  }catch(e){ $('#sOut').value='Wrong passphrase, or the message was altered.' }
}
/* ── chat ───────────────────────────────────────────────
   Real transport, real persistence, still end-to-end encrypted.
   Polling rather than a socket: on a weak connection a dropped
   websocket is worse than a request that simply retries.       */
const CFG='plate:chat';
let cfg={url:'',key:'',room:'',pass:'',me:'me'};
let msgs=[], outbox=[], poll=null, net='idle', chatErr='', busyChat=false;

function loadCfg(){
  try{ const r=localStorage.getItem(CFG); if(r)cfg={...cfg,...JSON.parse(r)} }catch(e){}
}
function saveCfg(){ try{ localStorage.setItem(CFG,JSON.stringify(cfg)) }catch(e){} }
const configured=()=>cfg.url&&cfg.key&&cfg.room&&cfg.pass;
const newRoom=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);
  return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')};

async function rest(path,opts={}){
  const base=cfg.url.replace(/\/+$/,'');
  const r=await fetch(`${base}/rest/v1/${path}`,{
    ...opts,
    headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,
      'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}
  });
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error(`HTTP ${r.status} ${t.slice(0,120)}`) }
  return r.status===204?null:r.json();
}
async function sealFor(txt){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await keyFrom(cfg.pass,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(txt));
  return 'PLATE1.'+b64(salt)+'.'+b64(iv)+'.'+b64(ct);
}
async function openMsg(blob){
  const p=String(blob).split('.');
  if(p[0]!=='PLATE1'||p.length!==4)return {t:'(not a Plate message)',bad:true};
  try{
    const k=await keyFrom(cfg.pass,unb64(p[1]));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[2])},k,unb64(p[3]));
    return {t:dec.decode(pt)};
  }catch(e){ return {t:'(cannot decrypt — different passphrase)',bad:true} }
}
async function pullChat(){
  if(!configured()||busyChat)return;
  busyChat=true;
  try{
    const rows=await rest(`plate_messages?select=id,sender,body,created_at`+
      `&room=eq.${encodeURIComponent(cfg.room)}&order=created_at.asc&limit=200`);
    const out=[];
    for(const r of rows||[]){
      const known=msgs.find(m=>m.id===r.id);
      if(known){out.push(known);continue}
      const {t,bad}=await openMsg(r.body);
      out.push({id:r.id,sender:r.sender,text:t,bad,at:Date.parse(r.created_at)||Date.now(),state:'sent'});
    }
    msgs=out; net='ok'; chatErr='';
  }catch(e){ net='error'; chatErr=String(e.message||e) }
  finally{ busyChat=false; if(ARC.cur==='state'&&ARC.pane==='seal')chatPane() }
}
async function flushOutbox(){
  if(!configured()||!outbox.length)return;
  const still=[];
  for(const m of outbox){
    try{
      const body=await sealFor(m.text);
      await rest('plate_messages',{method:'POST',
        body:JSON.stringify({room:cfg.room,sender:cfg.me,body})});
      m.state='sent';
    }catch(e){ m.state='queued'; m.err=String(e.message||e); still.push(m) }
  }
  outbox=still;
  await pullChat();
}
async function sendChat(){
  const i=$('#cIn'); if(!i)return;
  const txt=i.value.trim(); if(!txt)return;
  if(!configured()){ chatErr='Fill in the connection settings first.'; chatPane(); return }
  i.value='';
  const m={id:'local-'+Date.now(),sender:cfg.me,text:txt,at:Date.now(),state:'sending'};
  msgs.push(m); outbox.push(m); chatPane();
  await flushOutbox(); chatPane(); i.focus();
}
function startPolling(){
  clearInterval(poll);
  if(!configured())return;
  pullChat();
  poll=setInterval(()=>{ if(ARC.cur==='state'&&ARC.pane==='seal')pullChat() },5000);
}
function chatPane(){
  const el=$('#sPane'); if(!el)return;
  const setup=!configured();
  const line=m=>{
    const mine=m.sender===cfg.me;
    const tag=m.state==='sending'?'sending…':m.state==='queued'?'queued — will retry':'';
    return `<div class="bub ${mine?'me':'them'}${m.bad?' bad':''}">
      <div>${String(m.text).replace(/</g,'&lt;')}</div>
      <div class="bt">${mine?'you':m.sender} · ${new Date(m.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${tag?' · '+tag:''}</div>
    </div>`;
  };
  el.innerHTML=`
   ${setup?'':`<div class="card" style="padding:9px 10px">
     <div class="row spread">
       <span class="tiny">${net==='ok'?'connected':net==='error'?'offline — retrying':'connecting…'}${outbox.length?` · ${outbox.length} queued`:''}</span>
       <button class="btn sm" id="cCfg">Settings</button>
     </div>
     ${chatErr?`<div class="hint" style="margin-top:5px">${chatErr.replace(/</g,'&lt;')}</div>`:''}
   </div>
   <div id="cList">${msgs.length?msgs.map(line).join(''):'<div class="hint">No messages yet. Say something.</div>'}</div>
   <div class="entry" style="margin-top:10px">
     <input id="cIn" placeholder="Message…" autocomplete="off">
     <button class="btn go" id="cGo">Send</button>
   </div>`}
   <div class="card" id="cSetup" ${setup?'':'hidden'} style="margin-top:10px">
     <h3>Connection</h3>
     <input class="field" id="cUrl"  placeholder="https://xxxx.supabase.co" value="${cfg.url}">
     <input class="field" id="cKey"  placeholder="anon public key" value="${cfg.key}">
     <input class="field" id="cRoom" placeholder="room id" value="${cfg.room}">
     <input class="field" id="cMe"   placeholder="your name" value="${cfg.me}">
     <input class="field" id="cPass" type="password" placeholder="shared passphrase" value="${cfg.pass}">
     <div class="row" style="gap:6px">
       <button class="btn go" id="cSave">Save</button>
       <button class="btn sm" id="cRoll">New room id</button>
       <button class="btn sm" id="cTest">Test</button>
     </div>
     <div class="read">Run <b>docs/chat-schema.sql</b> in Supabase once, then paste the project URL and anon key. Messages are encrypted in this browser before upload — the server stores ciphertext and never holds the passphrase. The room id is the other half of the credential, so send it and the passphrase to her by some other route, and keep the generated one rather than inventing a short name.</div>
   </div>`;
  const g=$('#cGo'); if(g)g.onclick=sendChat;
  const i=$('#cIn'); if(i)i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}};
  const c=$('#cCfg'); if(c)c.onclick=()=>{const b=$('#cSetup');b.hidden=!b.hidden};
  const sv=$('#cSave'); if(sv)sv.onclick=()=>{
    cfg={url:$('#cUrl').value.trim(),key:$('#cKey').value.trim(),room:$('#cRoom').value.trim(),
         me:$('#cMe').value.trim()||'me',pass:$('#cPass').value};
    if(cfg.room.length<16)cfg.room=newRoom();
    saveCfg(); msgs=[]; chatErr=''; chatPane(); startPolling();
  };
  const rl=$('#cRoll'); if(rl)rl.onclick=()=>{$('#cRoom').value=newRoom()};
  const tb=$('#cTest'); if(tb)tb.onclick=async()=>{
    const u=$('#cUrl').value.trim(), k=$('#cKey').value.trim();
    const box=$('#cSetup');
    try{
      const r=await fetch(u.replace(/\/+$/,'')+'/rest/v1/plate_messages?select=id&limit=1',
        {headers:{apikey:k,Authorization:'Bearer '+k}});
      chatErr = r.ok ? '' : `Supabase answered HTTP ${r.status}. ${r.status===404?'The table is missing — run docs/chat-schema.sql.':'Check the URL and anon key.'}`;
      if(r.ok)chatErr='Connection works.';
    }catch(e){ chatErr='Could not reach Supabase: '+(e.message||e) }
    chatPane(); if(box)$('#cSetup').hidden=false;
  };
  const list=$('#cList'); if(list)list.scrollTop=list.scrollHeight;
}
const sealPane=chatPane;      // the pane key stays 'seal'

ARC.register({

  load(d){ if(!d)return;

  health:()=>[['audio library', idbState==='ok'?`${idbCount} tracks · ${(idbBytes/1048576).toFixed(1)} MB`:idbState,

/* ═══════════════ MATE — green · converging streams ═══════
   Engine is the perft-verified generator from v1. New here:
   eval is split into value / position / tempo, and image-3
   renders those three as streams feeding a control matrix.  */
mod('mate',()=>{
const VS='\uFE0E';   // text-presentation selector: stops iOS colouring the pawn
/* one pair of colours for the two sides wherever influence is drawn:
   the board layer, the Data pane and the hub card all agree */
const MYC='#8FF0BA', OPC='#F2968F';
const GLYPH={k:'♚'+VS,q:'♛'+VS,r:'♜'+VS,b:'♝'+VS,n:'♞'+VS,p:'♟'+VS};
const VAL={p:100,n:320,b:330,r:500,q:900,k:20000};
const PST={
p:[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5,

/* ── geometry of influence ──────────────────────────────
   A knight's eight squares all sit on one circle: every (±1,±2)
   offset has length sqrt(5). Its influence is a RING — it cannot be
   blocked, because it never passes through the squares between.
   Every other piece projects along VECTORS, and a vector stops at
   the first occupied square it meets.

   as a position closes and bishops gain as it opens, and it is
   measurable from the board alone.                                  */

      // them in swamps the signal.

    '<radialGradient id="gkb"><stop offset="0" stop-color="'+BC+'" stop-opacity=".38"/><stop offset="1" stop-color="'+BC+'" stop-opacity="0"/></radialGradient></defs>';
  for(let i=0;i<64;i++){ const v=gm.reach[i]; if(!v)continue;
    o+='<rect x="'+(i%8)*10+'" y="'+(i/8|0)*10+'" width="10" height="10" fill="'+(v>0?WC:BC)+'" opacity="'+(Math.min(3,Math.abs(v))/3*(focus==null?.16:.07)).toFixed(3)+'"/>' }
  const dimA=focus==null?1:.25;
  for(let i=0;i<64;i++){ const p=S.b[i]; if(!p)continue;
    const col=p[0], k=p[1], K=col==='w'?WC:BC, [cx,cy]=C(i), a=i===focus?3:dimA;
    if(k==='k'){ o+='<circle cx="'+cx+'" cy="'+cy+'" r="16" fill="url(#gk'+col+')" opacity="'+(focus==null||i===focus?1:.35)+'"/>'; continue }
    if(k==='n'){ for(const t of ring(S.b,i,col)){ const [tx,ty]=C(t.sq);
        o+=P8.arc(cx,cy,tx,ty,.3,{k:K,w:i===focus?1.8:1.1,a:Math.min(1,.5*a),dash:'2.4 2'}).replace('/>',NS+'/>') } continue }
    if(k==='p'){ const d=col==='w'?-1:1, r=i/8|0, c=i%8;

        o+=P8.vec(cx,cy,cx+(tx-cx)*.55,cy+(ty-cy)*.55,{k:K,w:i===focus?1.8:1.1,a:Math.min(1,.42*a)}).replace('/>',NS+'/>') } continue }
    for(const ray of rays(S.b,i,k)){ if(!ray.len)continue;
      const bl=ray.blocker, own=bl!==null&&S.b[bl][0]===col; if(own&&ray.free===0)continue;

         '<circle cx="'+jx+'" cy="'+jy+'" r="4.6" fill="none" stroke="'+(mine?WC:BC)+'" stroke-width="1.6"'+NS+'/>' }

    : 'Straight lines are vectors that stop at the first piece; dashed arcs are knights, which jump; the glow is each king\u2019s field.';
}

/* Static eval mid-exchange lies: it scored Rg1?, Bxg1 as a blunder and the
   recapture Nxg1 as an engine slip. Resolving captures first (the engine's
   own quiescence) compares quiet positions, so a trade reads as a trade.
   The search counters are borrowed and restored, never left changed. */
function quietEval(P){
  const sb=budget, sn=nodes; budget=8000; nodes=0;
  const v=quiesce(P,-1e9,1e9,4)*(P.turn==='w'?1:-1);
  budget=sb; nodes=sn; return v;
}
/* The eval before your move against the eval after the engine's reply, in
   centipawns from your side. A drop that size is what a blunder is — the
   engine found something your move allowed. Logged, never nagged. */
function swing(){
  if(over||hist.length<2)return;
  /* hist holds the position before each half-move: [-2] is before your
     move, and S is after the engine's reply — both with you to move */
  const before=quietEval(hist[hist.length-2].S), after=quietEval(S), d=after-before;
  const mv=Math.ceil(hist.length/2);
  if(d<=-250)ARC.log('mate','Blunder on move '+mv+' · '+(d/100).toFixed(1));
  else if(d<=-120)ARC.log('mate','Inaccuracy on move '+mv+' · '+(d/100).toFixed(1));
  else if(d>=250)ARC.log('mate','Engine slipped on move '+mv+' · +'+(d/100).toFixed(1));
}
